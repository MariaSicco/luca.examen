<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Agencia — el juego de Valoración Aduanera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f4;--paper:#fff;--ink:#1c2229;--muted:#5c6672;--line:#dde3ea;
  --brand:#8a1c1c;--brand-soft:#f3e3df;
  --concept:#22548c;--concept-soft:#e4edf6;--concept-line:#bcd2ea;
  --ok:#1f7a4d;--ok-soft:#e3f2e9;--ok-line:#bfe0cd;
  --err:#b5451d;--err-soft:#fbe8e0;--err-line:#f0cbb9;
  --gold:#9a7414;--gold-soft:#f6edd6;--gold-line:#e6d3a3;
  --purple:#7a3c9a;--purple-soft:#efe4f5;
  --navy:#14263d;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;min-height:100vh}
button{font-family:inherit;cursor:pointer}
h1,h2,h3{font-family:Fraunces,Georgia,serif;letter-spacing:-.01em;margin:0}
.hide{display:none!important}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.logo-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#c9a23a,#8a1c1c);display:grid;place-items:center;font-family:Fraunces;font-weight:700;font-size:18px;flex:none}
.logo b{font-family:Fraunces;font-size:1.08rem;font-weight:700;display:block;line-height:1.1;white-space:nowrap}
.logo small{font-size:.7rem;opacity:.7;display:block;white-space:nowrap}
.top .sp{flex:1}
.rankpill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 12px;font-size:.78rem;font-weight:600;white-space:nowrap;display:flex;gap:8px;align-items:center}
.rankpill .xp{color:#f2cf6a}
.tbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:10px;padding:7px 10px;font-size:.82rem;font-weight:600;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.16)}
@media(max-width:640px){.logo small,.rankpill .rn,.tbtn .lbl{display:none}.top{gap:8px;padding:9px 12px}}

.wrap{max-width:980px;margin:0 auto;padding:22px 16px 90px}

/* ---------- map ---------- */
.hero{background:linear-gradient(135deg,#14263d 0%,#22548c 100%);color:#fff;border-radius:22px;padding:26px 26px 22px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(1.6rem,4vw,2.3rem);line-height:1.1}
.hero p{opacity:.88;max-width:560px;margin:10px 0 0}
.hero .ship{position:absolute;right:-10px;bottom:-14px;opacity:.16;width:240px}
.herostats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.hs{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px 14px}
.hs b{display:block;font-family:Fraunces;font-size:1.25rem}
.hs span{font-size:.72rem;opacity:.8;text-transform:uppercase;letter-spacing:.05em}
.rankbar{margin-top:16px;max-width:520px}
.rankbar .trk{height:8px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}
.rankbar .fill{height:100%;background:linear-gradient(90deg,#f2cf6a,#e59a3a);border-radius:99px;transition:width .6s}
.rankbar .lb{display:flex;justify-content:space-between;font-size:.74rem;opacity:.85;margin-top:5px}

.zone{margin-top:26px;background:var(--paper);border-radius:22px;padding:22px 18px 26px;border:1px solid var(--line)}
.zonehead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.ztag{background:var(--concept);color:#fff;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px}
.zonehead h2{font-size:1.45rem}
.zonehead .zp{margin-left:auto;font-size:.85rem;color:var(--muted);font-weight:600}
.zonesub{color:var(--muted);font-size:.92rem;margin:0 0 10px}
.path{position:relative;padding:10px 0}
.node{display:flex;align-items:center;gap:16px;position:relative;margin:0 auto;max-width:640px;padding:10px 0}
.node:nth-child(4n+2){transform:translateX(9%)}
.node:nth-child(4n+3){transform:translateX(15%)}
.node:nth-child(4n+4){transform:translateX(6%)}
.node:nth-child(4n+1){transform:translateX(-4%)}
.nbtn{flex:none;width:74px;height:74px;border-radius:50%;border:none;position:relative;display:grid;place-items:center;font-family:Fraunces;font-weight:700;font-size:1.45rem;color:#fff;background:var(--concept);box-shadow:0 6px 0 #173b63,0 10px 18px rgba(34,84,140,.25);transition:transform .12s}
.nbtn:active{transform:translateY(3px);box-shadow:0 3px 0 #173b63}
.node.done .nbtn{background:var(--ok);box-shadow:0 6px 0 #145234,0 10px 18px rgba(31,122,77,.25)}
.node.locked .nbtn{background:#c3cad3;box-shadow:0 6px 0 #9aa3ae;color:#eef1f4;cursor:not-allowed}
.node.current .nbtn{animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 #173b63,0 0 0 0 rgba(34,84,140,.45)}50%{box-shadow:0 6px 0 #173b63,0 0 0 14px rgba(34,84,140,0)}}
.nbtn .crit{position:absolute;top:-4px;right:-4px;background:var(--gold);color:#fff;font-size:.7rem;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:Inter;border:2px solid #fff}
.ninfo{min-width:0}
.ninfo .nt{font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.ninfo h3{font-size:1.05rem;line-height:1.2;margin:2px 0}
.ninfo .ns{font-size:.82rem;color:var(--muted)}
.stars{color:#d6a51c;letter-spacing:2px;font-size:.95rem}
.stars .off{color:#cfd5dc}
.zonelock{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.zl{border:2px dashed var(--line);border-radius:18px;padding:16px;color:var(--muted);background:#fafbfc}
.zl b{display:block;font-family:Fraunces;font-size:1.1rem;color:var(--ink)}
@media(max-width:640px){.hs{padding:6px 10px}.hs b{font-size:1.05rem}.hs span{font-size:.62rem}.hero{padding:22px 18px 18px}.zonelock{grid-template-columns:1fr}.node{transform:none!important}.nbtn{width:62px;height:62px;font-size:1.2rem}}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.mode{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px 18px;text-align:left;display:flex;gap:14px;align-items:center}
.mode:hover{border-color:var(--concept-line);background:#fbfdff}
.mode .mi{font-size:1.8rem;flex:none}
.mode b{display:block;font-family:Fraunces;font-size:1.08rem}
.mode span{font-size:.84rem;color:var(--muted)}
.mode[disabled]{opacity:.5;cursor:not-allowed}
@media(max-width:640px){.modes{grid-template-columns:1fr}}

/* ---------- level ---------- */
.lvtop{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.xbtn{background:var(--paper);border:1px solid var(--line);border-radius:12px;width:42px;height:42px;font-size:1.1rem;flex:none}
.prog{flex:1;height:12px;background:#dfe4ea;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#2f7fd0,#1f7a4d);border-radius:99px;transition:width .4s}
.lvcount{font-size:.82rem;color:var(--muted);font-weight:700;white-space:nowrap}
.card{background:var(--paper);border-radius:var(--r);border:1px solid var(--line);padding:22px;box-shadow:0 2px 0 rgba(20,38,61,.04);animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.who{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:Fraunces;font-weight:700;color:#fff;font-size:1.15rem;flex:none}
.who b{display:block;font-size:.95rem}
.who span{font-size:.78rem;color:var(--muted)}
.bubble{background:#f5f7fa;border-radius:4px 16px 16px 16px;padding:14px 16px;font-size:1rem}
.steptag{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:4px 10px;border-radius:99px;margin-bottom:10px}
.tag-brief{background:var(--concept-soft);color:var(--concept)}
.tag-choice{background:var(--purple-soft);color:var(--purple)}
.tag-classify,.tag-order{background:var(--gold-soft);color:var(--gold)}
.tag-calc{background:var(--ok-soft);color:var(--ok)}
.tag-spot{background:var(--err-soft);color:var(--err)}
.card h2{font-size:1.35rem;line-height:1.2;margin-bottom:10px}
.q{font-size:1.08rem;font-weight:600;margin:4px 0 14px}
.key{margin-top:14px;background:var(--concept-soft);border-left:4px solid var(--concept);border-radius:10px;padding:12px 14px;font-size:.95rem}
.key b:first-child{color:var(--concept)}
.trap{margin-top:12px;background:var(--err-soft);border-left:4px solid var(--err);border-radius:10px;padding:12px 14px;font-size:.93rem}
.verify{display:inline-block;background:var(--gold-soft);border:1px solid var(--gold-line);color:#7a5a09;font-size:.76rem;font-weight:700;border-radius:8px;padding:2px 8px;margin:0 2px}
.reveal-list{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:8px}
.reveal-list li{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;animation:rise .3s ease;display:flex;gap:10px}
.reveal-list li .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--concept);color:#fff;font-size:.78rem;font-weight:700;display:grid;place-items:center;margin-top:1px}
.speak{background:var(--concept-soft);border:1px solid var(--concept-line);color:var(--concept);border-radius:99px;padding:5px 12px;font-size:.8rem;font-weight:700;float:right;margin-left:10px}
.speak.on{background:var(--concept);color:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem;margin:10px 0}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.tbl th{background:#f3f6f9;font-weight:700}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto}

/* options */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:13px 16px;font-size:.98rem;color:var(--ink);transition:all .12s}
.opt:hover:not([disabled]){border-color:var(--concept-line);background:#fbfdff}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--err);background:var(--err-soft);opacity:.75}
.opt[disabled]{cursor:default}

/* chips / buckets */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:12px;background:#f5f7fa;border-radius:14px;border:1px dashed var(--line);margin-bottom:14px}
.chip{background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 12px;font-size:.9rem;font-weight:500;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;max-width:100%;text-align:left}
.chip.sel{border-color:var(--concept);background:var(--concept-soft);transform:translateY(-2px)}
.chip.placed{border-color:var(--ok-line);background:var(--ok-soft);border-bottom-width:2px;cursor:default;font-size:.84rem}
.chip.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.ghost{position:fixed;z-index:99;pointer-events:none;opacity:.92;transform:rotate(-3deg);box-shadow:0 10px 24px rgba(0,0,0,.2)}
.buckets{display:grid;gap:12px}
.bucket{border:2px solid var(--line);border-radius:16px;padding:10px;min-height:96px;background:#fff;transition:all .12s}
.bucket.hot{border-color:var(--concept);background:var(--concept-soft)}
.bucket h4{margin:0 0 8px;font-size:.85rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.bucket .in{display:flex;flex-wrap:wrap;gap:6px}
.b-ok h4{color:var(--ok)}.b-err h4{color:var(--err)}.b-con h4{color:var(--concept)}.b-gold h4{color:var(--gold)}.b-pur h4{color:var(--purple)}
.hintline{font-size:.8rem;color:var(--muted);margin:-6px 0 10px}
.slots{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.slot{display:flex;align-items:center;gap:10px;border:2px dashed var(--line);border-radius:12px;padding:8px 10px;min-height:46px;background:#fff}
.slot .sn{flex:none;width:28px;height:28px;border-radius:50%;background:#e9edf2;color:var(--muted);font-weight:800;display:grid;place-items:center;font-size:.85rem}
.slot.filled{border-style:solid;border-color:var(--ok-line);background:var(--ok-soft)}
.slot.filled .sn{background:var(--ok);color:#fff}
.slot.next{border-color:var(--concept)}

/* calc */
.doc{background:#fffdf7;border:1px solid #eadfbf;border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:.9rem;box-shadow:inset 0 0 0 4px #fffaf0}
.doc .dh{font-family:Fraunces;font-weight:700;font-size:1rem;display:flex;justify-content:space-between;border-bottom:1px dashed #d9caa0;padding-bottom:6px;margin-bottom:8px}
.doc .dl{display:flex;justify-content:space-between;gap:14px;padding:3px 0}
.doc .dl span:last-child{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.field{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:#fff}
.field.done{background:var(--ok-soft);border-color:var(--ok-line)}
.field.locked{opacity:.45;pointer-events:none}
.field label{font-weight:600;font-size:.93rem;display:block;margin-bottom:8px}
.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.frow .u{font-weight:700;color:var(--muted);font-size:.85rem}
.frow input{flex:1;min-width:130px;font:inherit;font-size:1.02rem;padding:10px 12px;border:2px solid var(--line);border-radius:10px;font-variant-numeric:tabular-nums}
.frow input:focus{outline:none;border-color:var(--concept)}
.btn{border:none;border-radius:12px;padding:11px 18px;font-weight:700;font-size:.95rem;background:var(--concept);color:#fff;border-bottom:3px solid #173b63}
.btn:active{transform:translateY(2px);border-bottom-width:1px}
.btn.ghostb{background:#fff;color:var(--concept);border:2px solid var(--concept-line)}
.btn.okb{background:var(--ok);border-bottom-color:#145234}
.btn.big{padding:14px 22px;font-size:1.02rem;width:100%}
.fmsg{font-size:.88rem;margin-top:8px}
.fmsg.e{color:var(--err)}.fmsg.o{color:var(--ok)}
.howbtn{background:none;border:none;color:var(--concept);font-weight:700;font-size:.85rem;padding:6px 0;text-decoration:underline}

/* spot */
.sdoc{background:#fffdf7;border:1px solid #eadfbf;border-radius:12px;overflow:hidden;margin-bottom:12px}
.sdoc .dh{font-family:Fraunces;font-weight:700;padding:12px 16px;border-bottom:1px dashed #d9caa0;display:flex;justify-content:space-between;gap:10px}
.srow{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid #f1e9d2;cursor:pointer;font-size:.92rem;transition:background .1s;width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left;color:var(--ink)}
.srow:hover{background:#fff6dc}
.srow span:last-child{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.srow.found{background:var(--err-soft);text-decoration:line-through;text-decoration-color:var(--err)}
.srow.fine{background:var(--ok-soft)}
.foundc{font-weight:700;font-size:.9rem;color:var(--err)}

/* feedback sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;transform:translateY(110%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet.show{transform:none;visibility:visible}
.sheet .in{max-width:980px;margin:0 auto;border-radius:18px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start;box-shadow:0 -6px 30px rgba(0,0,0,.18)}
.sheet.ok .in{background:#e3f2e9;border:2px solid var(--ok)}
.sheet.err .in{background:#fbe8e0;border:2px solid var(--err)}
.sheet .ic{font-size:1.8rem;line-height:1}
.sheet .tx{flex:1;min-width:0}
.sheet .tx b{display:block;font-family:Fraunces;font-size:1.15rem}
.sheet.ok .tx b{color:var(--ok)}.sheet.err .tx b{color:var(--err)}
.sheet .tx p{margin:4px 0 0;font-size:.94rem}
.sheet .btn{flex:none;align-self:center}
.sheet.err .btn{background:var(--err);border-bottom-color:#7d2f13}
.sheet.ok .btn{background:var(--ok);border-bottom-color:#145234}
@media(max-width:640px){.sheet .in{flex-wrap:wrap}.sheet .btn{width:100%}}
.cont{margin-top:18px;display:flex;justify-content:flex-end}

/* end */
.endc{text-align:center}
.endc .medal{font-size:3.6rem;animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.endc .bigstars{font-size:2.3rem;letter-spacing:6px;color:#d6a51c}
.endc .bigstars .off{color:#d8dde3}
.kv{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:14px 0}
.kv div{background:#f5f7fa;border-radius:12px;padding:8px 16px}
.kv b{display:block;font-family:Fraunces;font-size:1.3rem}
.kv span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.canans{text-align:left;margin-top:18px}
.canans h3{font-size:1.15rem;margin-bottom:4px}
.canans .sub{color:var(--muted);font-size:.88rem;margin-bottom:10px}
details.fq{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff}
details.fq summary{padding:12px 14px;cursor:pointer;font-weight:600;font-size:.95rem;list-style:none;display:flex;gap:10px;align-items:flex-start}
details.fq summary::-webkit-details-marker{display:none}
details.fq summary .badge{flex:none;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:99px;background:var(--gold-soft);color:var(--gold);margin-top:2px}
details.fq summary .badge.esc{background:var(--concept-soft);color:var(--concept)}
details.fq .ans{padding:0 14px 14px;font-size:.92rem;color:#2c3540}
.learned{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.learned span{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-line);border-radius:99px;padding:4px 10px;font-size:.8rem;font-weight:600}
.endbtns{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.endbtns .btn{flex:1;min-width:180px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80}

/* intro */
.introcase{border:2px solid var(--gold-line);background:linear-gradient(180deg,#fffaf0,#fff)}
.objs{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:6px}
.objs li{font-size:.92rem;padding-left:26px;position:relative}
.objs li:before{content:"◆";position:absolute;left:6px;color:var(--gold);font-size:.75rem;top:3px}

/* libreta */
.lib h2{font-size:1.6rem;margin-bottom:4px}
.libcase{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:14px}
.libcase h3{font-size:1.1rem;margin-bottom:8px}
.libnote{border-left:3px solid var(--concept);padding:6px 12px;margin:8px 0;font-size:.92rem;background:#f8fafc;border-radius:0 8px 8px 0}
.libnote b{color:var(--concept)}
.libnote.trap{border-left-color:var(--err);background:#fdf6f3}
.libnote.trap b{color:var(--err)}
.empty{color:var(--muted);font-style:italic}
.backlink{color:#fff;text-decoration:none}
.modal{position:fixed;inset:0;background:rgba(20,38,61,.45);z-index:90;display:grid;place-items:center;padding:20px}
.modal .mb{background:#fff;border-radius:18px;padding:22px;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:rise .25s}
.modal h3{font-size:1.2rem;margin-bottom:6px}
.modal p{color:var(--muted);font-size:.92rem;margin:0 0 16px}
.modal .row{display:flex;gap:10px}.modal .row .btn{flex:1}
</style>
</head>

LEVELS.push({id:'t01',tema:'01',title:'Primer día en la agencia',sub:'Marco general: el Acuerdo del art. VII del GATT',
client:{id:'c01',n:'Don Rubén Acosta',r:'Importador de repuestos · primer cliente',c:'#8a1c1c',i:'R'},
intro:'Es tu primer día. Marta te sienta frente a Don Rubén, que importa repuestos hace 30 años y desconfía de todo: <i>"¿Por qué la aduana me cobra sobre un número que no es el que yo pagué? ¿Quién inventó esto?"</i> Marta te mira: <b>"Explicale vos. Yo te ayudo."</b>',
objs:['Qué es el valor en aduana y para qué sirve','De dónde viene el Acuerdo (DVB → Ronda de Tokio)','Cómo llegó a la Argentina: Ley 23.311, Dec. 1026/87, Ley 24.425','Las partes del Acuerdo y su jerarquía','Los 6 métodos en cascada y la excepción del art. 4','El art. 17, la duda razonable y el fallo Peckaitis'],
steps:[
{t:'brief',title:'La única pregunta que resuelve la valoración',html:'Todo el sistema existe para responder una sola pregunta: <b>¿sobre qué monto se calculan los derechos e impuestos de importación?</b> Ese monto es el <b>valor en aduana</b>. Valuar de más es cobrar tributos de más; valuar de menos, recaudar de menos. Por eso el mundo necesitó una regla común.',
 key:'El valor en aduana es, como regla, el <b>valor de transacción</b>: el precio realmente pagado o por pagar por la mercadería vendida para exportación al país de importación, <b>ajustado según el art. 8</b>.'},
{t:'choice',who:'c01',q:'"A ver, pibe: ¿para qué sirve ese famoso valor en aduana?"',opts:[
 {x:'Es la base sobre la que se calculan los derechos e impuestos de importación',ok:true,why:'Exacto. Es el "precio de referencia" sobre el que la aduana pasa la calculadora de tributos.'},
 {x:'Es el precio al que vas a revender la mercadería en el país',why:'No. El precio de reventa interno es otra cosa (aparece recién en el método deductivo). El valor en aduana es la <b>base imponible</b> de los tributos de importación.'},
 {x:'Es lo que cuesta el flete internacional',why:'El flete es apenas un componente que se suma (art. 8). El valor en aduana es la base sobre la que se liquidan los tributos.'},
 {x:'Es un precio mínimo que fija la aduana para cada producto',why:'No: los valores mínimos están justamente <b>prohibidos</b> por el sistema. El valor en aduana parte del precio real de la operación.'}]},
{t:'brief',title:'De dónde viene: el problema de Bruselas',html:'Desde los años 50 muchos países usaban la <b>Definición del Valor de Bruselas (DVB)</b>. Tenía problemas serios:',
 bullets:['Fijaba un <b>precio normal teórico</b>: el que se pagaría en un mercado libre entre partes independientes. Era una construcción de la aduana, no el precio real.','Las bajas de precio solo se reconocían <b>hasta un 10%</b>.','Los productos nuevos o raros <b>no figuraban</b> en las listas.','El comercio no se sentía representado y <b>Estados Unidos nunca adhirió</b>.','La <b>Ronda de Tokio (1979)</b> lo resolvió con el Acuerdo relativo a la aplicación del <b>art. VII del GATT</b>: un <b>sistema positivo</b>, que valúa según el precio real de la transacción.','Su preámbulo busca un sistema <b>equitativo, uniforme y neutro</b>, ajustado a las realidades comerciales, con beneficios adicionales para los países en desarrollo.'],
 key:'El Acuerdo reemplazó un valor <b>teórico</b> (DVB) por el precio <b>real</b> de la transacción (sistema positivo).'},
{t:'classify',q:'Don Rubén mezcla todo. Separá qué era de la vieja DVB y qué es del Acuerdo del GATT.',buckets:[{id:'dvb',label:'🏛 Definición de Bruselas (DVB)',cls:'b-err'},{id:'gatt',label:'🌐 Acuerdo art. VII GATT',cls:'b-ok'}],items:[
 {x:'Precio normal teórico',b:'dvb',why:'El precio "normal" teórico era la base de la DVB: una construcción de la aduana.'},
 {x:'Bajas de precio reconocidas solo hasta un 10%',b:'dvb',why:'Esa era una de las limitaciones de la DVB.'},
 {x:'Productos nuevos fuera de las listas',b:'dvb',why:'Problema típico de la DVB: lo que no estaba en la lista no tenía referencia.'},
 {x:'EE.UU. nunca adhirió',b:'dvb',why:'Fue a la DVB a la que EE.UU. nunca adhirió.'},
 {x:'Precio real de la transacción',b:'gatt',why:'El Acuerdo es un sistema positivo: parte del precio real.'},
 {x:'Ronda de Tokio, 1979',b:'gatt',why:'El Acuerdo nació en la Ronda de Tokio (1979).'},
 {x:'Equitativo, uniforme y neutro',b:'gatt',why:'Son las finalidades que fija el preámbulo del Acuerdo.'},
 {x:'Sistema positivo',b:'gatt',why:'"Positivo" = se valúa por el precio realmente pactado, no por uno teórico.'}],
 done:'La DVB valuaba con un precio teórico; el Acuerdo valúa con el precio real.'},
{t:'brief',title:'Cómo llegó a la Argentina',html:'Tres normas que tenés que poder nombrar:',
 bullets:['<b>Ley 23.311</b> — aprobó el Acuerdo. Vigencia práctica desde <b>1988</b>.','<b>Decreto 1026/87</b> — lo reglamentó. Define el <b>"lugar de importación"</b> (el Acuerdo no lo define) y dispone incluir flete, seguro y gastos conexos: Argentina valora sobre <b>base CIF</b>.','<b>Ley 24.425 (1994)</b> — aprobó el Acuerdo de Marrakech (creación de la <b>OMC</b>) e incorporó la <b>Decisión del Comité</b> sobre dudas razonables del valor declarado (complementa el art. 17).','División clave: en <b>importación</b> rige el Acuerdo GATT/OMC; en <b>exportación</b> sigue rigiendo el <b>Código Aduanero</b> (Unidad 2).'],
 key:'Ley 23.311 (aprobó, vigencia 1988) · Dec. 1026/87 (reglamentó: lugar de importación + base CIF) · Ley 24.425 (OMC + Decisión de dudas razonables).',
 trap:'Tener clara la división impo/expo es media materia: impo → Acuerdo del GATT; expo → Código Aduanero.'},
{t:'classify',q:'Uní cada norma con lo que hizo.',buckets:[{id:'a',label:'Ley 23.311',cls:'b-con'},{id:'b',label:'Dec. 1026/87',cls:'b-gold'},{id:'c',label:'Ley 24.425',cls:'b-pur'}],items:[
 {x:'Aprobó el Acuerdo del GATT',b:'a',why:'Fue la Ley 23.311 la que aprobó el Acuerdo.'},
 {x:'Vigencia práctica desde 1988',b:'a',why:'La Ley 23.311 rige en la práctica desde 1988.'},
 {x:'Define el "lugar de importación"',b:'b',why:'El Acuerdo no lo define: lo hace el Decreto 1026/87.'},
 {x:'Argentina valora sobre base CIF',b:'b',why:'El Dec. 1026/87 dispone incluir flete, seguro y gastos conexos.'},
 {x:'Aprobó Marrakech (creación de la OMC)',b:'c',why:'La Ley 24.425 (1994) aprobó el Acuerdo de Marrakech.'},
 {x:'Incorporó la Decisión sobre dudas razonables',b:'c',why:'La Ley 24.425 incorporó la Decisión del Comité que complementa el art. 17.'}]},
{t:'choice',who:'c01',q:'"Mi sobrino exporta yerba a Chile. ¿A él también le valúan con este Acuerdo del GATT?"',opts:[
 {x:'No: la valoración de exportación sigue rigiéndose por el Código Aduanero',ok:true,why:'Correcto. Argentina adoptó el régimen GATT/OMC para <b>importación</b>; para <b>exportación</b> sigue el Código Aduanero.'},
 {x:'Sí, el Acuerdo rige igual para importación y exportación',why:'No. Esa es la confusión clásica: el Acuerdo del GATT rige la <b>importación</b>. La exportación se valúa por el <b>Código Aduanero</b>.'},
 {x:'Depende del Incoterm que use',why:'El Incoterm cambia los ajustes, no el régimen. La exportación se valúa por el Código Aduanero.'}]},
{t:'brief',title:'Las partes del Acuerdo',html:'El Acuerdo no es solo el articulado. Su estructura completa:',
 bullets:['<b>Preámbulo</b>: fija la finalidad — uniformidad, equidad, neutralidad; aceptar el precio de las partes.','<b>Articulado</b> (arts. 1 a 8 y siguientes): los seis métodos, los ajustes y las reglas generales.','<b>Notas interpretativas</b>: <b>forman parte del Acuerdo</b> y tienen su misma fuerza. Aclaran cómo aplicar cada artículo.','<b>Textos del Comité Técnico de Valoración (OMA)</b>: opiniones consultivas, comentarios, notas explicativas, estudios de casos. <b>Orientan</b> la interpretación.'],
 trap:'Creer que las notas interpretativas son "doctrina" o material secundario. Integran el Acuerdo con la misma jerarquía del artículo que interpretan. Los textos del Comité Técnico, en cambio, orientan pero no tienen esa fuerza vinculante plena.'},
{t:'choice',q:'En un escrito, ¿qué valor le das a las notas interpretativas?',opts:[
 {x:'Forman parte del Acuerdo, con la misma jerarquía que el artículo que interpretan',ok:true,why:'Así es. Por eso se citan con la misma fuerza que el artículo.'},
 {x:'Son doctrina orientativa, como los textos del Comité Técnico',why:'Esa es la trampa. Lo orientativo son los textos del <b>Comité Técnico (OMA)</b>. Las notas interpretativas <b>integran</b> el Acuerdo.'},
 {x:'Solo valen si el país las adopta por decreto',why:'No hace falta: son parte del propio Acuerdo.'}]},
{t:'brief',title:'Los seis métodos, en cascada',html:'El corazón del sistema: <b>seis métodos que se aplican uno después del otro</b>. Solo se pasa al siguiente cuando el anterior no puede aplicarse. <b>No se elige el más cómodo.</b> Ojo: el 4º método es el art. 5 — el art. 4 no es un método, es la regla de inversión.',
 key:'1º Valor de transacción (art. 1 + ajustes art. 8) · 2º Idénticas (art. 2) · 3º Similares (art. 3) · 4º Deductivo (art. 5) · 5º Reconstruido (art. 6) · 6º Último recurso (art. 7). <b>Art. 4</b>: el importador puede pedir invertir el 5º y el 6º.'},
{t:'order',q:'Armá la cascada de los 6 métodos, del primero al último.',items:[
 {x:'Valor de transacción · art. 1',why:'Siempre se arranca por el precio real de la operación.'},
 {x:'Mercaderías idénticas · art. 2',why:'Si no hay art. 1, se busca primero mercadería idéntica.'},
 {x:'Mercaderías similares · art. 3',why:'Solo si no hay idénticas se pasa a similares.'},
 {x:'Método deductivo · art. 5',why:'Después viene el deductivo (art. 5). El art. 4 no es un método.'},
 {x:'Valor reconstruido · art. 6',why:'El reconstruido va 5º (salvo inversión del art. 4).'},
 {x:'Último recurso · art. 7',why:'El art. 7 es la red de seguridad final.'}],
 done:'Orden sucesivo y excluyente: se baja solo cuando el anterior no aplica.'},
{t:'choice',who:'c01',q:'"Si el método de las idénticas me da más barato que el valor de transacción, ¿puedo pedir que usen ese?"',opts:[
 {x:'No: el orden es sucesivo y excluyente; si el art. 1 aplica, se usa el art. 1',ok:true,why:'Exacto. El sistema da previsibilidad: se sabe de antemano qué método corresponde.'},
 {x:'Sí, el importador elige el método que más le convenga',why:'No. Nadie elige por conveniencia: ni el importador ni la aduana. Se baja en cascada solo si el anterior no aplica.'},
 {x:'Sí, gracias al art. 4',why:'El art. 4 solo permite invertir el <b>5º (deductivo) y el 6º (reconstruido)</b>, a pedido del importador. Nada más.'}]},
{t:'choice',q:'¿Qué permite exactamente el art. 4?',opts:[
 {x:'Invertir el orden entre el deductivo (art. 5) y el reconstruido (art. 6), a pedido del importador',ok:true,why:'Es la única flexibilidad de orden de todo el sistema (y la aduana tiene que aceptarlo).'},
 {x:'Saltear el art. 1 cuando hay vinculación',why:'No. La vinculación se analiza dentro del art. 1 (Tema 3). El art. 4 solo invierte el 5º y el 6º.'},
 {x:'Que la aduana elija libremente el método',why:'No. El art. 4 es una facultad del importador y se limita a invertir deductivo y reconstruido.'},
 {x:'Invertir idénticas y similares',why:'No: idénticas siempre va antes que similares. La inversión es entre el 5º y el 6º.'}]},
{t:'brief',title:'El derecho de la aduana a dudar',html:'El sistema acepta el precio de las partes, pero <b>no obliga a la aduana a creer todo</b>. El <b>art. 17</b> dice que nada del Acuerdo restringe el derecho de la aduana a comprobar la veracidad o exactitud de lo declarado. La <b>Decisión del Comité</b> (incorporada por la Ley 24.425 y receptada por la <b>RG AFIP 1907/05</b>, "Sistema de Control de Valor") reglamenta la <b>duda razonable</b>.',
 key:'Art. 17: la aduana conserva el derecho de comprobar la veracidad y exactitud de toda información, documento o declaración presentada a efectos de la valoración.'},
{t:'order',q:'Ordená el procedimiento de duda razonable.',items:[
 {x:'La aduana tiene motivos para dudar del valor declarado',why:'Todo empieza con un motivo de duda.'},
 {x:'Pide al importador explicación y pruebas complementarias',why:'Antes de decidir, tiene que darle al importador la chance de explicar.'},
 {x:'Si persisten las dudas, decide que el valor no se determina por el art. 1',why:'Recién si la duda sigue puede apartarse del art. 1 y pasar a métodos alternativos.'},
 {x:'Comunica por escrito sus motivos, da oportunidad de responder y notifica la decisión fundada',why:'Todo con comunicación escrita y fundada.'}]},
{t:'brief',title:'El fallo que tenés que citar: Peckaitis',html:'<b>"Aurelio Peckaitis S.A."</b> (Cámara CAF, Sala IV, 11/10/2001). La Cámara dijo dos cosas:',
 bullets:['Que un precio sea <b>inferior a los precios corrientes de mercado no basta</b> para rechazarlo (<b>Opinión Consultiva 2.1</b> del Comité Técnico).','Que la aduana, al aplicar un método alternativo, <b>tampoco puede fijar valores arbitrarios</b>: le reprocharon basar el ajuste en un auto con <b>motor y año de modelo distintos</b> al valuado.'],
 key:'Regla de oro (art. 17 + Peckaitis): ni el importador puede declarar cualquier cosa, ni la aduana puede ajustar con cualquier fundamento. Ambos necesitan datos objetivos y cuantificables.'},
{t:'choice',who:'aduana',q:'La aduana ve que la factura de Don Rubén está 30% debajo del precio de mercado. ¿Qué puede hacer?',opts:[
 {x:'Solo por eso no puede rechazarlo: necesita otra causa y seguir el procedimiento de duda razonable',ok:true,why:'Correcto: Opinión Consultiva 2.1 y Peckaitis. Precio bajo ≠ precio falso. Puede dudar (art. 17), pedir pruebas y, si persiste la duda fundada, apartarse del art. 1.'},
 {x:'Rechazarlo automáticamente y aplicar un valor de referencia',why:'No. Un precio inferior al de mercado no basta (OC 2.1 / Peckaitis). Y los valores mínimos o arbitrarios están prohibidos.'},
 {x:'Nada: el art. 1 la obliga a aceptar siempre el precio declarado',why:'Tampoco. El art. 17 le reserva el derecho a comprobar. La clave es el procedimiento: pedir explicación, pruebas y decidir por escrito y fundado.'}]},
{t:'choice',who:'aduana',q:'Si la aduana termina ajustando, ¿qué error le reprocharon en Peckaitis?',opts:[
 {x:'Comparar con un auto de motor y año de modelo distintos: un valor arbitrario',ok:true,why:'Exacto. La aduana también necesita datos objetivos y comparables.'},
 {x:'No haber aplicado la Definición de Bruselas',why:'La DVB ya no rige. El reproche fue usar una comparación no equivalente (otro motor y año).'},
 {x:'Haber usado el art. 17',why:'Usar el art. 17 está bien. El problema fue ajustar con un fundamento arbitrario.'}]}
],
finals:[
 {k:'Oral',q:'Explique la estructura del Acuerdo y por qué existen seis métodos.',a:'El Acuerdo del art. VII del GATT se compone de preámbulo (fija finalidad de uniformidad y neutralidad), articulado, notas interpretativas (que forman parte del Acuerdo con igual jerarquía) y textos del Comité Técnico (opiniones consultivas, comentarios, notas explicativas). Existen seis métodos aplicables en orden sucesivo y excluyente porque el sistema prioriza el precio real de la operación (valor de transacción) y solo recurre a alternativas cuando ese precio no existe o no es aceptable, garantizando previsibilidad. La única flexibilidad de orden es la del art. 4 (invertir arts. 5 y 6).'},
 {k:'Escrito',q:'¿Cómo se concilia el principio de aceptar el precio de las partes con las facultades de control de la aduana?',a:'El principio rector (preámbulo) es aceptar el precio pactado. Pero el art. 17 reserva a la aduana el derecho de comprobar la veracidad y exactitud de lo declarado, y la Decisión del Comité (Ley 24.425, RG AFIP 1907/05) reglamenta la duda razonable: pedir explicaciones y pruebas y, si persisten dudas fundadas, apartarse del art. 1, siempre con comunicación escrita y fundada. Peckaitis marca el límite: ni el importador declara arbitrariamente ni la aduana ajusta sin fundamento objetivo.'},
 {k:'Trampa',q:'¿Se puede elegir el método que dé menor valor?',a:'No. El orden es sucesivo y excluyente. La única flexibilidad es la inversión del 5º y 6º por el art. 4, a pedido del importador.'}]
});

LEVELS.push({id:'t02',tema:'02',crit:true,title:'Los veladores de Canadá',sub:'Art. 1 — Valor de transacción',
client:{id:'c02',n:'Sofía Benítez',r:'Luz Norte S.A. · importa iluminación',c:'#7a3c9a',i:'S'},
intro:'Sofía trae su primera importación: <b>1.000 veladores desde Canadá</b>. Te muestra la factura FOB y dice: <i>"Declaramos lo que dice la factura y listo, ¿no?"</i> Marta levanta una ceja: <b>"Leé todo el expediente antes de firmar nada."</b>',
objs:['Definir valor de transacción y precio realmente pagado o por pagar','Pagos directos, indirectos, a terceros y no dinerarios','Las 4 condiciones del art. 1 (R-C-R-V) y sus excepciones','Por qué la vinculación sola no descarta el art. 1','Armar el precio realmente pagado desde una factura'],
steps:[
{t:'brief',title:'El precio realmente pagado o por pagar',html:'Es el tema que hay que dominar sí o sí: todo lo demás se define por oposición a este método. El valor de transacción es como la factura mirada con lupa contable: no es solo el "total", sino <b>todo</b> lo que el comprador paga al vendedor o en su beneficio, esté escrito en la factura o escondido en otro pago.',
 key:'Valor de transacción = precio realmente pagado o por pagar por las mercaderías importadas, cuando se venden para exportación al país de importación, <b>ajustado según el art. 8</b>. Precio realmente pagado = el <b>pago total</b> que el comprador haya hecho o vaya a hacer al vendedor, o en beneficio de éste.'},
{t:'brief',title:'Tres precisiones que definen el concepto',html:'Para no equivocarte cuando el enunciado esconde pagos:',
 bullets:['<b>Pagado o por pagar</b>: si se paga antes de importar → precio pagado; si se paga después → por pagar. Los dos valen.','<b>No solo dinero</b>: puede ser carta de crédito o instrumentos negociables. Directo o indirecto.','<b>Pago total</b>: incluye todos los pagos hechos como condición de venta, incluso a un <b>tercero</b> para satisfacer una obligación del vendedor.','<b>Pago indirecto</b>: el comprador cancela una deuda del vendedor con un tercero, o reduce el precio por una deuda del vendedor hacia él.']},
{t:'classify',q:'¿Esto integra el precio realmente pagado o por pagar?',buckets:[{id:'si',label:'✔ Integra el precio',cls:'b-ok'},{id:'no',label:'✘ No integra',cls:'b-err'}],items:[
 {x:'Pago hecho 60 días después de importar',b:'si',why:'Es precio "por pagar": vale igual que el pagado antes.'},
 {x:'Pago con carta de crédito',b:'si',why:'El pago no tiene que ser en dinero: carta de crédito e instrumentos negociables valen.'},
 {x:'USD 5.000 pagados a un tercero para saldar una deuda del vendedor',b:'si',why:'Pago indirecto: satisface una obligación del vendedor, entonces integra el precio.'},
 {x:'Rebaja de precio para compensar una deuda del vendedor con el comprador',b:'si',why:'También es pago indirecto: el comprador "cobra" su crédito vía precio.'},
 {x:'Una compra de muebles para la oficina del importador, sin relación con la venta',b:'no',why:'No es un pago al vendedor ni en su beneficio ni condición de venta.'}]},
{t:'brief',title:'Las 4 condiciones: R-C-R-V',html:'Si falla <b>una sola</b>, no se puede usar el valor de transacción y se pasa a los métodos alternativos (arts. 2 a 7). Truco: <b>R-C-R-V</b>.',
 bullets:['<b>R — Restricciones</b>: que no haya restricciones a la cesión o utilización por el comprador. <b>Excepciones permitidas</b>: las impuestas por la ley, las que limitan la zona geográfica de reventa y las que no afectan sustancialmente el valor.','<b>C — Condiciones o prestaciones</b>: que la venta no dependa de condiciones cuyo valor no pueda determinarse respecto de la mercadería.','<b>R — Reversión</b>: que ninguna parte del producto de una reventa, cesión o uso posterior revierta al vendedor, <b>salvo que pueda ajustarse por el art. 8</b>.','<b>V — Vinculación</b>: que no haya vinculación, o que existiendo <b>no haya influido en el precio</b>.'],
 key:'R-C-R-V → Restricciones · Condiciones · Reversión · Vinculación. Son acumulativas.'},
{t:'order',q:'Recitá las 4 condiciones en el orden del truco R-C-R-V.',items:[{x:'Restricciones'},{x:'Condiciones o prestaciones de valor indeterminable'},{x:'Reversión'},{x:'Vinculación que influye en el precio'}],hint:'Acordate: R-C-R-V.'},
{t:'classify',q:'Sofía te cuenta cláusulas del contrato. ¿Alguna tumba el art. 1?',buckets:[{id:'ok',label:'✔ Se puede usar el art. 1',cls:'b-ok'},{id:'cae',label:'✘ Cae el art. 1',cls:'b-err'}],items:[
 {x:'Una ley argentina limita la reventa de estos veladores',b:'ok',why:'Las restricciones impuestas por la ley son una excepción permitida.'},
 {x:'Solo puede revenderlos en el NEA',b:'ok',why:'Limitar la zona geográfica de reventa es una excepción permitida.'},
 {x:'No puede venderlos antes de la fecha de lanzamiento (no afecta el valor)',b:'ok',why:'Restricción que no afecta sustancialmente el valor: no invalida el art. 1.'},

finals:[
 {k:'Escrito',q:'Desarrolle el concepto de precio realmente pagado o por pagar y sus formas de pago.',a:'Es el pago total que por las mercaderías importadas haya hecho o vaya a hacer el comprador al vendedor o en beneficio de éste. Comprende todos los pagos efectuados como condición de venta, incluidos los realizados a terceros para satisfacer obligaciones del vendedor. Puede ser pagado (antes de importar) o por pagar (después). No requiere forma dineraria: admite carta de crédito o instrumentos negociables, y puede ser directo o indirecto.'},
 {k:'Oral',q:'Enumere y explique las condiciones para aplicar el valor de transacción.',a:'Cuatro condiciones acumulativas (R-C-R-V): 1) Restricciones — que no haya restricciones a la cesión/uso por el comprador, salvo las legales, geográficas o que no afecten el valor. 2) Condiciones/prestaciones — que la venta no dependa de condiciones de valor indeterminable. 3) Reversión — que ninguna parte de una reventa posterior revierta al vendedor, salvo que pueda ajustarse. 4) Vinculación — que no exista vinculación que influya en el precio. Si falla alguna, se descarta el art. 1 y se pasa, en orden, a los métodos alternativos.'},
 {k:'Trampa',q:'"Hay vinculación, entonces no se usa el art. 1." ¿Verdadero?',a:'Falso. La vinculación descarta el art. 1 únicamente cuando influye en el precio. Hay que examinar las circunstancias de la venta o comparar con valores criterio.'}]

LEVELS.push({id:'t03',tema:'03',crit:true,title:'La filial alemana',sub:'Vinculación y valores criterio',

steps:[

{t:'brief',title:'¿Cuándo hay vinculación?',html:'El Acuerdo (art. 15) enumera los supuestos. Se consideran vinculadas, entre otros casos, cuando:',

{t:'choice',who:'c03',q:'"Bueno, estamos vinculados. ¿Qué corresponde primero?"',opts:[

{t:'brief',title:'Primer camino: el examen de las circunstancias de la venta',html:'Lo hace la <b>aduana</b>: analiza cómo se fijó el precio, para ver si se comportó como entre partes independientes. La vinculación <b>no influyó</b> si el precio se ajustó de manera compatible con:',

{t:'choice',who:'aduana',q:'La aduana comprueba que la matriz le cobra a Werner el mismo margen que a distribuidores independientes de otros países. ¿Conclusión?',opts:[

{t:'choice',who:'aduana',q:'Otro caso: el precio intragrupo es bajo porque la filial compra volúmenes enormes, igual que la política de la empresa con todos. ¿Qué hacés?',opts:[

{t:'brief',title:'Segundo camino: los valores criterio',html:'Este camino lo usa el <b>importador</b> para demostrar que su valor es aceptable pese a la vinculación: si mi precio se parece mucho a un valor que la aduana ya aceptó, la vinculación no lo distorsionó.',

finals:[
 {k:'Oral',q:'¿Qué es la vinculación y cómo se determina si influyó en el precio?',a:'Hay vinculación cuando comprador y vendedor están relacionados según los supuestos del Acuerdo (control, sociedad, empleo, participación superior al 5% del capital o votos —art. 15.4—, control común, familia). La vinculación no invalida el valor de transacción: hay que determinar si influyó en el precio, por dos vías: (a) examen de las circunstancias de la venta —la aduana verifica si el precio se fijó según prácticas normales del sector, como a no vinculados, o cubriendo costos más beneficio representativo—; y (b) valores criterio —el importador demuestra que su valor se aproxima a un valor ya aceptado por la aduana para idénticas/similares—.'},
 {k:'Escrito',q:'Explique los valores criterio y aclare por qué no son un método de valoración.',a:'Son valores ya aceptados por la aduana como valor en aduana, en el mismo momento o uno aproximado: V.T. de idénticas o similares vendidas a no vinculados, o el valor por método deductivo o reconstruido de idénticas/similares. Sirven exclusivamente como comparación para probar que un precio entre vinculados es aceptable. No son un método porque no determinan el valor en aduana: solo validan el V.T. declarado; la comparación contempla diferencias de nivel comercial, cantidad y ajustes del art. 8.'}]

intro:'Matías importa piezas plásticas. En su carpeta hay de todo: comisiones, un molde que mandó él, regalías, descuentos, fletes "por cuenta mía"... Marta: <b>"El 80% de los ejercicios del final se ganan o se pierden acá. Vamos ítem por ítem."</b>',
objs:['Las 2 reglas de hierro del ajuste','Qué se suma por el art. 8.1 (y qué no)','Comisión de venta vs. de compra; cánones','Base CIF argentina y "lugar de importación"','Flete gratuito o por cuenta del comprador','Descuentos admisibles vs. no admisibles'],
steps:[
{t:'brief',title:'La lógica del ajuste',html:'El art. 8 es la receta para convertir el precio de factura en el valor en aduana. La factura casi nunca viene "lista para tributar": le faltan cosas (flete, comisiones, prestaciones) y a veces le sobran (gastos posteriores a la importación, ciertos descuentos).',
 bullets:['Regla de hierro 1: <b>solo se ajusta lo que no está ya incluido</b> en el precio.','Regla de hierro 2: todo ajuste debe basarse en <b>datos objetivos y cuantificables</b>. Si no se puede cuantificar, no se ajusta (y puede caer el art. 1).'],
 key:'Precio realmente pagado ± ajustes del art. 8 = valor en aduana.'},
{t:'brief',title:'Lo que se SUMA (art. 8.1), si no está incluido',html:'La lista que tenés que recitar:',
 bullets:['<b>Comisiones de venta y corretaje</b>. Excepción: las <b>comisiones de compra NO</b> se suman.','<b>Envases y embalajes</b> que se traten como un todo con la mercadería, incluidos materiales y mano de obra del embalaje.','<b>Prestaciones</b>: bienes o servicios que el comprador da gratis o barato para producir la mercadería — materiales y componentes; herramientas, matrices, moldes; materiales consumidos; ingeniería, diseño y planos hechos <b>fuera del país de importación</b>.','<b>Cánones y derechos de licencia</b> relacionados con la mercadería, que el comprador deba pagar <b>como condición de venta</b>.','<b>Producto de la reventa</b> que revierta al vendedor.','<b>Transporte, carga/descarga y seguro</b> hasta el lugar de importación (Argentina: CIF).']},
{t:'classify',q:'Revisá la carpeta de Matías: ¿se suma al precio o no?',buckets:[{id:'s',label:'➕ Se suma',cls:'b-ok'},{id:'n',label:'⛔ No se suma',cls:'b-err'}],items:[

{t:'brief',title:'Transporte y seguro: la base CIF argentina',html:'El <b>art. 8.2</b> deja a cada país decidir si incluye o no flete, gastos conexos y seguro. Argentina, por el <b>Dec. 1026/87</b>, los incluye en su totalidad: valora sobre <b>base CIF</b>.',

 {x:'Argentina',b:'cif',why:'Argentina valora CIF por el Dec. 1026/87.'},{x:'Mercosur',b:'cif',why:'El Mercosur valora CIF.'},{x:'Unión Europea',b:'cif',why:'La UE valora CIF.'}]},
{t:'choice',who:'c04',q:'"Las piezas vienen en barco: entran por Buenos Aires y siguen a la aduana de Rosario. ¿Hasta dónde sumo el flete?"',opts:[

{t:'choice',who:'c04',q:'"El flete de China lo contraté yo y me lo regalaron por ser cliente. ¿Lo declaro?"',opts:[

{t:'choice',q:'La compra vino en condición CIF y Argentina valora CIF. ¿Qué hacés con el flete?',opts:[

{t:'brief',title:'Los descuentos: admisibles y no admisibles',html:'Punto finísimo y muy preguntado. Los conceptos que no forman parte del valor en aduana, si están incluidos en el precio, se deducen. Pero con los descuentos hay que distinguir:',
 bullets:['<b>Admisibles</b> (se aceptan y quedan deducidos): por <b>pago al contado</b>, por <b>cantidad</b> y por <b>nivel comercial</b>.','<b>No admisibles</b> (se ajustan EN POSITIVO, se suman de nuevo): por <b>pago anticipado</b>, <b>hasta agotar stock</b>, para <b>compensar envíos anteriores</b>, <b>adicionales/retroactivos</b>.','Los <b>intereses de financiación</b> no forman parte del valor en aduana (Decisión 3.1 y art. 7 del Dec. 1026/87), si están <b>discriminados</b>, responden a un acuerdo de financiación por escrito y la tasa no excede la del mercado.'],
 trap:'El instinto dice "un descuento siempre baja el valor". No: si es no admisible, hay que sumarlo de vuelta. La consigna típica avisa: "los descuentos no admisibles deberán ajustarse en positivo". Leelo dos veces.'},
{t:'classify',q:'Clasificá los descuentos de las facturas de Matías.',buckets:[{id:'ad',label:'✔ Admisible (queda deducido)',cls:'b-ok'},{id:'na',label:'➕ No admisible (se suma de nuevo)',cls:'b-err'}],items:[

finals:[
 {k:'Escrito',q:'Enumere los ajustes del art. 8 y explique la regla de los datos objetivos y cuantificables.',a:'Se añaden al precio, si no están incluidos: comisiones de venta y corretaje (no las de compra); envases y embalajes; prestaciones (bienes/servicios del comprador para producir la mercadería, incluida ingeniería hecha fuera del país); cánones y derechos de licencia relacionados con la mercadería y como condición de venta; producto de la reventa que revierta al vendedor; y transporte, carga/descarga y seguro hasta el lugar de importación (base CIF). Todo ajuste debe apoyarse en datos objetivos y cuantificables: si el importe no puede determinarse objetivamente, no puede ajustarse, y podría impedir usar el valor de transacción.'},
 {k:'Oral',q:'¿Cómo se tratan los descuentos al determinar el valor en aduana?',a:'Los admisibles (contado, cantidad, nivel comercial) se aceptan y quedan deducidos. Los no admisibles —pago anticipado, hasta agotar stock, compensar envíos anteriores, adicionales— se ajustan en positivo: se suman nuevamente al precio. Esos descuentos no responden a la mercadería valuada sino a circunstancias ajenas que distorsionarían la base imponible. Los intereses de financiación no integran el valor (Decisión 3.1, art. 7 Dec. 1026/87).'},
 {k:'Trampa',q:'La factura dice "comisión 5%". ¿Se suma?',a:'Depende: si es de venta (el agente actúa por el vendedor) se suma; si es de compra (representa al comprador) no se suma.'}]

LEVELS.push({id:'t05',tema:'05',title:'¿Idénticas o parecidas?',sub:'Arts. 2 y 3 — Mercaderías idénticas y similares',
client:{id:'c05',n:'Valentina Paz',r:'Pantallas del Litoral · importa monitores',c:'#22548c',i:'V'},
intro:'A Valentina le rechazaron el valor de transacción porque no pudo aclarar la vinculación con su proveedor. <i>"¿Y ahora qué? ¿Me inventan un precio?"</i> Marta: <b>"No se inventa nada. Se busca el valor ya aceptado de otra operación igual o parecida."</b>',
objs:['Diferenciar idénticas (art. 2) de similares (art. 3)','Condiciones comunes: mismo país de importación y mismo momento','Excepción por prestaciones y productor distinto','Ajustes por nivel comercial, cantidad y tiempo','Más de un valor aplicable → el más bajo','Resolver el ejercicio de la cátedra (art. 3)'],
steps:[
{t:'brief',title:'Cuando no hay art. 1',html:'Es como tasar un auto sin su precio: buscás el precio real de uno <b>idéntico</b> (misma marca, modelo, año, fábrica). Si no lo encontrás, uno <b>similar</b> (hace lo mismo y es intercambiable). Y ajustás por diferencias: no es lo mismo comprar 1 que 100, ni hoy que hace un año.',
 key:'Método 2 (art. 2): V.T. de mercaderías <b>idénticas</b>. Método 3 (art. 3): V.T. de mercaderías <b>similares</b>. En ese orden: primero idénticas, y solo si no hay, similares.'},
{t:'brief',title:'Las dos definiciones',html:'Lado a lado:',
 bullets:['<b>Idénticas</b>: iguales en todo — características físicas, calidad y prestigio comercial. Pequeñas diferencias de aspecto no impiden considerarlas idénticas.','<b>Similares</b>: muy semejantes en composición y características; cumplen las mismas funciones y son comercialmente intercambiables.','Ambas: <b>mismo país de producción</b> y <b>mismo productor</b>. Si no hay del mismo productor, pueden tomarse las de <b>otro productor del mismo país</b>.','Condiciones comunes: vendidas al <b>mismo país de importación</b> y exportadas en el <b>mismo momento o uno aproximado</b>.','Excepción por prestaciones: se excluyen las mercaderías que incorporan ingeniería o trabajos artísticos del comprador, <b>hechos en el país de importación</b>, que no fueron ajustados por el art. 8.']},
{t:'classify',q:'¿Este rasgo define a las idénticas o a las similares?',buckets:[{id:'id',label:'🟰 Idénticas (art. 2)',cls:'b-con'},{id:'si',label:'≈ Similares (art. 3)',cls:'b-pur'},{id:'am',label:'🤝 Ambas',cls:'b-gold'}],items:[
 {x:'Iguales en características físicas, calidad y prestigio',b:'id',why:'Igualdad total = idénticas.'},
 {x:'Pequeñas diferencias de aspecto no las descartan',b:'id',why:'Es una aclaración propia de las idénticas.'},
 {x:'Muy semejantes en composición y características',b:'si',why:'Semejanza (no igualdad) = similares.'},
 {x:'Cumplen las mismas funciones y son comercialmente intercambiables',b:'si',why:'Es el corazón de la definición de similares.'},
 {x:'Mismo país de producción',b:'am',why:'Lo exigen las dos.'},
 {x:'Vendidas al mismo país de importación, en el mismo momento o aproximado',b:'am',why:'Condición común a ambos métodos.'}]},
{t:'choice',who:'c05',q:'"Encontré monitores idénticos, pero de otra fábrica del mismo país. ¿Sirven?"',opts:[

{t:'brief',title:'Nivel comercial, cantidad y tiempo',html:'Casi nunca la operación de comparación tiene exactamente las mismas condiciones. Por eso se ajusta:',

 trap:'Regla que cae seguro: si hay más de un valor de transacción de idénticas (o similares) aplicable, se toma el <b>MÁS BAJO</b>.'},
{t:'choice',who:'c05',q:'Hay dos operaciones de monitores idénticos: USD 90/u (1.000 u a mayorista) y USD 100/u (200 u a minorista). Ajustadas por cantidad y nivel comercial, las dos siguen válidas. ¿Cuál se toma?',opts:[

{t:'brief',title:'El ejercicio de la cátedra (art. 3)',html:'Mercadería X, CIP U$S 60.000, 8.000 unidades (precio unitario 7,5), <b>con vinculación</b>, DI 20%, importación <b>20/08/2024 (±90 días)</b>, origen Italia. Operaciones comparables:<div class="tscroll"><table class="tbl"><tr><th>#</th><th>Fecha</th><th class="r">Cant.</th><th>Origen</th><th class="r">VT</th><th>Comprador</th></tr><tr><td>1</td><td>19/07/24</td><td class="r">400</td><td>Italia</td><td class="r">21</td><td>L</td></tr><tr><td>2</td><td>28/08/24</td><td class="r">500</td><td>Canadá</td><td class="r">20</td><td>XL</td></tr><tr><td>3</td><td>20/11/24</td><td class="r">700</td><td>Italia</td><td class="r">18</td><td>S</td></tr><tr><td>4</td><td>19/10/24</td><td class="r">900</td><td>Canadá</td><td class="r">20</td><td>XL</td></tr><tr><td>5</td><td>29/09/24</td><td class="r">600</td><td>Canadá</td><td class="r">19</td><td>T</td></tr><tr><td>6</td><td>12/09/24</td><td class="r">1000</td><td>Canadá</td><td class="r">22</td><td>U</td></tr></table></div>Lo que se evalúa es el <b>razonamiento</b>: por qué se descarta cada operación y con qué criterio se elige.'},

 {k:'Oral',q:'Diferencie mercaderías idénticas de similares y explique los ajustes de comparación.',a:'Idénticas (art. 2): iguales en todos los aspectos —características físicas, calidad, prestigio—, del mismo país y productor; las pequeñas diferencias de aspecto no obstan. Similares (art. 3): muy semejantes en composición y características, que cumplen las mismas funciones y son comercialmente intercambiables, del mismo país y productor. Ambas deben haberse vendido al mismo país de importación y exportado en el mismo momento o uno aproximado. Se ajusta por nivel comercial, cantidad y elemento tiempo. Si hay más de un valor aplicable, se toma el más bajo.'},

steps:[

<script>
(function(){
"use strict";
function ask(t,m,yes,cb){var d=document.createElement('div');d.className='modal';d.innerHTML='<div class="mb"><h3>'+t+'</h3><p>'+m+'</p><div class="row"><button class="btn ghostb" data-a="0">Seguir jugando</button><button class="btn" data-a="1">'+yes+'</button></div></div>';document.body.appendChild(d);d.onclick=function(e){var a=e.target.getAttribute&&e.target.getAttribute('data-a');if(a===null&&e.target!==d)return;d.remove();if(a==='1')cb();};}
function guard(cb){if(cur&&cur.idx>=0)ask('¿Salir del caso?','Si salís ahora, el caso se reinicia la próxima vez.','Salir',cb);else cb();}
/* ================= state ================= */
var KEY='agencia-valoracion-v1';

load();

var RANKS=[[0,'Pasante'],[8,'Auxiliar de despachante'],[16,'Despachante junior'],[24,'Despachante'],[31,'Despachante senior']];
function totalStars(){var t=0;LEVELS.forEach(function(l){var r=S.levels[l.id];if(r)t+=r.stars||0;});return t;}
function rankOf(st){var r=RANKS[0];RANKS.forEach(function(x){if(st>=x[0])r=x;});return r;}
function nextRank(st){for(var i=0;i<RANKS.length;i++)if(st<RANKS[i][0])return RANKS[i];return null;}
function isDone(id){return !!(S.levels[id]&&S.levels[id].done);}
function unlocked(i){return i===0||isDone(LEVELS[i-1].id);}
function updTop(){var st=totalStars();document.getElementById('rankName').textContent=rankOf(st)[1];document.getElementById('xpVal').textContent=S.xp+' XP';document.getElementById('btnSnd').textContent=S.sound?'🔔':'🔕';}

var app=document.getElementById('app');
function h(html){if(window.clearGhosts)clearGhosts();app.innerHTML=html;window.scrollTo(0,0);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ================= sound & voice ================= */
var actx=null;
function tone(freqs,dur){if(!S.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();var t=actx.currentTime;freqs.forEach(function(f,i){var o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*dur);g.gain.exponentialRampToValueAtTime(.12,t+i*dur+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*dur+dur);o.connect(g);g.connect(actx.destination);o.start(t+i*dur);o.stop(t+i*dur+dur+.05);});}catch(e){}}
function sOk(){tone([660,880],.11);} function sErr(){tone([300,220],.14);} function sWin(){tone([523,659,784,1046],.13);}
var voice=null;
function pickVoice(){try{var v=speechSynthesis.getVoices();voice=v.find(function(x){return /es[-_]AR/i.test(x.lang);})||v.find(function(x){return /es[-_](419|US|MX)/i.test(x.lang);})||v.find(function(x){return /^es/i.test(x.lang);})||null;}catch(e){}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speakText(txt,btn){if(!('speechSynthesis' in window))return;if(speechSynthesis.speaking){speechSynthesis.cancel();document.querySelectorAll('.speak.on').forEach(function(b){b.classList.remove('on');b.textContent='🔊 Escuchar';});if(btn&&btn.dataset.on){btn.dataset.on='';return;}}
  txt=txt.replace(/\bart\./gi,'artículo').replace(/\barts\./gi,'artículos').replace(/U\$S/g,'dólares').replace(/\bDI\b/g,'derecho de importación').replace(/\bVA\b/g,'valor en aduana').replace(/\bVT\b/g,'valor de transacción').replace(/\bTE\b/g,'tasa de estadística').replace(/\bFOB\b/g,'fob').replace(/\bCIF\b/g,'cif').replace(/\bOMC\b/g,'o eme ce').replace(/\bGATT\b/g,'gat').replace(/\bDVB\b/g,'de ve be').replace(/\bOMA\b/g,'o eme a').replace(/[★⚑◆▸⚠]/g,'');
  var u=new SpeechSynthesisUtterance(txt);u.lang='es-AR';if(voice)u.voice=voice;u.rate=1;
  if(btn){btn.classList.add('on');btn.textContent='■ Parar';btn.dataset.on='1';u.onend=function(){btn.classList.remove('on');btn.textContent='🔊 Escuchar';btn.dataset.on='';};}
  speechSynthesis.speak(u);}

    '<h1>De pasante a despachante</h1><p>Entraste a trabajar en una agencia aduanera. Cada caso que resolvés te enseña un tema de la materia. Si te equivocás, te explicamos y volvés a intentar: acá nadie desaprueba, se aprende jugando.</p>'+
    '<div class="herostats"><div class="hs"><b>'+done+'/'+LEVELS.length+'</b><span>casos resueltos</span></div><div class="hs"><b>'+st+' ★</b><span>estrellas</span></div><div class="hs"><b>'+S.xp+'</b><span>XP</span></div></div>'+
    '<div class="rankbar"><div class="trk"><div class="fill" style="width:'+pct+'%"></div></div><div class="lb"><span>'+rk[1]+'</span><span>'+(nx?('Próximo: '+nx[1]+' ('+nx[0]+' ★)'):'Rango máximo de la zona')+'</span></div></div></section>'+

    '<button class="mode" id="mRel" '+(pool<5?'disabled':'')+'><span class="mi">⚡</span><span><b>Repaso relámpago</b><span>'+(pool<5?'Se habilita al resolver tu primer caso.':'10 preguntas mezcladas de los casos que ya resolviste.')+'</span></span></button></div>'+
    '<section class="zone"><div class="zonehead"><span class="ztag">Zona 1</span><h2>Importación</h2><span class="zp">'+done+' de '+LEVELS.length+' casos</span></div><p class="zonesub">Acuerdo del art. VII del GATT, los seis métodos, los ajustes del art. 8 y la liquidación. Los casos con ★ son núcleo de la materia.</p><div class="path">'+nodes+'</div>'+
    '<div class="zonelock"><div class="zl">🔒 <b>Zona 2 · Exportación</b>Valor imponible, ajustes, Incoterms, derechos y reintegros. Próximamente.</div><div class="zl">🔒 <b>Zona 3 · Tributación</b>Obligación tributaria, IVA, derechos, tasas y regímenes especiales. Próximamente.</div></div></section>');
