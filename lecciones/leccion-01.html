<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lección animada — Tema 1 Marco GATT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f4; --paper:#ffffff; --ink:#1c2229; --muted:#5c6672; --line:#dde3ea;
  --brand:#8a1c1c;
  --concept:#22548c; --concept-soft:#e4edf6; --concept-line:#bcd2ea;
  --ejemplo:#1f7a4d; --ejemplo-soft:#e3f2e9; --ejemplo-line:#bfe0cd;
  --error:#b5451d; --error-soft:#fbe8e0; --error-line:#f0cbb9;
  --gold:#c9972a; --gold-soft:#f6edd6; --gold-line:#e6d3a3;
  --sky:#d9ecfb; --skin:#f2c9a0; --skin2:#e0ab82;
  --shadow:0 1px 3px rgba(20,30,45,.05),0 14px 40px rgba(20,30,45,.10);
  --radius:18px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:22px 16px 90px}
.lhead{background:linear-gradient(135deg,#22548c,#16375f);border-radius:var(--radius);padding:24px 26px;color:#fff;box-shadow:var(--shadow);border-bottom:5px solid var(--gold)}
.lhead .k{font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#bcd6f0;margin:0 0 6px}
.lhead h1{font-family:Fraunces,serif;font-weight:600;font-size:1.75rem;margin:0 0 5px;line-height:1.12}
.lhead p{margin:0;color:#d7e6f6;font-size:.94rem}
.player{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);margin-top:18px;overflow:hidden;border:1px solid var(--line)}
.stage{position:relative;background:radial-gradient(900px 340px at 50% 0%, #f0f8ff, #ffffff 72%);padding:0}
.canvas{position:relative;height:370px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid var(--line)}
@media(max-width:600px){.canvas{height:300px}}
.scene{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:14px}
.scene.on{display:flex;animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.scene svg{max-width:100%;max-height:100%;height:auto}
.textpane{padding:18px 26px 4px;min-height:84px}
.fx-tag{display:inline-block;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:4px 11px;border-radius:999px;margin-bottom:8px;color:#fff}
.fx-con{background:var(--concept)} .fx-err{background:var(--error)} .fx-gold{background:#9a7414} .fx-ej{background:var(--ejemplo)}
.textpane h2{font-family:Fraunces,serif;font-weight:600;font-size:1.3rem;margin:0 0 3px;color:var(--ink)}
.textpane .sub{color:var(--muted);font-size:.92rem;margin:0}
.caption{background:#141b24;color:#eef2f7;padding:14px 22px;font-size:1rem;line-height:1.5;min-height:58px;display:flex;align-items:center}
.caption b{color:#9ecbf5}
.controls{display:flex;align-items:center;gap:10px;padding:14px 18px;background:#f7f9fb;border-top:1px solid var(--line);flex-wrap:wrap}
.btn{border:none;border-radius:11px;padding:11px 18px;font-family:inherit;font-weight:600;font-size:.95rem;cursor:pointer;display:flex;align-items:center;gap:7px}
.btn.play{background:var(--concept);color:#fff}.btn.play:hover{background:#1a4273}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.ghost:hover{background:#eef2f6}
.progress{flex:1;min-width:110px;height:8px;background:#e2e8ef;border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--concept),var(--gold));transition:width .35s ease}
.scenelabel{font-size:.8rem;color:var(--muted);font-weight:600;white-space:nowrap}
.actrl{display:flex;align-items:center;gap:7px;width:100%;margin-top:4px;padding-top:12px;border-top:1px dashed var(--line)}
.actrl label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.actrl select{font-family:inherit;font-size:.82rem;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.actrl select.voice{flex:1;min-width:140px}
.dots{display:flex;gap:7px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:#cfd8e0;cursor:pointer;transition:.2s}
.dot.on{background:var(--concept);transform:scale(1.3)}
.note{font-size:.8rem;color:var(--muted);margin-top:14px;text-align:center}
/* anim */
.pop{opacity:0;transform:scale(.5);transform-origin:center;transition:opacity .3s ease,transform .34s cubic-bezier(.3,1.5,.5,1)}
.pop.show{opacity:1;transform:scale(1)}
.slideL{opacity:0;transform:translateX(-26px);transition:.36s ease}.slideL.show{opacity:1;transform:none}
.slideR{opacity:0;transform:translateX(26px);transition:.36s ease}.slideR.show{opacity:1;transform:none}
.slideU{opacity:0;transform:translateY(22px);transition:.36s ease}.slideU.show{opacity:1;transform:none}
.slideD{opacity:0;transform:translateY(-22px);transition:.36s ease}.slideD.show{opacity:1;transform:none}
.fadein{opacity:0;transition:opacity .45s ease}.fadein.show{opacity:1}
.draw{transition:stroke-dashoffset .8s ease}.draw.show{stroke-dashoffset:0!important}
.pulse.show{animation:pulse 1.1s ease infinite}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.float.show{animation:float 2.6s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.swing.show{animation:swing 2.4s ease-in-out infinite;transform-origin:top center}@keyframes swing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.shake.show{animation:shake .45s ease}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.spin.show{animation:spin .9s ease}@keyframes spin{from{transform:rotate(-14deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
.bob.show{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="lhead">
    <p class="k">Lección animada · Tema 1 · Importación</p>
    <h1>Marco general: el Acuerdo del art. VII del GATT</h1>
    <p>De dónde viene el sistema de valoración. Dale play y seguilo.</p>
  </div>

  <div class="player">
    <div class="stage">
      <div class="canvas" id="canvas">

        <!-- ============ ESCENA 0: PUERTO con grúa, barco, aduana ============ -->
                <!-- ESCENA 0: el problema - Bruselas (precio teórico) vs valor real -->
        <section class="scene on" data-scene="0">
          <svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg">
            <text class="s0 slideD" data-a="0" x="260" y="30" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="18" fill="var(--ink)">¿Sobre qué monto se cobran los tributos?</text>
            <!-- pregunta central: valor en aduana -->
            <g class="s0 pop" data-a="0">
              <rect x="170" y="54" width="180" height="52" rx="12" fill="var(--concept-soft)" stroke="var(--concept)" stroke-width="2.5"/>
              <text x="260" y="78" text-anchor="middle" font-family="Inter" font-weight="800" font-size="14" fill="var(--concept)">VALOR EN ADUANA</text>
              <text x="260" y="96" text-anchor="middle" font-family="Inter" font-size="11" fill="var(--muted)">la base imponible</text>
            </g>
            <!-- antes: Bruselas, precio teórico/inventado -->
            <g class="s0 slideL" data-a="1">
              <rect x="30" y="150" width="200" height="150" rx="12" fill="#fbe8e0" stroke="var(--error)" stroke-width="2"/>
              <text x="130" y="176" text-anchor="middle" font-family="Inter" font-weight="800" font-size="12" fill="var(--error)">ANTES · Valor Bruselas</text>
              <text x="130" y="210" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="30" fill="var(--error)">?</text>
              <text x="130" y="238" text-anchor="middle" font-family="Inter" font-size="11" fill="#8a2f11">precio "normal teórico"</text>
              <text x="130" y="256" text-anchor="middle" font-family="Inter" font-size="11" fill="#8a2f11">fijado por la aduana</text>
              <text x="130" y="282" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11" fill="var(--error)">arbitrario ✗</text>
            </g>
            <!-- después: valor de transacción, precio real -->
            <g class="s0 slideR" data-a="2">
              <rect x="290" y="150" width="200" height="150" rx="12" fill="var(--ejemplo-soft)" stroke="var(--ejemplo)" stroke-width="2"/>
              <text x="390" y="176" text-anchor="middle" font-family="Inter" font-weight="800" font-size="12" fill="var(--ejemplo)">AHORA · Valor transacción</text>
              <rect x="340" y="194" width="100" height="40" rx="6" fill="#fff" stroke="var(--ejemplo)"/>
              <text x="390" y="212" text-anchor="middle" font-family="Inter" font-size="9" fill="var(--muted)">FACTURA</text>
              <text x="390" y="228" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="14" fill="var(--ejemplo)">$ real</text>
              <text x="390" y="256" text-anchor="middle" font-family="Inter" font-size="11" fill="#14532d">precio realmente pagado</text>
              <text x="390" y="282" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11" fill="var(--ejemplo)">objetivo ✓</text>
            </g>
          </svg>
        </section>

        <!-- ESCENA 1: línea de tiempo 1979 -> 1988 -->
        <section class="scene" data-scene="1">
          <svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg">
            <text class="s1 slideD" data-a="0" x="260" y="34" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="19" fill="var(--ink)">Cómo llegó a la Argentina</text>
            <!-- línea -->
            <line class="s1 fadein" data-a="0" x1="60" y1="170" x2="460" y2="170" stroke="#bcd2ea" stroke-width="4"/>
            <!-- hito 1979 -->
            <g class="s1 pop" data-a="0">
              <circle cx="120" cy="170" r="12" fill="var(--concept)"/>
              <text x="120" y="130" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="20" fill="var(--concept)">1979</text>
              <text x="120" y="205" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11" fill="var(--ink)">Ronda de Tokio</text>
              <text x="120" y="222" text-anchor="middle" font-family="Inter" font-size="10" fill="var(--muted)">Acuerdo art. VII</text>
              <text x="120" y="237" text-anchor="middle" font-family="Inter" font-size="10" fill="var(--muted)">del GATT</text>
            </g>
            <!-- flecha -->
            <path class="s1 fadein" data-a="1" d="M180 170 h100" fill="none" stroke="var(--gold)" stroke-width="3" marker-end="url(#ar1)"/>
            <defs><marker id="ar1" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--gold)"/></marker></defs>
            <!-- hito 1988 -->
            <g class="s1 pop" data-a="1">
              <circle cx="330" cy="170" r="14" fill="var(--brand)"/>
              <text x="330" y="128" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="22" fill="var(--brand)">1988</text>
              <text x="330" y="205" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11" fill="var(--ink)">Argentina adhiere</text>
              <text x="330" y="222" text-anchor="middle" font-family="Inter" font-size="10" fill="var(--muted)">Ley 23.311</text>
              <text x="330" y="237" text-anchor="middle" font-family="Inter" font-size="10" fill="var(--muted)">Dec. 1026/87</text>
            </g>
            <!-- resultado -->
            <g class="s1 slideU" data-a="2">
              <rect x="150" y="268" width="220" height="48" rx="12" fill="var(--ejemplo-soft)" stroke="var(--ejemplo)" stroke-width="2"/>
              <text x="260" y="289" text-anchor="middle" font-family="Inter" font-weight="800" font-size="12" fill="var(--ejemplo)">Sistema POSITIVO</text>
              <text x="260" y="306" text-anchor="middle" font-family="Inter" font-size="10.5" fill="#14532d">basado en el precio real = valor de transacción</text>
            </g>
          </svg>
        </section>

        <!-- ESCENA 2: estructura del Acuerdo -->
        <section class="scene" data-scene="2">
          <svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg">
            <text class="s2 slideD" data-a="0" x="260" y="30" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="18" fill="var(--ink)">Qué compone el Acuerdo</text>
            <g class="s2 pop" data-a="0"><rect x="40" y="56" width="200" height="48" rx="10" fill="var(--concept-soft)" stroke="var(--concept)" stroke-width="2"/><text x="60" y="85" font-family="Inter" font-weight="700" font-size="13" fill="#173a63">Preámbulo</text></g>
            <g class="s2 pop" data-a="0"><rect x="280" y="56" width="200" height="48" rx="10" fill="var(--concept-soft)" stroke="var(--concept)" stroke-width="2"/><text x="300" y="85" font-family="Inter" font-weight="700" font-size="13" fill="#173a63">Articulado</text></g>
            <g class="s2 pop" data-a="1"><rect x="40" y="116" width="440" height="52" rx="10" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/><text x="60" y="140" font-family="Inter" font-weight="700" font-size="13" fill="#7a5a09">Notas interpretativas</text><text x="60" y="158" font-family="Inter" font-size="11" fill="#7a5a09">¡forman parte del Acuerdo! (misma jerarquía)</text></g>
            <g class="s2 pop" data-a="2"><rect x="40" y="180" width="440" height="68" rx="10" fill="var(--ejemplo-soft)" stroke="var(--ejemplo)" stroke-width="2"/><text x="60" y="204" font-family="Inter" font-weight="700" font-size="13" fill="#14532d">Comité Técnico de Valoración</text><text x="60" y="224" font-family="Inter" font-size="11" fill="#14532d">opiniones consultivas · comentarios</text><text x="60" y="240" font-family="Inter" font-size="11" fill="#14532d">notas explicativas</text></g>
            <g class="s2 slideU" data-a="3"><rect x="90" y="266" width="340" height="50" rx="12" fill="#eef4fb" stroke="var(--concept)" stroke-width="2"/><text x="260" y="287" text-anchor="middle" font-family="Inter" font-weight="800" font-size="12" fill="var(--concept)">Principio rector</text><text x="260" y="304" text-anchor="middle" font-family="Inter" font-size="10.5" fill="#173a63">aceptar el precio pactado, salvo causa que obligue a apartarse</text></g>
          </svg>
        </section>

        <!-- ESCENA 3: los 6 métodos en cascada -->
        <section class="scene" data-scene="3">
          <svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg">
            <text class="s3 slideD" data-a="0" x="260" y="26" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="18" fill="var(--ink)">6 métodos · sucesivos y excluyentes</text>
            <g class="s3 slideL" data-a="0"><rect x="150" y="40" width="220" height="34" rx="8" fill="var(--concept)" /><text x="168" y="62" font-family="Inter" font-weight="700" font-size="12.5" fill="#fff">1º Valor de transacción</text></g>
            <path class="s3 fadein" data-a="0" d="M260 74 v10" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar3)"/>
            <defs><marker id="ar3" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--muted)"/></marker></defs>
            <g class="s3 slideL" data-a="1"><rect x="150" y="86" width="220" height="30" rx="8" fill="#eaf0f7" stroke="var(--concept-line)"/><text x="168" y="106" font-family="Inter" font-weight="600" font-size="12" fill="#173a63">2º Mercaderías idénticas</text></g>
            <path class="s3 fadein" data-a="1" d="M260 116 v8" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar3)"/>
            <g class="s3 slideL" data-a="1"><rect x="150" y="126" width="220" height="30" rx="8" fill="#eaf0f7" stroke="var(--concept-line)"/><text x="168" y="146" font-family="Inter" font-weight="600" font-size="12" fill="#173a63">3º Mercaderías similares</text></g>
            <path class="s3 fadein" data-a="1" d="M260 156 v8" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar3)"/>
            <g class="s3 slideL" data-a="2"><rect x="150" y="166" width="220" height="30" rx="8" fill="#eaf0f7" stroke="var(--concept-line)"/><text x="168" y="186" font-family="Inter" font-weight="600" font-size="12" fill="#173a63">4º Método deductivo</text></g>
            <path class="s3 fadein" data-a="2" d="M260 196 v8" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar3)"/>
            <g class="s3 slideL" data-a="2"><rect x="150" y="206" width="220" height="30" rx="8" fill="#eaf0f7" stroke="var(--concept-line)"/><text x="168" y="226" font-family="Inter" font-weight="600" font-size="12" fill="#173a63">5º Valor reconstruido</text></g>
            <path class="s3 fadein" data-a="2" d="M260 236 v8" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar3)"/>
            <g class="s3 slideL" data-a="2"><rect x="150" y="246" width="220" height="30" rx="8" fill="#eaf0f7" stroke="var(--concept-line)"/><text x="168" y="266" font-family="Inter" font-weight="600" font-size="12" fill="#173a63">6º Último recurso</text></g>
            <g class="s3 pop" data-a="3"><rect x="384" y="150" width="120" height="70" rx="10" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/><text x="444" y="178" text-anchor="middle" font-family="Inter" font-weight="800" font-size="11" fill="#7a5a09">Solo se pasa al</text><text x="444" y="194" text-anchor="middle" font-family="Inter" font-size="10" fill="#7a5a09">siguiente si el</text><text x="444" y="208" text-anchor="middle" font-family="Inter" font-size="10" fill="#7a5a09">anterior no aplica</text></g>
          </svg>
        </section>

      </div>
      <div class="textpane" id="textpane"></div>
    </div>

    <div class="caption" id="caption">Tocá <b>Reproducir</b> para empezar la lección.</div>

    <div class="controls">
      <button class="btn play" id="playBtn">▶ Reproducir</button>
      <button class="btn ghost" id="prevBtn">◀</button>
      <button class="btn ghost" id="nextBtn">▶</button>
      <div class="progress"><i id="bar"></i></div>
      <span class="scenelabel" id="slabel">1 / 4</span>
      <div class="actrl">
        <label>Velocidad</label><select id="rateSel"><option value="0.9">Lenta</option><option value="1" selected>Normal</option><option value="1.25">Rápida</option><option value="1.5">Muy rápida</option></select>
      </div>
    </div>
  </div>

  <div class="dots" id="dots"></div>
  <p class="note">Lección completa con voz profesional (Marcus). Dale play y seguí la explicación.</p>
</div>

<script>
const AUDIOS={1:"../audio/t01-1.mp3",2:"../audio/t01-2.mp3",3:"../audio/t01-3.mp3",4:"../audio/t01-4.mp3"};
const META=[
  {tag:'El punto de partida',cls:'fx-con',h:'¿Sobre qué monto se cobran los tributos?',sub:'El valor en aduana: la base imponible de la importación.'},
  {tag:'La solución',cls:'fx-con',h:'Del GATT a la Argentina',sub:'Ronda de Tokio 1979 y la adhesión argentina en 1988.'},
  {tag:'La estructura',cls:'fx-gold',h:'Qué compone el Acuerdo',sub:'Preámbulo, articulado, notas interpretativas y Comité Técnico.'},
  {tag:'El esquema',cls:'fx-con',h:'Los 6 métodos',sub:'Se aplican en orden sucesivo y excluyente.'}
];
const SCENES=[
  {steps:[
    {a:0,say:"Marco general del Acuerdo del artículo séptimo del GATT. La valoración aduanera responde a una pregunta simple pero decisiva: sobre qué monto se cobran los tributos a la importación. Ese monto es el valor en aduana."},
    {a:1,say:"Antes de este sistema, muchos países usaban la Definición del Valor de Bruselas, que fijaba un precio normal teórico para cada producto. Ese método era arbitrario."},
    {a:2,say:"El sistema nuevo se basa en el precio real: el valor de transacción."}
  ]},
  {steps:[
    {a:0,say:"En la Ronda de Tokio de 1979 se firmó el Acuerdo relativo a la aplicación del artículo séptimo del GATT, que estableció un sistema positivo basado en el precio realmente pagado o por pagar."},
    {a:1,say:"La Argentina adhirió a partir de 1988, mediante la ley 23.311, reglamentada por el decreto 1026 del 87."},
    {a:2,say:"Así se pasó a un sistema positivo basado en el precio real, el valor de transacción."}
  ]},
  {steps:[
    {a:0,say:"El Acuerdo tiene una estructura: preámbulo, articulado,"},
    {a:1,say:"notas interpretativas, que forman parte del Acuerdo con la misma jerarquía,"},
    {a:2,say:"y los textos del Comité Técnico de Valoración: opiniones consultivas, comentarios y notas explicativas."},
    {a:3,say:"El principio rector es aceptar el precio pactado por comprador y vendedor, salvo que exista una causa que obligue a apartarse."}
  ]},
  {steps:[
    {a:0,say:"Y establece seis métodos que se aplican en orden sucesivo y excluyente: primero el valor de transacción,"},
    {a:1,say:"después idénticas y similares,"},
    {a:2,say:"el deductivo, el reconstruido y el último recurso,"},
    {a:3,say:"pasando al siguiente solo si el anterior no puede aplicarse."}
  ]}
];

let si=0,pi=-1,playing=false,voices=[],chosenURI=null,rate=1,keepAlive=null;
const canvas=document.getElementById('canvas'),caption=document.getElementById('caption'),playBtn=document.getElementById('playBtn'),bar=document.getElementById('bar'),slabel=document.getElementById('slabel'),dotsWrap=document.getElementById('dots'),textpane=document.getElementById('textpane');
SCENES.forEach((_,i)=>{const d=document.createElement('div');d.className='dot'+(i===0?' on':'');d.onclick=()=>gotoScene(i);dotsWrap.appendChild(d);});
function paintDots(){[...dotsWrap.children].forEach((d,i)=>d.classList.toggle('on',i===si));}
function paintText(n){const m=META[n];textpane.innerHTML='<span class="fx-tag '+m.cls+'">'+m.tag+'</span><h2>'+m.h+'</h2><p class="sub">'+m.sub+'</p>';}
function showScene(n){[...canvas.querySelectorAll('.scene')].forEach(s=>s.classList.toggle('on',+s.dataset.scene===n));slabel.textContent=(n+1)+' / '+SCENES.length;bar.style.width=(n/(SCENES.length-1)*100)+'%';paintDots();paintText(n);}
function sel(n){return canvas.querySelector('.scene[data-scene="'+n+'"]');}
function resetAnims(n){sel(n).querySelectorAll('.s'+n).forEach(e=>e.classList.remove('show'));}
function showAnimsUpTo(n,a){sel(n).querySelectorAll('.s'+n).forEach(e=>{if(+e.dataset.a<=a)e.classList.add('show');});}
function showAllAnims(n){sel(n).querySelectorAll('.s'+n).forEach(e=>e.classList.add('show'));}
function highlight(t){return t.replace(/valor de transacción|precio realmente pagado|valor en aduana|artículo séptimo|ley 23.311|sucesivo y excluyente/gi,m=>'<b>'+m+'</b>');}

// Mapa escena -> lista de audios de Marcus (null = aún sin audio, usa voz navegador)
const SCENE_AUDIO = {0:[1], 1:[2], 2:[3], 3:[4]};
let curAudio=null;
function playAudioSeq(list, sceneIdx, done){
  // reproduce los audios de la escena en orden, revelando dibujos repartidos en cada audio
  let idx=0;
  const scene=SCENES[sceneIdx];
  const totalSteps=scene.steps.length;
  // repartir los pasos de animación entre los audios de la escena
  function playOne(){
    if(!playing){return;}
    if(idx>=list.length){ if(done)done(); return; }
    const src=AUDIOS[list[idx]];
    curAudio=new Audio(src);
    curAudio.playbackRate=rate;
    // revelar los dibujos de esta porción mientras suena
    curAudio.onloadedmetadata=function(){
      const dur=curAudio.duration||6;
      // qué pasos corresponden a este audio (reparto proporcional)
      const from=Math.floor(idx*totalSteps/list.length);
      const to=Math.floor((idx+1)*totalSteps/list.length);
      let k=from;
      showAnimsUpTo(sceneIdx, from);
      const gap=dur/Math.max(1,(to-from));
      const timer=setInterval(()=>{
        if(!playing){clearInterval(timer);return;}
        k++; if(k<=to) showAnimsUpTo(sceneIdx,k);
        if(k>=to) clearInterval(timer);
      }, gap*1000);
    };
    curAudio.onended=function(){ idx++; playOne(); };
    curAudio.onerror=function(){ idx++; playOne(); };
    curAudio.play().catch(()=>{ idx++; playOne(); });
  }
  playOne();
}

function playScene(){
  if(!playing)return;
  showScene(si); resetAnims(si);
  const list=SCENE_AUDIO[si]||[];
  caption.innerHTML=highlight(SCENES[si].steps.map(s=>s.say).join(' '));
  playAudioSeq(list, si, ()=>{
    if(!playing)return;
    if(si<SCENES.length-1){ si++; pi=-1; setTimeout(playScene,300); }
    else { stopPlay(); caption.innerHTML="Fin de la lección 👏"; }
  });
}
function startPlay(){playing=true;playBtn.innerHTML='❚❚ Pausar';playScene();}
function stopPlay(){playing=false;playBtn.innerHTML='▶ Reproducir';if(curAudio){curAudio.pause();curAudio=null;}if(keepAlive){clearInterval(keepAlive);keepAlive=null;}}
function togglePlay(){playing?stopPlay():startPlay();}
function gotoScene(n){stopPlay();si=n;pi=-1;showScene(n);resetAnims(n);showAllAnims(n);caption.innerHTML="Escena "+(n+1)+". Tocá reproducir para la narración desde acá.";}
playBtn.onclick=togglePlay;
document.getElementById('nextBtn').onclick=()=>{if(si<SCENES.length-1)gotoScene(si+1);};
document.getElementById('prevBtn').onclick=()=>{if(si>0)gotoScene(si-1);};
document.getElementById('rateSel').onchange=e=>{rate=parseFloat(e.target.value);if(curAudio)curAudio.playbackRate=rate;};
showScene(0);resetAnims(0);
</script>
