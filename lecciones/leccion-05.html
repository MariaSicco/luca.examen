<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lección animada — Tema 5 Idénticas y similares</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f4; --paper:#ffffff; --ink:#1c2229; --muted:#5c6672; --line:#dde3ea;
  --brand:#8a1c1c;
  --concept:#22548c; --concept-soft:#e4edf6; --concept-line:#bcd2ea;
  --ejemplo:#1f7a4d; --ejemplo-soft:#e3f2e9; --ejemplo-line:#bfe0cd;
  --error:#b5451d; --error-soft:#fbe8e0; --error-line:#f0cbb9;
  --gold:#c9972a; --gold-soft:#f6edd6; --gold-line:#e6d3a3;
  --sky:#d9ecfb; --skin:#f2c9a0; --skin2:#e0ab82;
  --shadow:0 1px 3px rgba(20,30,45,.05),0 14px 40px rgba(20,30,45,.10);
  --radius:18px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:22px 16px 90px}
.lhead{background:linear-gradient(135deg,#22548c,#16375f);border-radius:var(--radius);padding:24px 26px;color:#fff;box-shadow:var(--shadow);border-bottom:5px solid var(--gold)}
.lhead .k{font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#bcd6f0;margin:0 0 6px}
.lhead h1{font-family:Fraunces,serif;font-weight:600;font-size:1.75rem;margin:0 0 5px;line-height:1.12}
.lhead p{margin:0;color:#d7e6f6;font-size:.94rem}
.player{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);margin-top:18px;overflow:hidden;border:1px solid var(--line)}
.stage{position:relative;background:radial-gradient(900px 340px at 50% 0%, #f0f8ff, #ffffff 72%);padding:0}
.canvas{position:relative;height:370px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid var(--line)}
@media(max-width:600px){.canvas{height:300px}}
.scene{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:14px}
.scene.on{display:flex;animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.scene svg{max-width:100%;max-height:100%;height:auto}
.textpane{padding:18px 26px 4px;min-height:84px}
.fx-tag{display:inline-block;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:4px 11px;border-radius:999px;margin-bottom:8px;color:#fff}
.fx-con{background:var(--concept)} .fx-err{background:var(--error)} .fx-gold{background:#9a7414} .fx-ej{background:var(--ejemplo)}
.textpane h2{font-family:Fraunces,serif;font-weight:600;font-size:1.3rem;margin:0 0 3px;color:var(--ink)}
.textpane .sub{color:var(--muted);font-size:.92rem;margin:0}
.caption{background:#141b24;color:#eef2f7;padding:14px 22px;font-size:1rem;line-height:1.5;min-height:58px;display:flex;align-items:center}
.caption b{color:#9ecbf5}
.controls{display:flex;align-items:center;gap:10px;padding:14px 18px;background:#f7f9fb;border-top:1px solid var(--line);flex-wrap:wrap}
.btn{border:none;border-radius:11px;padding:11px 18px;font-family:inherit;font-weight:600;font-size:.95rem;cursor:pointer;display:flex;align-items:center;gap:7px}
.btn.play{background:var(--concept);color:#fff}.btn.play:hover{background:#1a4273}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.ghost:hover{background:#eef2f6}
.progress{flex:1;min-width:110px;height:8px;background:#e2e8ef;border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--concept),var(--gold));transition:width .35s ease}
.scenelabel{font-size:.8rem;color:var(--muted);font-weight:600;white-space:nowrap}
.actrl{display:flex;align-items:center;gap:7px;width:100%;margin-top:4px;padding-top:12px;border-top:1px dashed var(--line)}
.actrl label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.actrl select{font-family:inherit;font-size:.82rem;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.actrl select.voice{flex:1;min-width:140px}
.dots{display:flex;gap:7px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:#cfd8e0;cursor:pointer;transition:.2s}
.dot.on{background:var(--concept);transform:scale(1.3)}
.note{font-size:.8rem;color:var(--muted);margin-top:14px;text-align:center}
/* anim */
.pop{opacity:0;transform:scale(.5);transform-origin:center;transition:opacity .3s ease,transform .34s cubic-bezier(.3,1.5,.5,1)}
.pop.show{opacity:1;transform:scale(1)}
.slideL{opacity:0;transform:translateX(-26px);transition:.36s ease}.slideL.show{opacity:1;transform:none}
.slideR{opacity:0;transform:translateX(26px);transition:.36s ease}.slideR.show{opacity:1;transform:none}
.slideU{opacity:0;transform:translateY(22px);transition:.36s ease}.slideU.show{opacity:1;transform:none}
.slideD{opacity:0;transform:translateY(-22px);transition:.36s ease}.slideD.show{opacity:1;transform:none}
.fadein{opacity:0;transition:opacity .45s ease}.fadein.show{opacity:1}
.draw{transition:stroke-dashoffset .8s ease}.draw.show{stroke-dashoffset:0!important}
.pulse.show{animation:pulse 1.1s ease infinite}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.float.show{animation:float 2.6s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.swing.show{animation:swing 2.4s ease-in-out infinite;transform-origin:top center}@keyframes swing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.shake.show{animation:shake .45s ease}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.spin.show{animation:spin .9s ease}@keyframes spin{from{transform:rotate(-14deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
.bob.show{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="lhead">
    <p class="k">Lección animada · Tema 5 · Importación</p>
    <h1>Arts. 2 y 3 — Mercaderías idénticas y similares</h1>
    <p>Los métodos 2 y 3. Dale play y seguilo.</p>
  </div>

  <div class="player">
    <div class="stage">
      <div class="canvas" id="canvas">

        <!-- ============ ESCENA 0: PUERTO con grúa, barco, aduana ============ -->
                <!-- ESCENA 0: el problema - Bruselas (precio teórico) vs valor real -->
                <!-- ESCENA 0: la cascada hacia idénticas/similares -->
        <section class="scene on" data-scene="0">
          <svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg">
            <text class="s0 slideD" data-a="0" x="260" y="30" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="18" fill="var(--ink)">Cuando no se puede usar el art. 1…</text>
            <!-- método 1 tachado -->
            <g class="s0 pop" data-a="0"><rect x="150" y="56" width="220" height="40" rx="10" fill="#f3f3f3" stroke="var(--muted)" stroke-width="2"/><text x="260" y="81" text-anchor="middle" font-family="Inter" font-weight="600" font-size="12.5" fill="var(--muted)">1º Valor de transacción</text><line x1="160" y1="76" x2="360" y2="76" stroke="var(--error)" stroke-width="3"/></g>
            <path class="s0 fadein" data-a="0" d="M260 96 v14" stroke="var(--concept)" stroke-width="2.5" marker-end="url(#ar5)"/>
            <defs><marker id="ar5" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--concept)"/></marker></defs>
            <!-- método 2 idénticas -->
            <g class="s0 pop" data-a="1"><rect x="110" y="120" width="300" height="52" rx="12" fill="var(--concept-soft)" stroke="var(--concept)" stroke-width="2.5"/><text x="260" y="143" text-anchor="middle" font-family="Inter" font-weight="800" font-size="14" fill="var(--concept)">2º Mercaderías IDÉNTICAS (art. 2)</text><text x="260" y="162" text-anchor="middle" font-family="Inter" font-size="11" fill="var(--muted)">valor ya aceptado de mercadería igual</text></g>
            <path class="s0 fadein" data-a="2" d="M260 172 v14" stroke="var(--concept)" stroke-width="2.5" marker-end="url(#ar5)"/>
            <text class="s0 fadein" data-a="2" x="300" y="184" font-family="Inter" font-size="10" fill="var(--muted)">si no hay idénticas…</text>
            <!-- método 3 similares -->
            <g class="s0 pop" data-a="2"><rect x="110" y="196" width="300" height="52" rx="12" fill="var(--ejemplo-soft)" stroke="var(--ejemplo)" stroke-width="2.5"/><text x="260" y="219" text-anchor="middle" font-family="Inter" font-weight="800" font-size="14" fill="var(--ejemplo)">3º Mercaderías SIMILARES (art. 3)</text><text x="260" y="238" text-anchor="middle" font-family="Inter" font-size="11" fill="#14532d">valor ya aceptado de mercadería parecida</text></g>
          </svg>
        </section>

        <!-- ESCENA 1: idénticas vs similares -->
        <section class="scene" data-scene="1">
          <svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg">
            <!-- idénticas -->
            <g class="s1 slideL" data-a="0"><rect x="20" y="40" width="230" height="250" rx="14" fill="var(--concept-soft)" stroke="var(--concept)" stroke-width="2"/><text x="135" y="66" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="15" fill="var(--concept)">IDÉNTICAS</text><text x="135" y="86" text-anchor="middle" font-family="Inter" font-size="10.5" fill="var(--muted)">iguales en TODO</text></g>
            <g class="s1 pop" data-a="0"><text x="40" y="118" font-family="Inter" font-size="11.5" fill="#173a63">✓ características físicas</text></g>
            <g class="s1 pop" data-a="0"><text x="40" y="142" font-family="Inter" font-size="11.5" fill="#173a63">✓ calidad y prestigio</text></g>
            <g class="s1 pop" data-a="1"><text x="40" y="166" font-family="Inter" font-size="11.5" fill="#173a63">✓ mismo país</text></g>
            <g class="s1 pop" data-a="1"><text x="40" y="190" font-family="Inter" font-size="11.5" fill="#173a63">✓ mismo productor</text></g>
            <g class="s1 fadein" data-a="1"><rect x="36" y="212" width="198" height="56" rx="8" fill="#fff" stroke="var(--concept-line)"/><text x="135" y="234" text-anchor="middle" font-family="Inter" font-size="10.5" fill="var(--muted)">pequeñas diferencias de</text><text x="135" y="250" text-anchor="middle" font-family="Inter" font-size="10.5" fill="var(--muted)">aspecto NO impiden</text><text x="135" y="263" text-anchor="middle" font-family="Inter" font-weight="700" font-size="10.5" fill="var(--concept)">que sean idénticas</text></g>
            <!-- similares -->
            <g class="s1 slideR" data-a="2"><rect x="270" y="40" width="230" height="250" rx="14" fill="var(--ejemplo-soft)" stroke="var(--ejemplo)" stroke-width="2"/><text x="385" y="66" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="15" fill="var(--ejemplo)">SIMILARES</text><text x="385" y="86" text-anchor="middle" font-family="Inter" font-size="10.5" fill="var(--muted)">muy semejantes</text></g>
            <g class="s1 pop" data-a="2"><text x="290" y="118" font-family="Inter" font-size="11.5" fill="#14532d">≈ composición parecida</text></g>
            <g class="s1 pop" data-a="2"><text x="290" y="142" font-family="Inter" font-size="11.5" fill="#14532d">≈ mismas funciones</text></g>
            <g class="s1 pop" data-a="3"><text x="290" y="166" font-family="Inter" font-size="11.5" fill="#14532d">≈ intercambiables</text></g>
            <g class="s1 pop" data-a="3"><text x="290" y="190" font-family="Inter" font-size="11.5" fill="#14532d">≈ mismo país y productor</text></g>
          </svg>
        </section>

        <!-- ESCENA 2: condiciones + exclusión -->
        <section class="scene" data-scene="2">
          <svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg">
            <text class="s2 slideD" data-a="0" x="260" y="30" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="17" fill="var(--ink)">Condiciones de la comparación</text>
            <g class="s2 slideL" data-a="0"><rect x="40" y="52" width="440" height="46" rx="10" fill="var(--concept-soft)" stroke="var(--concept-line)"/><text x="60" y="72" font-family="Inter" font-weight="700" font-size="12.5" fill="#173a63">Vendidas al mismo país de importación</text><text x="60" y="89" font-family="Inter" font-size="11" fill="var(--muted)">la operación de comparación debe ser al mismo destino</text></g>
            <g class="s2 slideL" data-a="1"><rect x="40" y="106" width="440" height="46" rx="10" fill="var(--concept-soft)" stroke="var(--concept-line)"/><text x="60" y="126" font-family="Inter" font-weight="700" font-size="12.5" fill="#173a63">Exportadas en el mismo momento o aproximado</text><text x="60" y="143" font-family="Inter" font-size="11" fill="var(--muted)">el elemento tiempo importa</text></g>
            <!-- exclusión -->
            <text class="s2 slideD" data-a="2" x="260" y="186" text-anchor="middle" font-family="Inter" font-weight="800" font-size="12.5" fill="var(--error)">⚠ La definición EXCLUYE:</text>
            <g class="s2 pop" data-a="2"><rect x="60" y="198" width="400" height="84" rx="12" fill="var(--error-soft)" stroke="var(--error)" stroke-width="2"/><text x="260" y="222" text-anchor="middle" font-family="Inter" font-weight="700" font-size="12" fill="#8a2f11">mercaderías con trabajos de ingeniería</text><text x="260" y="240" text-anchor="middle" font-family="Inter" font-size="11" fill="#8a2f11">o artísticos suministrados por el comprador,</text><text x="260" y="256" text-anchor="middle" font-family="Inter" font-size="11" fill="#8a2f11">hechos en el país de importación,</text><text x="260" y="272" text-anchor="middle" font-family="Inter" font-size="11" fill="#8a2f11">que no fueron ajustados por el art. 8</text></g>
          </svg>
        </section>

        <!-- ESCENA 3: ajustes + regla del más bajo -->
        <section class="scene" data-scene="3">
          <svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg">
            <text class="s3 slideD" data-a="0" x="260" y="30" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="17" fill="var(--ink)">Para comparar hay que ajustar por…</text>
            <g class="s3 pop" data-a="0"><rect x="40" y="52" width="140" height="56" rx="12" fill="var(--concept-soft)" stroke="var(--concept)" stroke-width="2"/><text x="110" y="78" text-anchor="middle" font-family="Inter" font-weight="700" font-size="12" fill="var(--concept)">Nivel</text><text x="110" y="95" text-anchor="middle" font-family="Inter" font-size="10.5" fill="var(--muted)">comercial</text></g>
            <g class="s3 pop" data-a="0"><rect x="190" y="52" width="140" height="56" rx="12" fill="var(--concept-soft)" stroke="var(--concept)" stroke-width="2"/><text x="260" y="78" text-anchor="middle" font-family="Inter" font-weight="700" font-size="12" fill="var(--concept)">Cantidad</text></g>
            <g class="s3 pop" data-a="0"><rect x="340" y="52" width="140" height="56" rx="12" fill="var(--concept-soft)" stroke="var(--concept)" stroke-width="2"/><text x="410" y="78" text-anchor="middle" font-family="Inter" font-weight="700" font-size="12" fill="var(--concept)">Tiempo</text></g>
            <!-- regla del más bajo -->
            <text class="s3 slideD" data-a="1" x="260" y="150" text-anchor="middle" font-family="Inter" font-weight="700" font-size="12.5" fill="var(--muted)">Si hay más de un valor…</text>
            <g class="s3 slideL" data-a="1"><rect x="70" y="164" width="90" height="44" rx="10" fill="#f3f6fa" stroke="var(--concept-line)"/><text x="115" y="192" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="17" fill="var(--muted)">100</text></g>
            <g class="s3 slideL" data-a="1"><rect x="215" y="164" width="90" height="44" rx="10" fill="var(--ejemplo-soft)" stroke="var(--ejemplo)" stroke-width="2.5"/><text x="260" y="192" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="17" fill="var(--ejemplo)">85</text></g>
            <g class="s3 slideL" data-a="1"><rect x="360" y="164" width="90" height="44" rx="10" fill="#f3f6fa" stroke="var(--concept-line)"/><text x="405" y="192" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="17" fill="var(--muted)">120</text></g>
            <g class="s3 pop shake" data-a="1"><rect x="110" y="232" width="300" height="52" rx="12" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2.5"/><text x="260" y="254" text-anchor="middle" font-family="Inter" font-weight="800" font-size="13" fill="#7a5a09">Se toma el valor MÁS BAJO</text><text x="260" y="273" text-anchor="middle" font-family="Inter" font-size="11" fill="#7a5a09">(en el ejemplo: 85)</text></g>
          </svg>
        </section>

      </div>
      <div class="textpane" id="textpane"></div>
    </div>

    <div class="caption" id="caption">Tocá <b>Reproducir</b> para empezar la lección.</div>

    <div class="controls">
      <button class="btn play" id="playBtn">▶ Reproducir</button>
      <button class="btn ghost" id="prevBtn">◀</button>
      <button class="btn ghost" id="nextBtn">▶</button>
      <div class="progress"><i id="bar"></i></div>
      <span class="scenelabel" id="slabel">1 / 4</span>
      <div class="actrl">
        <label>Velocidad</label><select id="rateSel"><option value="0.9">Lenta</option><option value="1" selected>Normal</option><option value="1.25">Rápida</option><option value="1.5">Muy rápida</option></select>
      </div>
    </div>
  </div>

  <div class="dots" id="dots"></div>
  <p class="note">Lección completa con voz profesional (Marcus). Dale play y seguí la explicación.</p>
</div>

<script>
const AUDIOS={1:"../audio/t05-1.mp3",2:"../audio/t05-2.mp3",3:"../audio/t05-3.mp3",4:"../audio/t05-4.mp3"};
const META=[
  {tag:'La cascada',cls:'fx-con',h:'Métodos 2 y 3',sub:'Si no hay art. 1 → idénticas; si no hay idénticas → similares.'},
  {tag:'La comparación',cls:'fx-con',h:'Idénticas vs similares',sub:'Iguales en todo, o muy semejantes e intercambiables.'},
  {tag:'Condiciones',cls:'fx-err',h:'Requisitos y exclusión',sub:'Mismo país y momento; se excluye la ingeniería del comprador.'},
  {tag:'Los ajustes',cls:'fx-gold',h:'Ajustar y elegir',sub:'Por nivel, cantidad y tiempo; se toma el valor más bajo.'}
];
const SCENES=[
  {steps:[
    {a:0,say:"Artículos segundo y tercero: mercaderías idénticas y similares. Cuando no se puede usar el valor de transacción del artículo primero, el sistema pasa al segundo método."},
    {a:1,say:"El valor de transacción de mercaderías idénticas: tomar el valor ya aceptado de otra operación de mercadería igual."},
    {a:2,say:"Y si no hay idénticas, al tercero: similares, es decir mercadería parecida."}
  ]},
  {steps:[
    {a:0,say:"Mercaderías idénticas son las que son iguales en todos los aspectos: características físicas, calidad y prestigio comercial;"},
    {a:1,say:"producidas en el mismo país y por el mismo productor. Las pequeñas diferencias de aspecto no impiden considerarlas idénticas."},
    {a:2,say:"Mercaderías similares son las muy semejantes en composición y características, que cumplen las mismas funciones y son comercialmente intercambiables;"},
    {a:3,say:"también del mismo país y productor."}
  ]},
  {steps:[
    {a:0,say:"En ambos casos, las mercaderías de comparación deben haberse vendido al mismo país de importación,"},
    {a:1,say:"y exportado en el mismo momento o en un momento aproximado."},
    {a:2,say:"Punto importante: la definición excluye las mercaderías que incluyen trabajos de ingeniería o artísticos suministrados por el comprador, realizados en el país de importación, que no fueron ajustados por el artículo octavo."}
  ]},
  {steps:[
    {a:0,say:"Ahora bien, para comparar hay que ajustar por las diferencias de nivel comercial, de cantidad, y por el elemento tiempo."},
    {a:1,say:"Y si existe más de un valor de transacción de mercaderías idénticas o similares, se toma el valor más bajo."}
  ]}
];

let si=0,pi=-1,playing=false,voices=[],chosenURI=null,rate=1,keepAlive=null;
const canvas=document.getElementById('canvas'),caption=document.getElementById('caption'),playBtn=document.getElementById('playBtn'),bar=document.getElementById('bar'),slabel=document.getElementById('slabel'),dotsWrap=document.getElementById('dots'),textpane=document.getElementById('textpane');
SCENES.forEach((_,i)=>{const d=document.createElement('div');d.className='dot'+(i===0?' on':'');d.onclick=()=>gotoScene(i);dotsWrap.appendChild(d);});
function paintDots(){[...dotsWrap.children].forEach((d,i)=>d.classList.toggle('on',i===si));}
function paintText(n){const m=META[n];textpane.innerHTML='<span class="fx-tag '+m.cls+'">'+m.tag+'</span><h2>'+m.h+'</h2><p class="sub">'+m.sub+'</p>';}
function showScene(n){[...canvas.querySelectorAll('.scene')].forEach(s=>s.classList.toggle('on',+s.dataset.scene===n));slabel.textContent=(n+1)+' / '+SCENES.length;bar.style.width=(n/(SCENES.length-1)*100)+'%';paintDots();paintText(n);}
function sel(n){return canvas.querySelector('.scene[data-scene="'+n+'"]');}
function resetAnims(n){sel(n).querySelectorAll('.s'+n).forEach(e=>e.classList.remove('show'));}
function showAnimsUpTo(n,a){sel(n).querySelectorAll('.s'+n).forEach(e=>{if(+e.dataset.a<=a)e.classList.add('show');});}
function showAllAnims(n){sel(n).querySelectorAll('.s'+n).forEach(e=>e.classList.add('show'));}
function highlight(t){return t.replace(/idénticas|similares|mismo país|mismo productor|intercambiables|valor más bajo|artículo octavo/gi,m=>'<b>'+m+'</b>');}

// Mapa escena -> lista de audios de Marcus (null = aún sin audio, usa voz navegador)
const SCENE_AUDIO = {0:[1], 1:[2], 2:[3], 3:[4]};
let curAudio=null;
function playAudioSeq(list, sceneIdx, done){
  // reproduce los audios de la escena en orden, revelando dibujos repartidos en cada audio
  let idx=0;
  const scene=SCENES[sceneIdx];
  const totalSteps=scene.steps.length;
  // repartir los pasos de animación entre los audios de la escena
  function playOne(){
    if(!playing){return;}
    if(idx>=list.length){ if(done)done(); return; }
    const src=AUDIOS[list[idx]];
    curAudio=new Audio(src);
    curAudio.playbackRate=rate;
    // revelar los dibujos de esta porción mientras suena
    curAudio.onloadedmetadata=function(){
      const dur=curAudio.duration||6;
      // qué pasos corresponden a este audio (reparto proporcional)
      const from=Math.floor(idx*totalSteps/list.length);
      const to=Math.floor((idx+1)*totalSteps/list.length);
      let k=from;
      showAnimsUpTo(sceneIdx, from);
      const gap=dur/Math.max(1,(to-from));
      const timer=setInterval(()=>{
        if(!playing){clearInterval(timer);return;}
        k++; if(k<=to) showAnimsUpTo(sceneIdx,k);
        if(k>=to) clearInterval(timer);
      }, gap*1000);
    };
    curAudio.onended=function(){ idx++; playOne(); };
    curAudio.onerror=function(){ idx++; playOne(); };
    curAudio.play().catch(()=>{ idx++; playOne(); });
  }
  playOne();
}

function playScene(){
  if(!playing)return;
  showScene(si); resetAnims(si);
  const list=SCENE_AUDIO[si]||[];
  caption.innerHTML=highlight(SCENES[si].steps.map(s=>s.say).join(' '));
  playAudioSeq(list, si, ()=>{
    if(!playing)return;
    if(si<SCENES.length-1){ si++; pi=-1; setTimeout(playScene,300); }
    else { stopPlay(); caption.innerHTML="Fin de la lección 👏"; }
  });
}
function startPlay(){playing=true;playBtn.innerHTML='❚❚ Pausar';playScene();}
function stopPlay(){playing=false;playBtn.innerHTML='▶ Reproducir';if(curAudio){curAudio.pause();curAudio=null;}if(keepAlive){clearInterval(keepAlive);keepAlive=null;}}
function togglePlay(){playing?stopPlay():startPlay();}
function gotoScene(n){stopPlay();si=n;pi=-1;showScene(n);resetAnims(n);showAllAnims(n);caption.innerHTML="Escena "+(n+1)+". Tocá reproducir para la narración desde acá.";}
playBtn.onclick=togglePlay;
document.getElementById('nextBtn').onclick=()=>{if(si<SCENES.length-1)gotoScene(si+1);};
document.getElementById('prevBtn').onclick=()=>{if(si>0)gotoScene(si-1);};
document.getElementById('rateSel').onchange=e=>{rate=parseFloat(e.target.value);if(curAudio)curAudio.playbackRate=rate;};
showScene(0);resetAnims(0);
</script>
