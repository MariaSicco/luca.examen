<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lección animada — Tema 3 Vinculación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f4; --paper:#ffffff; --ink:#1c2229; --muted:#5c6672; --line:#dde3ea;
  --brand:#8a1c1c;
  --concept:#22548c; --concept-soft:#e4edf6; --concept-line:#bcd2ea;
  --ejemplo:#1f7a4d; --ejemplo-soft:#e3f2e9; --ejemplo-line:#bfe0cd;
  --error:#b5451d; --error-soft:#fbe8e0; --error-line:#f0cbb9;
  --gold:#c9972a; --gold-soft:#f6edd6; --gold-line:#e6d3a3;
  --sky:#d9ecfb; --skin:#f2c9a0; --skin2:#e0ab82;
  --shadow:0 1px 3px rgba(20,30,45,.05),0 14px 40px rgba(20,30,45,.10);
  --radius:18px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:22px 16px 90px}
.lhead{background:linear-gradient(135deg,#22548c,#16375f);border-radius:var(--radius);padding:24px 26px;color:#fff;box-shadow:var(--shadow);border-bottom:5px solid var(--gold)}
.lhead .k{font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#bcd6f0;margin:0 0 6px}
.lhead h1{font-family:Fraunces,serif;font-weight:600;font-size:1.75rem;margin:0 0 5px;line-height:1.12}
.lhead p{margin:0;color:#d7e6f6;font-size:.94rem}
.player{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);margin-top:18px;overflow:hidden;border:1px solid var(--line)}
.stage{position:relative;background:radial-gradient(900px 340px at 50% 0%, #f0f8ff, #ffffff 72%);padding:0}
.canvas{position:relative;height:370px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid var(--line)}
@media(max-width:600px){.canvas{height:300px}}
.scene{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:14px}
.scene.on{display:flex;animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.scene svg{max-width:100%;max-height:100%;height:auto}
.textpane{padding:18px 26px 4px;min-height:84px}
.fx-tag{display:inline-block;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:4px 11px;border-radius:999px;margin-bottom:8px;color:#fff}
.fx-con{background:var(--concept)} .fx-err{background:var(--error)} .fx-gold{background:#9a7414} .fx-ej{background:var(--ejemplo)}
.textpane h2{font-family:Fraunces,serif;font-weight:600;font-size:1.3rem;margin:0 0 3px;color:var(--ink)}
.textpane .sub{color:var(--muted);font-size:.92rem;margin:0}
.caption{background:#141b24;color:#eef2f7;padding:14px 22px;font-size:1rem;line-height:1.5;min-height:58px;display:flex;align-items:center}
.caption b{color:#9ecbf5}
.controls{display:flex;align-items:center;gap:10px;padding:14px 18px;background:#f7f9fb;border-top:1px solid var(--line);flex-wrap:wrap}
.btn{border:none;border-radius:11px;padding:11px 18px;font-family:inherit;font-weight:600;font-size:.95rem;cursor:pointer;display:flex;align-items:center;gap:7px}
.btn.play{background:var(--concept);color:#fff}.btn.play:hover{background:#1a4273}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.ghost:hover{background:#eef2f6}
.progress{flex:1;min-width:110px;height:8px;background:#e2e8ef;border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--concept),var(--gold));transition:width .35s ease}
.scenelabel{font-size:.8rem;color:var(--muted);font-weight:600;white-space:nowrap}
.actrl{display:flex;align-items:center;gap:7px;width:100%;margin-top:4px;padding-top:12px;border-top:1px dashed var(--line)}
.actrl label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.actrl select{font-family:inherit;font-size:.82rem;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.actrl select.voice{flex:1;min-width:140px}
.dots{display:flex;gap:7px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:#cfd8e0;cursor:pointer;transition:.2s}
.dot.on{background:var(--concept);transform:scale(1.3)}
.note{font-size:.8rem;color:var(--muted);margin-top:14px;text-align:center}
/* anim */
.pop{opacity:0;transform:scale(.5);transform-origin:center;transition:opacity .3s ease,transform .34s cubic-bezier(.3,1.5,.5,1)}
.pop.show{opacity:1;transform:scale(1)}
.slideL{opacity:0;transform:translateX(-26px);transition:.36s ease}.slideL.show{opacity:1;transform:none}
.slideR{opacity:0;transform:translateX(26px);transition:.36s ease}.slideR.show{opacity:1;transform:none}
.slideU{opacity:0;transform:translateY(22px);transition:.36s ease}.slideU.show{opacity:1;transform:none}
.slideD{opacity:0;transform:translateY(-22px);transition:.36s ease}.slideD.show{opacity:1;transform:none}
.fadein{opacity:0;transition:opacity .45s ease}.fadein.show{opacity:1}
.draw{transition:stroke-dashoffset .8s ease}.draw.show{stroke-dashoffset:0!important}
.pulse.show{animation:pulse 1.1s ease infinite}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.float.show{animation:float 2.6s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.swing.show{animation:swing 2.4s ease-in-out infinite;transform-origin:top center}@keyframes swing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.shake.show{animation:shake .45s ease}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.spin.show{animation:spin .9s ease}@keyframes spin{from{transform:rotate(-14deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
.bob.show{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="lhead">
    <p class="k">Lección animada · Tema 3 · Importación</p>
    <h1>Vinculación y valores criterio</h1>
    <p>El tema más abstracto y más preguntado. Dale play y seguilo.</p>
  </div>

  <div class="player">
    <div class="stage">
      <div class="canvas" id="canvas">

        <!-- ============ ESCENA 0: PUERTO con grúa, barco, aduana ============ -->
                <!-- ESCENA 0: el problema - Bruselas (precio teórico) vs valor real -->
                <!-- ESCENA 0: idea central - vinculados ≠ descarte -->
        <section class="scene on" data-scene="0">
          <svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg">
            <text class="s0 slideD" data-a="0" x="260" y="28" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="18" fill="var(--error)">Vinculados ≠ descarte automático</text>
            <!-- dos empresas -->
            <g class="s0 slideL" data-a="0"><rect x="30" y="60" width="96" height="76" rx="8" fill="#eef4fb" stroke="var(--concept)" stroke-width="2.5"/><rect x="48" y="78" width="18" height="18" fill="var(--concept)"/><rect x="72" y="78" width="18" height="18" fill="var(--concept)"/><rect x="48" y="104" width="18" height="18" fill="var(--concept)"/><rect x="72" y="104" width="18" height="18" fill="var(--concept)"/><text x="78" y="152" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11" fill="var(--concept)">Vendedor</text></g>
            <g class="s0 slideR" data-a="0"><rect x="394" y="60" width="96" height="76" rx="8" fill="#eef4fb" stroke="var(--concept)" stroke-width="2.5"/><rect x="412" y="78" width="18" height="18" fill="var(--concept)"/><rect x="436" y="78" width="18" height="18" fill="var(--concept)"/><rect x="412" y="104" width="18" height="18" fill="var(--concept)"/><rect x="436" y="104" width="18" height="18" fill="var(--concept)"/><text x="442" y="152" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11" fill="var(--concept)">Comprador</text></g>
            <!-- vínculo -->
            <path class="s0 fadein" data-a="0" d="M126 98 h268" stroke="var(--gold)" stroke-width="3" stroke-dasharray="5 4"/>
            <g class="s0 pop" data-a="0"><circle cx="260" cy="98" r="22" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/><text x="260" y="102" text-anchor="middle" font-family="Inter" font-weight="800" font-size="10" fill="#7a5a09">vínculo</text></g>
            <!-- tipos de vinculación (aparecen con la narración) -->
            <text class="s0 fadein" data-a="1" x="260" y="186" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11.5" fill="var(--muted)">Hay vinculación si…</text>
            <g class="s0 pop" data-a="1"><rect x="40" y="198" width="135" height="28" rx="7" fill="#f3f6fa" stroke="var(--concept-line)"/><text x="52" y="216" font-family="Inter" font-size="10.5" fill="#173a63">una controla a la otra</text></g>
            <g class="s0 pop" data-a="1"><rect x="192" y="198" width="135" height="28" rx="7" fill="#f3f6fa" stroke="var(--concept-line)"/><text x="204" y="216" font-family="Inter" font-size="10.5" fill="#173a63">son socios</text></g>
            <g class="s0 pop" data-a="1"><rect x="344" y="198" width="140" height="28" rx="7" fill="#f3f6fa" stroke="var(--concept-line)"/><text x="356" y="216" font-family="Inter" font-size="10.5" fill="#173a63">empleador / empleado</text></g>
            <g class="s0 pop" data-a="1"><rect x="110" y="232" width="135" height="28" rx="7" fill="#f3f6fa" stroke="var(--concept-line)"/><text x="122" y="250" font-family="Inter" font-size="10.5" fill="#173a63">controla el capital</text></g>
            <g class="s0 pop" data-a="1"><rect x="262" y="232" width="135" height="28" rx="7" fill="#f3f6fa" stroke="var(--concept-line)"/><text x="274" y="250" font-family="Inter" font-size="10.5" fill="#173a63">misma familia</text></g>
            <!-- la clave: solo descarta si influyó -->
            <g class="s0 pop shake" data-a="2"><rect x="100" y="272" width="320" height="46" rx="12" fill="var(--error-soft)" stroke="var(--error)" stroke-width="2.5"/><text x="260" y="292" text-anchor="middle" font-family="Inter" font-weight="800" font-size="12.5" fill="var(--error)">Solo se descarta si INFLUYÓ en el precio</text><text x="260" y="309" text-anchor="middle" font-family="Inter" font-size="10.5" fill="var(--error)">la vinculación sola no alcanza</text></g>
          </svg>
        </section>

        <!-- ESCENA 1: camino 1 - examen de las circunstancias -->
        <section class="scene" data-scene="1">
          <svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg">
            <text class="s1 slideD" data-a="0" x="260" y="30" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="17" fill="var(--ink)">Camino 1 · Examen de las circunstancias</text>
            <text class="s1 fadein" data-a="0" x="260" y="52" text-anchor="middle" font-family="Inter" font-size="11.5" fill="var(--muted)">lo hace la ADUANA</text>
            <!-- lupa sobre la venta -->
            <g class="s1 pop" data-a="0"><circle cx="110" cy="150" r="46" fill="none" stroke="var(--concept)" stroke-width="5"/><line x1="143" y1="183" x2="172" y2="212" stroke="var(--concept)" stroke-width="8" stroke-linecap="round"/><text x="110" y="155" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="20" fill="var(--concept)">?</text></g>
            <!-- preguntas que analiza -->
            <g class="s1 slideR" data-a="1"><rect x="210" y="96" width="290" height="44" rx="10" fill="var(--concept-soft)" stroke="var(--concept-line)"/><text x="226" y="114" font-family="Inter" font-weight="600" font-size="11.5" fill="#173a63">¿El precio se fijó como en el sector?</text><text x="226" y="130" font-family="Inter" font-size="10.5" fill="var(--muted)">prácticas normales de la rama</text></g>
            <g class="s1 slideR" data-a="2"><rect x="210" y="150" width="290" height="44" rx="10" fill="var(--concept-soft)" stroke="var(--concept-line)"/><text x="226" y="168" font-family="Inter" font-weight="600" font-size="11.5" fill="#173a63">¿El vendedor cubrió costos + beneficio?</text><text x="226" y="184" font-family="Inter" font-size="10.5" fill="var(--muted)">beneficio representativo</text></g>
            <!-- resultado -->
            <g class="s1 pop" data-a="3"><rect x="80" y="258" width="360" height="54" rx="12" fill="var(--ejemplo-soft)" stroke="var(--ejemplo)" stroke-width="2.5"/><text x="260" y="280" text-anchor="middle" font-family="Inter" font-weight="800" font-size="12.5" fill="var(--ejemplo)">Si se comportó como venta entre independientes…</text><text x="260" y="300" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11.5" fill="#14532d">la vinculación NO influyó → se acepta el art. 1 ✓</text></g>
          </svg>
        </section>

        <!-- ESCENA 2: camino 2 - valores criterio -->
        <section class="scene" data-scene="2">
          <svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg">
            <text class="s2 slideD" data-a="0" x="260" y="30" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="17" fill="var(--ink)">Camino 2 · Valores criterio</text>
            <text class="s2 fadein" data-a="0" x="260" y="52" text-anchor="middle" font-family="Inter" font-size="11.5" fill="var(--muted)">lo tiene el IMPORTADOR</text>
            <!-- mi valor -->
            <g class="s2 slideL" data-a="0"><rect x="40" y="76" width="120" height="56" rx="10" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/><text x="100" y="100" text-anchor="middle" font-family="Inter" font-weight="700" font-size="12" fill="#7a5a09">MI valor</text><text x="100" y="118" text-anchor="middle" font-family="Inter" font-size="10" fill="#7a5a09">declarado</text></g>
            <text class="s2 pop" data-a="1" x="200" y="110" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="20" fill="var(--muted)">≈</text>
            <text class="s2 fadein" data-a="1" x="200" y="140" text-anchor="middle" font-family="Inter" font-size="9" fill="var(--muted)">se acerca</text>
            <!-- valores ya aceptados -->
            <g class="s2 slideR" data-a="1"><rect x="236" y="70" width="260" height="34" rx="8" fill="var(--ejemplo-soft)" stroke="var(--ejemplo-line)"/><text x="250" y="91" font-family="Inter" font-weight="600" font-size="11" fill="#14532d">VT de idénticas/similares (no vinculadas)</text></g>
            <g class="s2 slideR" data-a="2"><rect x="236" y="112" width="260" height="34" rx="8" fill="var(--ejemplo-soft)" stroke="var(--ejemplo-line)"/><text x="250" y="133" font-family="Inter" font-weight="600" font-size="11" fill="#14532d">Valor deductivo de idénticas/similares</text></g>
            <g class="s2 slideR" data-a="2"><rect x="236" y="154" width="260" height="34" rx="8" fill="var(--ejemplo-soft)" stroke="var(--ejemplo-line)"/><text x="250" y="175" font-family="Inter" font-weight="600" font-size="11" fill="#14532d">Valor reconstruido de idénticas/similares</text></g>
            <text class="s2 fadein" data-a="2" x="366" y="206" text-anchor="middle" font-family="Inter" font-size="10" fill="var(--muted)">= valores YA aceptados por la aduana</text>
            <!-- nota momento -->
            <g class="s2 slideU" data-a="3"><rect x="90" y="230" width="340" height="40" rx="10" fill="#eef4fb" stroke="var(--concept)" stroke-width="1.5"/><text x="260" y="255" text-anchor="middle" font-family="Inter" font-weight="600" font-size="11" fill="#173a63">en el mismo momento o uno aproximado</text></g>
          </svg>
        </section>

        <!-- ESCENA 3: cierre -->
        <section class="scene" data-scene="3">
          <svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg">
            <g class="s3 pop" data-a="0"><circle cx="260" cy="120" r="54" fill="var(--ejemplo-soft)" stroke="var(--ejemplo)" stroke-width="3"/><path d="M234 120 l18 18 l34 -38" fill="none" stroke="var(--ejemplo)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
            <text class="s3 slideU" data-a="0" x="260" y="212" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="18" fill="var(--ink)">Si el precio se acerca a un valor criterio…</text>
            <g class="s3 slideU" data-a="0"><rect x="80" y="232" width="360" height="50" rx="12" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2.5"/><text x="260" y="254" text-anchor="middle" font-family="Inter" font-weight="800" font-size="13" fill="#7a5a09">Queda probado que la vinculación</text><text x="260" y="273" text-anchor="middle" font-family="Inter" font-weight="800" font-size="13" fill="#7a5a09">NO distorsionó el precio</text></g>
          </svg>
        </section>

      </div>
      <div class="textpane" id="textpane"></div>
    </div>

    <div class="caption" id="caption">Tocá <b>Reproducir</b> para empezar la lección.</div>

    <div class="controls">
      <button class="btn play" id="playBtn">▶ Reproducir</button>
      <button class="btn ghost" id="prevBtn">◀</button>
      <button class="btn ghost" id="nextBtn">▶</button>
      <div class="progress"><i id="bar"></i></div>
      <span class="scenelabel" id="slabel">1 / 4</span>
      <div class="actrl">
        <label>Velocidad</label><select id="rateSel"><option value="0.9">Lenta</option><option value="1" selected>Normal</option><option value="1.25">Rápida</option><option value="1.5">Muy rápida</option></select>
      </div>
    </div>
  </div>

  <div class="dots" id="dots"></div>
  <p class="note">Lección completa con voz profesional (Marcus). Dale play y seguí la explicación.</p>
</div>

<script>
const AUDIOS={1:"../audio/t03-1.mp3",2:"../audio/t03-2.mp3",3:"../audio/t03-3.mp3",4:"../audio/t03-4.mp3"};
const META=[
  {tag:'La idea central',cls:'fx-err',h:'Vinculados ≠ descarte automático',sub:'Solo se descarta el art. 1 si la vinculación influyó en el precio.'},
  {tag:'Camino 1',cls:'fx-con',h:'Examen de las circunstancias',sub:'La aduana analiza si el precio es el de una venta normal.'},
  {tag:'Camino 2',cls:'fx-ej',h:'Valores criterio',sub:'El importador prueba que su valor se acerca a uno ya aceptado.'},
  {tag:'El cierre',cls:'fx-gold',h:'Se prueba que no distorsionó',sub:'Si se acerca a un valor criterio, la vinculación no influyó.'}
];
const SCENES=[
  {steps:[
    {a:0,say:"Vinculación y valores criterio. Este es uno de los temas más abstractos y más preguntados. La idea central: que el comprador y el vendedor estén vinculados no descarta automáticamente el valor de transacción."},
    {a:1,say:"Existe vinculación, por ejemplo, cuando una parte controla a la otra, cuando son socios, cuando son empleador y empleado, cuando una controla el capital de la otra, o cuando pertenecen a la misma familia."},
    {a:2,say:"Pero atención: solo se descarta el artículo primero si la vinculación influyó en el precio. La vinculación sola no alcanza."}
  ]},
  {steps:[
    {a:0,say:"¿Cómo sabemos si influyó? Primer camino: el examen de las circunstancias de la venta, que hace la aduana."},
    {a:1,say:"Analiza si el precio se fijó de manera compatible con las prácticas normales del sector."},
    {a:2,say:"Y si el vendedor cubrió sus costos y obtuvo un beneficio representativo."},
    {a:3,say:"Si el precio se comportó como el de una venta entre independientes, la vinculación no influyó y se acepta el artículo primero."}
  ]},
  {steps:[
    {a:0,say:"Segundo camino, que lo tiene el importador: demostrar que su valor se aproxima mucho a un valor criterio."},
    {a:1,say:"Los valores criterio son valores ya aceptados por la aduana: el valor de transacción de mercaderías idénticas o similares en ventas a compradores no vinculados,"},
    {a:2,say:"o el valor determinado por el método deductivo o el reconstruido para idénticas o similares."},
    {a:3,say:"Siempre en el mismo momento o en uno aproximado."}
  ]},
  {steps:[
    {a:0,say:"Si el precio declarado se acerca a alguno de esos valores criterio, queda probado que la vinculación no distorsionó el precio."}
  ]}
];

let si=0,pi=-1,playing=false,voices=[],chosenURI=null,rate=1,keepAlive=null;
const canvas=document.getElementById('canvas'),caption=document.getElementById('caption'),playBtn=document.getElementById('playBtn'),bar=document.getElementById('bar'),slabel=document.getElementById('slabel'),dotsWrap=document.getElementById('dots'),textpane=document.getElementById('textpane');
SCENES.forEach((_,i)=>{const d=document.createElement('div');d.className='dot'+(i===0?' on':'');d.onclick=()=>gotoScene(i);dotsWrap.appendChild(d);});
function paintDots(){[...dotsWrap.children].forEach((d,i)=>d.classList.toggle('on',i===si));}
function paintText(n){const m=META[n];textpane.innerHTML='<span class="fx-tag '+m.cls+'">'+m.tag+'</span><h2>'+m.h+'</h2><p class="sub">'+m.sub+'</p>';}
function showScene(n){[...canvas.querySelectorAll('.scene')].forEach(s=>s.classList.toggle('on',+s.dataset.scene===n));slabel.textContent=(n+1)+' / '+SCENES.length;bar.style.width=(n/(SCENES.length-1)*100)+'%';paintDots();paintText(n);}
function sel(n){return canvas.querySelector('.scene[data-scene="'+n+'"]');}
function resetAnims(n){sel(n).querySelectorAll('.s'+n).forEach(e=>e.classList.remove('show'));}
function showAnimsUpTo(n,a){sel(n).querySelectorAll('.s'+n).forEach(e=>{if(+e.dataset.a<=a)e.classList.add('show');});}
function showAllAnims(n){sel(n).querySelectorAll('.s'+n).forEach(e=>e.classList.add('show'));}
function highlight(t){return t.replace(/valor de transacción|vinculación|valores? criterio|examen de las circunstancias|influyó en el precio|artículo primero/gi,m=>'<b>'+m+'</b>');}

// Mapa escena -> lista de audios de Marcus (null = aún sin audio, usa voz navegador)
const SCENE_AUDIO = {0:[1], 1:[2], 2:[3], 3:[4]};
let curAudio=null;
function playAudioSeq(list, sceneIdx, done){
  // reproduce los audios de la escena en orden, revelando dibujos repartidos en cada audio
  let idx=0;
  const scene=SCENES[sceneIdx];
  const totalSteps=scene.steps.length;
  // repartir los pasos de animación entre los audios de la escena
  function playOne(){
    if(!playing){return;}
    if(idx>=list.length){ if(done)done(); return; }
    const src=AUDIOS[list[idx]];
    curAudio=new Audio(src);
    curAudio.playbackRate=rate;
    // revelar los dibujos de esta porción mientras suena
    curAudio.onloadedmetadata=function(){
      const dur=curAudio.duration||6;
      // qué pasos corresponden a este audio (reparto proporcional)
      const from=Math.floor(idx*totalSteps/list.length);
      const to=Math.floor((idx+1)*totalSteps/list.length);
      let k=from;
      showAnimsUpTo(sceneIdx, from);
      const gap=dur/Math.max(1,(to-from));
      const timer=setInterval(()=>{
        if(!playing){clearInterval(timer);return;}
        k++; if(k<=to) showAnimsUpTo(sceneIdx,k);
        if(k>=to) clearInterval(timer);
      }, gap*1000);
    };
    curAudio.onended=function(){ idx++; playOne(); };
    curAudio.onerror=function(){ idx++; playOne(); };
    curAudio.play().catch(()=>{ idx++; playOne(); });
  }
  playOne();
}

function playScene(){
  if(!playing)return;
  showScene(si); resetAnims(si);
  const list=SCENE_AUDIO[si]||[];
  caption.innerHTML=highlight(SCENES[si].steps.map(s=>s.say).join(' '));
  playAudioSeq(list, si, ()=>{
    if(!playing)return;
    if(si<SCENES.length-1){ si++; pi=-1; setTimeout(playScene,300); }
    else { stopPlay(); caption.innerHTML="Fin de la lección 👏"; }
  });
}
function startPlay(){playing=true;playBtn.innerHTML='❚❚ Pausar';playScene();}
function stopPlay(){playing=false;playBtn.innerHTML='▶ Reproducir';if(curAudio){curAudio.pause();curAudio=null;}if(keepAlive){clearInterval(keepAlive);keepAlive=null;}}
function togglePlay(){playing?stopPlay():startPlay();}
function gotoScene(n){stopPlay();si=n;pi=-1;showScene(n);resetAnims(n);showAllAnims(n);caption.innerHTML="Escena "+(n+1)+". Tocá reproducir para la narración desde acá.";}
playBtn.onclick=togglePlay;
document.getElementById('nextBtn').onclick=()=>{if(si<SCENES.length-1)gotoScene(si+1);};
document.getElementById('prevBtn').onclick=()=>{if(si>0)gotoScene(si-1);};
document.getElementById('rateSel').onchange=e=>{rate=parseFloat(e.target.value);if(curAudio)curAudio.playbackRate=rate;};
showScene(0);resetAnims(0);
</script>
