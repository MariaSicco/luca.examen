function startLevel(i){confT++;
  var l=LEVELS[i];
  cur={lv:l,li:i,idx:-1,errors:0,steps:l.steps,mode:'level'};
  renderIntro();
}
function renderIntro(){
  var l=cur.lv;
  h(lvTop(0)+'<div class="card introcase">'+whoHTML(l.client.id)+'<span class="steptag tag-brief">Caso '+(cur.li+1)+' · Tema '+l.tema+'</span><h2>'+esc(l.title)+'</h2><div class="bubble">'+l.intro+'</div>'+
    '<p style="margin:16px 0 0;font-weight:700;font-size:.9rem">Lo que vas a dominar al cerrar este caso:</p><ul class="objs">'+l.objs.map(function(o){return '<li>'+o+'</li>';}).join('')+'</ul>'+
    '<div class="cont"><button class="btn big" id="go">Aceptar el caso →</button></div></div>');
  bindTop();document.getElementById('go').onclick=next;
}
function lvTop(p){var n=cur.steps.length;return '<div class="lvtop"><button class="xbtn" id="xq" title="Salir al mapa">✕</button><div class="prog"><i style="width:'+Math.round(p*100)+'%"></i></div><span class="lvcount">'+(cur.idx<0?'Intro':(Math.min(cur.idx+1,n)+'/'+n))+'</span></div>';}
function bindTop(){var x=document.getElementById('xq');if(x)x.onclick=function(){guard(renderMap);};}
function next(){hideSheet();stopSpeak();cur.idx++;if(cur.idx>=cur.steps.length){finish();return;}renderStep();}
function miss(){cur.errors++;}
function renderStep(){
  var s=cur.steps[cur.idx],p=cur.idx/cur.steps.length;
  var R={brief:rBrief,choice:rChoice,classify:rClassify,order:rOrder,calc:rCalc,spot:rSpot}[s.t];
  h(lvTop(p)+'<div class="card" id="card"></div>');bindTop();
  R(s,document.getElementById('card'));
}
var TAGS={brief:['tag-brief','📘 Lo que tenés que saber'],choice:['tag-choice','🗣 Decisión'],classify:['tag-classify','🧩 Arrastrá y clasificá'],order:['tag-order','🔢 Ordená'],calc:['tag-calc','🧮 Calculadora del caso'],spot:['tag-spot','🔍 Encontrá el error']};
function tag(t){return '<span class="steptag '+TAGS[t][0]+'">'+TAGS[t][1]+'</span>';}

/* --- brief --- */
function rBrief(s,el){
  var id=cur.lv.id+':'+cur.idx;S.seen[id]=1;save();
  var bl=s.bullets||[];
  el.innerHTML=whoHTML(s.who||'marta')+'<button class="speak" id="spk">🔊 Escuchar</button>'+tag('brief')+'<h2>'+s.title+'</h2><div class="bubble">'+s.html+'</div>'+
    (bl.length?'<ul class="reveal-list" id="rl"></ul>':'')+(s.key?'<div class="key hide" id="kk"><b>◆ Anotá en la libreta: </b>'+s.key+'</div>':'')+(s.trap?'<div class="trap hide" id="tt"><b>⚠ Acá se desaprueba: </b>'+s.trap+'</div>':'')+
    '<div class="cont"><button class="btn big" id="nx">'+(bl.length?'Mostrame el primero →':'Entendido →')+'</button></div>';
  var k=0,nx=el.querySelector('#nx');
  function showEnd(){['kk','tt'].forEach(function(i){var e=el.querySelector('#'+i);if(e)e.classList.remove('hide');});nx.textContent='Entendido, sigamos →';}
  if(!bl.length)showEnd();
  nx.onclick=function(){
    if(k<bl.length){var li=document.createElement('li');li.innerHTML='<span class="n">'+(k+1)+'</span><span>'+bl[k]+'</span>';el.querySelector('#rl').appendChild(li);k++;tone([520+k*40],.06);
      if(k<bl.length)nx.textContent='Siguiente ('+(k)+'/'+bl.length+') →';else showEnd();li.scrollIntoView({behavior:'smooth',block:'nearest'});return;}
    next();};
  el.querySelector('#spk').onclick=function(){speakText(plain(s.title+'. '+s.html+' '+bl.join('. ')+' '+(s.key||'')+' '+(s.trap?'Ojo: '+s.trap:'')),this);};
}

/* --- choice --- */
function rChoice(s,el){
  var opts=s.keep?s.opts.slice():shuffle(s.opts);var failed=false;
  el.innerHTML=(s.who?whoHTML(s.who):'')+tag('choice')+(s.ctx?'<div class="bubble" style="margin-bottom:12px">'+s.ctx+'</div>':'')+'<div class="q">'+s.q+'</div><div class="opts">'+
    opts.map(function(o,i){return '<button class="opt" data-i="'+i+'">'+o.x+'</button>';}).join('')+'</div>';
  el.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){
    var o=opts[+b.dataset.i];
    if(o.ok){b.classList.add('good');el.querySelectorAll('.opt').forEach(function(x){x.disabled=true;});feedback(true,rnd(OKT),o.why||s.why||'',null,next);}
    else{b.classList.add('bad');b.disabled=true;if(!failed){miss();failed=true;}feedback(false,rnd(ERT),o.why||'Pensalo de nuevo.',null,null);}
  };});
}

/* --- drag helper --- */
window.clearGhosts=clearGhosts;function clearGhosts(){document.querySelectorAll('.ghost').forEach(function(g){g.remove();});document.querySelectorAll('[data-drop].hot').forEach(function(d){d.classList.remove('hot');});}
document.addEventListener('pointerup',function(){setTimeout(clearGhosts,0);},true);document.addEventListener('pointercancel',clearGhosts,true);window.addEventListener('blur',clearGhosts);document.addEventListener('visibilitychange',clearGhosts);
function makeDraggable(chip,onDrop,onTap){
  var sx,sy,drag=null,moved=false,pid=null;
  chip.addEventListener('pointerdown',function(e){if(chip.classList.contains('placed'))return;sx=e.clientX;sy=e.clientY;moved=false;pid=e.pointerId;try{chip.setPointerCapture(pid);}catch(x){}});
  chip.addEventListener('pointermove',function(e){if(pid===null||e.pointerId!==pid)return;var dx=e.clientX-sx,dy=e.clientY-sy;
    if(!moved&&Math.abs(dx)+Math.abs(dy)>8){moved=true;clearGhosts();drag=chip.cloneNode(true);drag.classList.add('ghost');drag.style.width=chip.offsetWidth+'px';document.body.appendChild(drag);}
    if(moved&&drag){if(e.clientY>innerHeight-70)window.scrollBy(0,14);else if(e.clientY<90)window.scrollBy(0,-14);drag.style.left=(e.clientX-chip.offsetWidth/2)+'px';drag.style.top=(e.clientY-20)+'px';
      document.querySelectorAll('[data-drop]').forEach(function(d){d.classList.remove('hot');});var t=document.elementFromPoint(e.clientX,e.clientY);var d=t&&t.closest('[data-drop]');if(d)d.classList.add('hot');}});
  function end(e){if(pid===null)return;pid=null;document.querySelectorAll('[data-drop]').forEach(function(d){d.classList.remove('hot');});
    if(moved&&drag){drag.remove();drag=null;var t=document.elementFromPoint(e.clientX,e.clientY);var d=t&&t.closest('[data-drop]');if(d)onDrop(d.dataset.drop);}
    else onTap();}
  chip.addEventListener('pointerup',end);chip.addEventListener('lostpointercapture',function(e){if(pid!==null&&moved)end(e);else if(drag){drag.remove();drag=null;}});chip.addEventListener('pointercancel',function(){pid=null;if(drag){drag.remove();drag=null;}});
}

/* --- classify --- */
function rClassify(s,el){
  var items=shuffle(s.items),left=items.length,sel=null,errs={};
  var cols=s.buckets.length;
  el.innerHTML=tag('classify')+'<div class="q">'+s.q+'</div><p class="hintline">Arrastrá cada tarjeta a su casillero, o tocá la tarjeta y después el casillero.</p><div class="pool" id="pool">'+
    items.map(function(it,i){return '<button class="chip" data-i="'+i+'">'+it.x+'</button>';}).join('')+'</div>'+
    '<div class="buckets" style="grid-template-columns:repeat(auto-fit,minmax('+(cols>3?150:200)+'px,1fr))">'+s.buckets.map(function(b){return '<div class="bucket '+(b.cls||'b-con')+'" data-drop="'+b.id+'"><h4>'+b.label+'</h4><div class="in"></div></div>';}).join('')+'</div>';
  function place(i,bid){
    var it=items[i],chip=el.querySelector('.chip[data-i="'+i+'"]');if(!chip||chip.classList.contains('placed'))return;
    el.querySelectorAll('.chip.sel').forEach(function(c){c.classList.remove('sel');});sel=null;
    if(it.b===bid){chip.classList.add('placed');el.querySelector('[data-drop="'+bid+'"] .in').appendChild(chip);left--;sOk();
      if(it.why&&s.explainOk!==false){} if(left===0){feedback(true,'¡Todo en su lugar!',s.done||'',null,next);} }
    else{chip.classList.remove('shake');void chip.offsetWidth;chip.classList.add('shake');if(!errs[i]){errs[i]=1;miss();}
      var bl=s.buckets.filter(function(b){return b.id===bid;})[0];
      feedback(false,'No va en "'+plain(bl.label)+'"',it.why||'Releé la consigna y probá otro casillero.',null,null);}
  }
  el.querySelectorAll('.chip').forEach(function(c){var i=+c.dataset.i;makeDraggable(c,function(bid){place(i,bid);},function(){if(c.classList.contains('placed'))return;el.querySelectorAll('.chip.sel').forEach(function(x){if(x!==c)x.classList.remove('sel');});c.classList.toggle('sel');sel=c.classList.contains('sel')?i:null;});});
  el.querySelectorAll('.bucket').forEach(function(b){b.addEventListener('click',function(e){if(e.target.closest('.chip'))return;if(sel!==null)place(sel,b.dataset.drop);});});
}

/* --- order --- */
function rOrder(s,el){
  var order=s.items.map(function(x,i){return{x:x.x||x,why:x.why,i:i};});var items=shuffle(order),pos=0,errd={};
  el.innerHTML=tag('order')+'<div class="q">'+s.q+'</div><p class="hintline">Tocá (o arrastrá) las tarjetas en el orden correcto.</p><div class="slots" id="slots" data-drop="slots">'+order.map(function(o,i){return '<div class="slot'+(i===0?' next':'')+'"><span class="sn">'+(i+1)+'</span><span class="st"></span></div>';}).join('')+'</div><div class="pool">'+
    items.map(function(it){return '<button class="chip" data-i="'+it.i+'">'+it.x+'</button>';}).join('')+'</div>';
  function put(i){
    var chip=el.querySelector('.chip[data-i="'+i+'"]');if(!chip||chip.classList.contains('placed'))return;
    if(i===pos){var sl=el.querySelectorAll('.slot')[pos];sl.classList.remove('next');sl.classList.add('filled');sl.querySelector('.st').innerHTML=order[i].x;chip.classList.add('placed');chip.style.display='none';pos++;sOk();
      var nx=el.querySelectorAll('.slot')[pos];if(nx)nx.classList.add('next');
      if(pos===order.length)feedback(true,'¡Orden perfecto!',s.done||'',null,next);}
    else{chip.classList.remove('shake');void chip.offsetWidth;chip.classList.add('shake');if(!errd[pos]){errd[pos]=1;miss();}
      feedback(false,'Ese no va en el lugar '+(pos+1),(order[i].why?order[i].why+' ':'')+(s.hint?s.hint:''),null,null);}
  }
  el.querySelectorAll('.chip').forEach(function(c){var i=+c.dataset.i;makeDraggable(c,function(){put(i);},function(){put(i);});});
}

/* --- calc --- */
function parseNum(v){v=String(v).replace(/[^\d.,\-]/g,'');if(!v)return NaN;
  if(v.indexOf(',')>=0){v=v.replace(/\./g,'').replace(',','.');}
  else if(/^\-?\d{1,3}(\.\d{3})+$/.test(v)){v=v.replace(/\./g,'');}
  return parseFloat(v);}
function fmt(n,d){return Number(n).toLocaleString('es-AR',{minimumFractionDigits:d||0,maximumFractionDigits:d===undefined?2:d});}
function rCalc(s,el){
  var fi=0;
  el.innerHTML=(s.who?whoHTML(s.who):'')+tag('calc')+'<div class="q">'+s.q+'</div>'+(s.doc||'')+s.fields.map(function(f,i){return '<div class="field'+(i>0?' locked':'')+'" data-f="'+i+'"><label>'+(i+1)+'. '+f.label+'</label><div class="frow">'+(f.unit?'<span class="u">'+f.unit+'</span>':'')+'<input inputmode="decimal" autocomplete="off" placeholder="Escribí el número"><button class="btn">Comprobar</button></div><div class="fmsg"></div></div>';}).join('')+(s.note?'<p class="hintline" style="margin-top:8px">'+s.note+'</p>':'');
  el.querySelectorAll('.field').forEach(function(fd){
    var i=+fd.dataset.f,f=s.fields[i],inp=fd.querySelector('input'),btn=fd.querySelector('.btn'),msg=fd.querySelector('.fmsg'),tries=0;
    function check(){var v=parseNum(inp.value);if(isNaN(v)){msg.className='fmsg e';msg.textContent='Escribí un número (podés usar punto de miles y coma decimal).';return;}
      var tol=f.tol!==undefined?f.tol:Math.max(1,Math.abs(f.ans)*0.002);
      if(Math.abs(v-f.ans)<=tol){fd.classList.add('done');inp.disabled=true;btn.remove();msg.className='fmsg o';msg.innerHTML='✓ '+(f.how||'');sOk();
        var nx=el.querySelector('.field[data-f="'+(i+1)+'"]');if(nx){nx.classList.remove('locked');setTimeout(function(){nx.querySelector('input').focus();},100);}
        else feedback(true,'¡Cuenta cerrada!',s.done||'',null,next);}
      else{tries++;if(tries===1)miss();sErr();msg.className='fmsg e';msg.innerHTML='✗ '+(f.hint||'Revisá la cuenta.')+(tries>=2?' <button class="howbtn">Ver cómo se llega</button>':'');
        var hb=msg.querySelector('.howbtn');if(hb)hb.onclick=function(){inp.value=fmt(f.ans,f.dec);msg.className='fmsg o';msg.innerHTML='Se llega así: '+(f.how||fmt(f.ans,f.dec))+'. Escribilo y tocá Comprobar para seguir.';};}}
    btn.onclick=check;inp.addEventListener('keydown',function(e){if(e.key==='Enter')check();});
  });
}

/* --- spot --- */
function rSpot(s,el){
  var need=s.rows.filter(function(r){return r.bad;}).length,found=0,penal={};
  el.innerHTML=(s.who?whoHTML(s.who):'')+tag('spot')+'<div class="q">'+s.q+'</div><div class="sdoc"><div class="dh"><span>'+s.title+'</span><span class="foundc" id="fc">0 de '+need+'</span></div>'+
    s.rows.map(function(r,i){return '<button class="srow" data-i="'+i+'"><span>'+r.x+'</span><span>'+(r.v||'')+'</span></button>';}).join('')+'</div><p class="hintline">Tocá cada renglón que está mal. Hay '+need+' error'+(need>1?'es':'')+'.</p>';
  el.querySelectorAll('.srow').forEach(function(b){b.onclick=function(){var i=+b.dataset.i,r=s.rows[i];if(b.classList.contains('found')||b.classList.contains('fine'))return;
    if(r.bad){b.classList.add('found');found++;el.querySelector('#fc').textContent=found+' de '+need;
      if(found===need)feedback(true,'¡Encontraste todos los errores!',r.why+(s.done?'<br><br>'+s.done:''),null,next);else feedback(true,'¡Error encontrado!',r.why,'Seguir buscando',null);}
    else{b.classList.add('fine');if(!penal[i]){penal[i]=1;miss();}feedback(false,'Ese renglón está bien',r.why||'Este dato es correcto.','Seguir buscando',null);}
  };});
}

/* ================= finish ================= */
function starsFor(e){return e<=2?3:(e<=5?2:1);}
function finish(){
  stopSpeak();
  if(cur.mode==='rel'){finishRel();return;}
  var l=cur.lv,st=starsFor(cur.errors),prev=S.levels[l.id]||{},firstDone=!prev.done;
  var gain=cur.steps.length*10+st*20;if(!firstDone)gain=Math.round(gain/4);
  S.levels[l.id]={done:true,stars:Math.max(st,prev.stars||0),errors:cur.errors};S.xp+=gain;save();updTop();sWin();confetti();
  var nextL=LEVELS[cur.li+1];
  var zoneDone=LEVELS.every(function(x){return isDone(x.id);});
  h('<div class="card endc"><div class="medal">'+(st===3?'🏆':(st===2?'🥈':'🎖'))+'</div><h2>Caso resuelto: '+esc(l.title)+'</h2><div class="bigstars">'+'★'.repeat(st)+'<span class="off">'+'★'.repeat(3-st)+'</span></div>'+
    '<div class="kv"><div><b>+'+gain+'</b><span>XP</span></div><div><b>'+cur.errors+'</b><span>tropiezos</span></div><div><b>'+rankOf(totalStars())[1]+'</b><span>tu rango</span></div></div>'+
    (st<3?'<p style="color:var(--muted);font-size:.9rem;margin:0">Podés volver a jugarlo cuando quieras para sacar las 3 estrellas.</p>':'')+
    '<div class="learned">'+l.objs.map(function(o){return '<span>✓ '+plain(o)+'</span>';}).join('')+'</div>'+
    '<div class="canans"><h3>🎓 Lo que ya podés responder en el final</h3><div class="sub">Probá contestarla en voz alta y después abrila para comparar con la respuesta modelo.</div>'+
    l.finals.map(function(f){return '<details class="fq"><summary><span class="badge '+(f.k==='Escrito'?'esc':'')+'">'+f.k+'</span><span>'+f.q+'</span></summary><div class="ans">'+f.a+'</div></details>';}).join('')+'</div>'+
    (zoneDone?'<div class="key" style="text-align:left;margin-top:18px"><b>🏅 ¡Zona Importación completa!</b> Resolviste los 11 casos. Usá el Repaso relámpago para mantenerlo fresco.</div>':'')+
    '<div class="endbtns"><button class="btn ghostb" id="eMap">Volver al mapa</button>'+(nextL?'<button class="btn okb" id="eNext">Siguiente caso →</button>':'')+'</div></div>');
  document.getElementById('eMap').onclick=renderMap;
  var en=document.getElementById('eNext');if(en)en.onclick=function(){startLevel(cur.li+1);};
}

/* ================= relámpago ================= */
function relampagoPool(){var p=[];LEVELS.forEach(function(l){if(!isDone(l.id))return;l.steps.forEach(function(s){if(s.t==='choice')p.push(s);});});return p;}
function startRelampago(){var pool=shuffle(relampagoPool()).slice(0,10);cur={lv:{id:'rel',title:'Repaso relámpago'},li:-1,idx:-1,errors:0,steps:pool,mode:'rel'};next();}
function finishRel(){var n=cur.steps.length,ok=n-cur.errors;var gain=ok*5;S.xp+=gain;save();updTop();if(ok>=n-1){sWin();confetti();}
  h('<div class="card endc"><div class="medal">⚡</div><h2>Repaso relámpago</h2><div class="kv"><div><b>'+ok+'/'+n+'</b><span>de primera</span></div><div><b>+'+gain+'</b><span>XP</span></div></div><p>'+(ok===n?'Perfecto. Esto ya lo tenés.':(ok>=n*0.7?'Muy bien. Lo que te costó, repasalo en tu libreta.':'Vale la pena volver a jugar los casos donde dudaste.'))+'</p><div class="endbtns"><button class="btn ghostb" id="eMap">Volver al mapa</button><button class="btn okb" id="eAg">Otra ronda ⚡</button></div></div>');
  document.getElementById('eMap').onclick=renderMap;document.getElementById('eAg').onclick=startRelampago;}

/* ================= libreta ================= */
function renderLib(){
  stopSpeak();hideSheet();cur=null;
  var html='<div class="lib"><h2>📒 Tu libreta de despachante</h2><p style="color:var(--muted);margin:0">Cada cosa que Marta te explicó queda anotada acá. Se va llenando a medida que jugás.</p>';
  var any=false;
  LEVELS.forEach(function(l){var notes=[];l.steps.forEach(function(s,i){if(s.t!=='brief')return;if(!S.seen[l.id+':'+i]&&!isDone(l.id))return;
      notes.push('<div class="libnote"><b>'+s.title+'.</b> '+(s.key||plain(s.html))+'</div>'+(s.trap?'<div class="libnote trap"><b>⚠ Acá se desaprueba:</b> '+s.trap+'</div>':''));});
    if(notes.length){any=true;html+='<div class="libcase"><h3>Caso '+(LEVELS.indexOf(l)+1)+' · '+esc(l.title)+' <span style="font-family:Inter;font-size:.78rem;color:var(--muted);font-weight:600">Tema '+l.tema+'</span></h3>'+notes.join('')+'</div>';}});
  if(!any)html+='<div class="libcase"><p class="empty">Todavía está vacía. Resolvé el primer caso y empezá a llenarla.</p></div>';
  html+='<div class="endbtns"><button class="btn ghostb" id="lb">← Volver al mapa</button></div></div>';
  h(html);document.getElementById('lb').onclick=renderMap;
}

/* ================= confetti ================= */
var confT=0;function confetti(){var my=++confT;var c=document.getElementById('confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;var cols=['#22548c','#1f7a4d','#d6a51c','#8a1c1c','#7a3c9a'];
  var P=[];for(var i=0;i<120;i++)P.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6,c:cols[i%5],a:Math.random()*6});
  var t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-4,-2,8+p.r,5);x.restore();});if(my!==confT){x.clearRect(0,0,c.width,c.height);return;}if(++t<160)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);})();}

/* ================= wiring ================= */
document.getElementById('goHome').onclick=function(){guard(renderMap);};
document.getElementById('btnLib').onclick=function(){guard(renderLib);};
document.getElementById('btnSnd').onclick=function(){S.sound=!S.sound;save();updTop();};
renderMap();
window.__agencia={S:S,LEVELS:LEVELS,startLevel:startLevel,next:next};
})();
</script>
