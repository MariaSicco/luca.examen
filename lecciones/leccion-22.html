<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lección animada — Tema 22 El Campeón de América</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f4; --paper:#ffffff; --ink:#1c2229; --muted:#5c6672; --line:#dde3ea;
  --brand:#8a1c1c;
  --concept:#22548c; --concept-soft:#e4edf6; --concept-line:#bcd2ea;
  --ejemplo:#1f7a4d; --ejemplo-soft:#e3f2e9; --ejemplo-line:#bfe0cd;
  --error:#b5451d; --error-soft:#fbe8e0; --error-line:#f0cbb9;
  --gold:#c9972a; --gold-soft:#f6edd6; --gold-line:#e6d3a3;
  --expo:#6b3fa0; --expo-soft:#efe7f8; --expo-line:#d6c4ec;
  --shadow:0 1px 3px rgba(20,30,45,.05),0 14px 40px rgba(20,30,45,.10);
  --radius:18px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:22px 16px 90px}
.lhead{background:linear-gradient(135deg,#6b3fa0,#422766);border-radius:var(--radius);padding:24px 26px;color:#fff;box-shadow:var(--shadow);border-bottom:5px solid var(--gold)}
.lhead .k{font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#d9c9ef;margin:0 0 6px}
.lhead h1{font-family:Fraunces,serif;font-weight:600;font-size:1.75rem;margin:0 0 5px;line-height:1.12}
.lhead p{margin:0;color:#e4d8f5;font-size:.94rem}
.player{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);margin-top:18px;overflow:hidden;border:1px solid var(--line)}
.stage{position:relative;background:radial-gradient(900px 340px at 50% 0%, #f6f0ff, #ffffff 72%);padding:0}
.canvas{position:relative;height:370px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid var(--line)}
@media(max-width:600px){.canvas{height:300px}}
.scene{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:14px}
.scene.on{display:flex;animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.scene svg{max-width:100%;max-height:100%;height:auto}
.textpane{padding:18px 26px 4px;min-height:84px}
.fx-tag{display:inline-block;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:4px 11px;border-radius:999px;margin-bottom:8px;color:#fff}
.fx-con{background:var(--concept)} .fx-err{background:var(--error)} .fx-gold{background:#9a7414} .fx-ej{background:var(--ejemplo)} .fx-expo{background:var(--expo)}
.textpane h2{font-family:Fraunces,serif;font-weight:600;font-size:1.3rem;margin:0 0 3px;color:var(--ink)}
.textpane .sub{color:var(--muted);font-size:.92rem;margin:0}
.caption{background:#141b24;color:#eef2f7;padding:14px 22px;font-size:1rem;line-height:1.5;min-height:58px;display:flex;align-items:center}
.caption b{color:#c9a7f5}
.controls{display:flex;align-items:center;gap:10px;padding:14px 18px;background:#f7f9fb;border-top:1px solid var(--line);flex-wrap:wrap}
.btn{border:none;border-radius:11px;padding:11px 18px;font-family:inherit;font-weight:600;font-size:.95rem;cursor:pointer;display:flex;align-items:center;gap:7px}
.btn.play{background:var(--expo);color:#fff}.btn.play:hover{background:#573186}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.ghost:hover{background:#eef2f6}
.progress{flex:1;min-width:110px;height:8px;background:#e2e8ef;border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--expo),var(--gold));transition:width .35s ease}
.scenelabel{font-size:.8rem;color:var(--muted);font-weight:600;white-space:nowrap}
.actrl{display:flex;align-items:center;gap:7px;width:100%;margin-top:4px;padding-top:12px;border-top:1px dashed var(--line)}
.actrl label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.actrl select{font-family:inherit;font-size:.82rem;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.dots{display:flex;gap:7px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:#cfd8e0;cursor:pointer;transition:.2s}
.dot.on{background:var(--expo);transform:scale(1.3)}
.note{font-size:.8rem;color:var(--muted);margin-top:14px;text-align:center}
/* anim */
.pop{opacity:0;transform:scale(.5);transform-origin:center;transition:opacity .3s ease,transform .34s cubic-bezier(.3,1.5,.5,1)}
.pop.show{opacity:1;transform:scale(1)}
.slideL{opacity:0;transform:translateX(-26px);transition:.36s ease}.slideL.show{opacity:1;transform:none}
.slideR{opacity:0;transform:translateX(26px);transition:.36s ease}.slideR.show{opacity:1;transform:none}
.slideU{opacity:0;transform:translateY(22px);transition:.36s ease}.slideU.show{opacity:1;transform:none}
.slideD{opacity:0;transform:translateY(-22px);transition:.36s ease}.slideD.show{opacity:1;transform:none}
.fadein{opacity:0;transition:opacity .45s ease}.fadein.show{opacity:1}
.pulse.show{animation:pulse 1.1s ease infinite}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.shake.show{animation:shake .45s ease}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.bob.show{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="lhead">
    <p class="k">Lección animada · Tema 22 · Ejercicio de examen</p>
    <h1>El Campeón de América: veladores (FAS)</h1>
    <p>El caso más completo de exportación, con muchos ajustes juntos. Dale play.</p>
  </div>

  <div class="player">
    <div class="stage">
      <div class="canvas" id="canvas">

        <!-- ESCENA 0: enunciado -->
        <section class="scene on" data-scene="0">
          <svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg">
            <text class="s0 slideD" data-a="0" x="260" y="26" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="16" fill="var(--ink)">El caso más completo de exportación</text>
            <g class="s0 pop" data-a="0"><rect x="60" y="42" width="400" height="40" rx="10" fill="var(--ejemplo-soft)" stroke="var(--ejemplo)" stroke-width="2"/><text x="260" y="67" text-anchor="middle" font-family="Inter" font-weight="800" font-size="12.5" fill="#14532d">11.000 veladores → Dinamarca</text></g>
            <g class="s0 pop" data-a="1"><rect x="90" y="92" width="340" height="40" rx="10" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2.5"/><text x="260" y="112" text-anchor="middle" font-family="Inter" font-weight="800" font-size="12" fill="#7a5a09">Condición FAS (al costado del buque)</text><text x="260" y="128" text-anchor="middle" font-family="Inter" font-size="10" fill="#7a5a09">valor entregado al costado del buque</text></g>
            <g class="s0 slideL" data-a="1"><rect x="55" y="142" width="180" height="40" rx="9" fill="var(--concept-soft)" stroke="var(--concept-line)"/><text x="145" y="162" text-anchor="middle" font-family="Inter" font-weight="700" font-size="10.5" fill="#173a63">Documenta en Córdoba</text><text x="145" y="177" text-anchor="middle" font-family="Inter" font-size="9.5" fill="#173a63">(aduana)</text></g>
            <text class="s0 pop" data-a="1" x="245" y="167" font-family="Inter" font-weight="800" font-size="16" fill="var(--brand)">→</text>
            <g class="s0 slideR" data-a="1"><rect x="270" y="142" width="195" height="40" rx="9" fill="var(--expo-soft)" stroke="var(--expo-line)"/><text x="367" y="162" text-anchor="middle" font-family="Inter" font-weight="700" font-size="10.5" fill="#422766">Carga en Buenos Aires</text><text x="367" y="177" text-anchor="middle" font-family="Inter" font-size="9.5" fill="#422766">(lugar de carga al exterior)</text></g>
          </svg>
        </section>

        <!-- ESCENA 1: los ajustes -->
        <section class="scene" data-scene="1">
          <svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg">
            <text class="s1 slideD" data-a="0" x="260" y="22" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="16" fill="var(--ink)">Los ajustes que hay que trabajar</text>
            <!-- prestación: bases gratis -->
            <g class="s1 pop" data-a="0"><rect x="30" y="36" width="460" height="48" rx="11" fill="var(--ejemplo-soft)" stroke="var(--ejemplo)" stroke-width="2"/><text x="50" y="56" font-family="Inter" font-weight="800" font-size="11" fill="#14532d">+ Bases plásticas enviadas GRATIS por el importador</text><text x="50" y="74" font-family="Inter" font-size="10" fill="#14532d">prestación del comprador → es un ajuste que se INCLUYE (con su CIF/unidad)</text></g>
            <!-- mermas -->
            <g class="s1 slideL" data-a="1"><rect x="30" y="92" width="460" height="48" rx="11" fill="var(--gold-soft)" stroke="var(--gold-line)"/><text x="50" y="112" font-family="Inter" font-weight="800" font-size="11" fill="#7a5a09">Mermas por insumos: cable y perillas</text><text x="50" y="130" font-family="Inter" font-size="10" fill="#7a5a09">cada uno con su relación insumo-producto y pérdida tangible del 3%</text></g>
            <!-- marca -->
            <g class="s1 slideL" data-a="1"><rect x="30" y="148" width="460" height="40" rx="11" fill="var(--expo-soft)" stroke="var(--expo-line)"/><text x="50" y="166" font-family="Inter" font-weight="800" font-size="11" fill="#422766">Pago por uso de MARCA</text><text x="50" y="182" font-family="Inter" font-size="10" fill="#422766">incluido en el precio</text></g>
            <text class="s1 fadein" data-a="1" x="260" y="208" text-anchor="middle" font-family="Inter" font-weight="700" font-size="10.5" fill="var(--muted)">cada concepto se justifica con su artículo</text>
          </svg>
        </section>

        <!-- ESCENA 2: descuentos + dos variantes -->
        <section class="scene" data-scene="2">
          <svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg">
            <text class="s2 slideD" data-a="0" x="260" y="24" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="16" fill="var(--ink)">Dos descuentos distintos</text>
            <g class="s2 slideL" data-a="0"><rect x="30" y="40" width="460" height="38" rx="10" fill="var(--concept-soft)" stroke="var(--concept-line)"/><text x="50" y="58" font-family="Inter" font-weight="700" font-size="10.5" fill="#173a63">① Por operación frecuente → está INCLUIDO</text><text x="50" y="73" font-family="Inter" font-size="9.5" fill="#173a63">(no se vuelve a sumar)</text></g>
            <g class="s2 slideL" data-a="0"><rect x="30" y="84" width="460" height="38" rx="10" fill="var(--error-soft)" stroke="var(--error-line)"/><text x="50" y="102" font-family="Inter" font-weight="700" font-size="10.5" fill="#8a2f11">② Por pago al contado → NO está incluido</text><text x="50" y="117" font-family="Inter" font-size="9.5" fill="#8a2f11">(se trata según corresponda)</text></g>
            <!-- dos variantes -->
            <text class="s2 slideD" data-a="1" x="260" y="146" text-anchor="middle" font-family="Inter" font-weight="800" font-size="12" fill="var(--expo)">El ejercicio se resuelve en DOS variantes:</text>
            <g class="s2 pop" data-a="1"><rect x="40" y="158" width="210" height="56" rx="12" fill="#fff" stroke="var(--ejemplo)" stroke-width="2.5"/><text x="145" y="182" text-anchor="middle" font-family="Inter" font-weight="800" font-size="12" fill="#14532d">A · derechos INCLUIDOS</text><text x="145" y="202" text-anchor="middle" font-family="Inter" font-size="10" fill="#14532d">(se usa coeficiente)</text></g>
            <g class="s2 pop" data-a="1"><rect x="270" y="158" width="210" height="56" rx="12" fill="#fff" stroke="var(--error)" stroke-width="2.5"/><text x="375" y="182" text-anchor="middle" font-family="Inter" font-weight="800" font-size="12" fill="#8a2f11">B · derechos NO incluidos</text><text x="375" y="202" text-anchor="middle" font-family="Inter" font-size="10" fill="#8a2f11">(sin coeficiente)</text></g>
          </svg>
        </section>

      </div>
      <div class="textpane" id="textpane"></div>
    </div>

    <div class="caption" id="caption">Tocá <b>Reproducir</b> para empezar la lección.</div>

    <div class="controls">
      <button class="btn play" id="playBtn">▶ Reproducir</button>
      <button class="btn ghost" id="prevBtn">◀</button>
      <button class="btn ghost" id="nextBtn">▶</button>
      <div class="progress"><i id="bar"></i></div>
      <span class="scenelabel" id="slabel">1 / 3</span>
      <div class="actrl">
        <label>Velocidad</label><select id="rateSel"><option value="0.9">Lenta</option><option value="1" selected>Normal</option><option value="1.25">Rápida</option><option value="1.5">Muy rápida</option></select>
      </div>
    </div>
  </div>

  <div class="dots" id="dots"></div>
  <p class="note">Lección completa con voz profesional (Marcus). Dale play y seguí la explicación.</p>
</div>

<script>
const AUDIOS={1:"../audio/t22-1.mp3",2:"../audio/t22-2.mp3",3:"../audio/t22-3.mp3"};
const META=[
  {tag:'El enunciado',cls:'fx-ej',h:'El Campeón de América',sub:'11.000 veladores a Dinamarca, condición FAS, documenta en Córdoba y carga en Buenos Aires.'},
  {tag:'Los ajustes',cls:'fx-gold',h:'Prestación, mermas, marca',sub:'Bases gratis = prestación que se incluye; mermas de cable y perillas (3%); pago por uso de marca.'},
  {tag:'Descuentos y cierre',cls:'fx-expo',h:'Dos descuentos, dos variantes',sub:'Uno incluido (frecuente) y otro no (contado). Se resuelve con derechos incluidos y no incluidos.'}
];
const SCENES=[
  {steps:[
    {a:0,say:"Ejercicio de examen: El Campeón de América. Es el caso más completo de exportación, con muchos ajustes juntos. La empresa exporta once mil veladores a Dinamarca,"},
    {a:1,say:"valor entregado al costado del buque, es decir condición FAS, documentando en la aduana de Córdoba, y carga con destino al exterior en Buenos Aires."}
  ]},
  {steps:[
    {a:0,say:"Los elementos que hay que trabajar: el importador envió a título gratuito las bases plásticas para los veladores, con un valor CIF por unidad, y como es una prestación del comprador es un ajuste que se incluye."},
    {a:1,say:"Hay mermas por insumos: el cable y las perillas, cada uno con su relación insumo producto y su pérdida tangible del tres por ciento. Hay un pago por uso de marca, incluido en el precio."}
  ]},
  {steps:[
    {a:0,say:"Hay dos descuentos: uno por operación frecuente que está incluido, y otro por pago al contado que no está incluido."},
    {a:1,say:"Y el ejercicio pide resolverlo en dos variantes: con los derechos incluidos y con los derechos no incluidos. Cada concepto se justifica con su artículo, se arma el FOB argentino y se calculan derecho de exportación y reintegro."}
  ]}
];

let si=0,pi=-1,playing=false,voices=[],chosenURI=null,rate=1,keepAlive=null;
const canvas=document.getElementById('canvas'),caption=document.getElementById('caption'),playBtn=document.getElementById('playBtn'),bar=document.getElementById('bar'),slabel=document.getElementById('slabel'),dotsWrap=document.getElementById('dots'),textpane=document.getElementById('textpane');
SCENES.forEach((_,i)=>{const d=document.createElement('div');d.className='dot'+(i===0?' on':'');d.onclick=()=>gotoScene(i);dotsWrap.appendChild(d);});
function paintDots(){[...dotsWrap.children].forEach((d,i)=>d.classList.toggle('on',i===si));}
function paintText(n){const m=META[n];textpane.innerHTML='<span class="fx-tag '+m.cls+'">'+m.tag+'</span><h2>'+m.h+'</h2><p class="sub">'+m.sub+'</p>';}
function showScene(n){[...canvas.querySelectorAll('.scene')].forEach(s=>s.classList.toggle('on',+s.dataset.scene===n));slabel.textContent=(n+1)+' / '+SCENES.length;bar.style.width=(n/(SCENES.length-1)*100)+'%';paintDots();paintText(n);}
function sel(n){return canvas.querySelector('.scene[data-scene="'+n+'"]');}
function resetAnims(n){sel(n).querySelectorAll('.s'+n).forEach(e=>e.classList.remove('show'));}
function showAnimsUpTo(n,a){sel(n).querySelectorAll('.s'+n).forEach(e=>{if(+e.dataset.a<=a)e.classList.add('show');});}
function showAllAnims(n){sel(n).querySelectorAll('.s'+n).forEach(e=>e.classList.add('show'));}
function highlight(t){return t.replace(/El Campeón de América|veladores|Dinamarca|al costado del buque|FAS|Córdoba|Buenos Aires|título gratuito|bases plásticas|prestación del comprador|CIF|mermas|cable|perillas|relación insumo producto|pérdida tangible|uso de marca|operación frecuente|pago al contado|derechos incluidos|derechos no incluidos|FOB|derecho de exportación|reintegro/g,m=>'<b>'+m+'</b>');}

const SCENE_AUDIO = {0:[1], 1:[2], 2:[3]};
let curAudio=null;
function playAudioSeq(list, sceneIdx, done){
  let idx=0;
  const scene=SCENES[sceneIdx];
  const totalSteps=scene.steps.length;
  function playOne(){
    if(!playing){return;}
    if(idx>=list.length){ if(done)done(); return; }
    const src=AUDIOS[list[idx]];
    curAudio=new Audio(src);
    curAudio.playbackRate=rate;
    curAudio.onloadedmetadata=function(){
      const dur=curAudio.duration||6;
      const from=Math.floor(idx*totalSteps/list.length);
      const to=Math.floor((idx+1)*totalSteps/list.length);
      let k=from;
      showAnimsUpTo(sceneIdx, from);
      const gap=dur/Math.max(1,(to-from));
      const timer=setInterval(()=>{
        if(!playing){clearInterval(timer);return;}
        k++; if(k<=to) showAnimsUpTo(sceneIdx,k);
        if(k>=to) clearInterval(timer);
      }, gap*1000);
    };
    curAudio.onended=function(){ idx++; playOne(); };
    curAudio.onerror=function(){ idx++; playOne(); };
    curAudio.play().catch(()=>{ idx++; playOne(); });
  }
  playOne();
}

function playScene(){
  if(!playing)return;
  showScene(si); resetAnims(si);
  const list=SCENE_AUDIO[si]||[];
  caption.innerHTML=highlight(SCENES[si].steps.map(s=>s.say).join(' '));
  playAudioSeq(list, si, ()=>{
    if(!playing)return;
    if(si<SCENES.length-1){ si++; pi=-1; setTimeout(playScene,300); }
    else { stopPlay(); caption.innerHTML="Fin de la lección 👏"; }
  });
}
function startPlay(){playing=true;playBtn.innerHTML='❚❚ Pausar';playScene();}
function stopPlay(){playing=false;playBtn.innerHTML='▶ Reproducir';if(curAudio){curAudio.pause();curAudio=null;}if(keepAlive){clearInterval(keepAlive);keepAlive=null;}}
function togglePlay(){playing?stopPlay():startPlay();}
function gotoScene(n){stopPlay();si=n;pi=-1;showScene(n);resetAnims(n);showAllAnims(n);caption.innerHTML="Escena "+(n+1)+". Tocá reproducir para la narración desde acá.";}
playBtn.onclick=togglePlay;
document.getElementById('nextBtn').onclick=()=>{if(si<SCENES.length-1)gotoScene(si+1);};
document.getElementById('prevBtn').onclick=()=>{if(si>0)gotoScene(si-1);};
document.getElementById('rateSel').onchange=e=>{rate=parseFloat(e.target.value);if(curAudio)curAudio.playbackRate=rate;};
showScene(0);resetAnims(0);
</script>
</body>
</html>
