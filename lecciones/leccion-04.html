<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lección animada — Tema 4 Ajustes art. 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f4; --paper:#ffffff; --ink:#1c2229; --muted:#5c6672; --line:#dde3ea;
  --brand:#8a1c1c;
  --concept:#22548c; --concept-soft:#e4edf6; --concept-line:#bcd2ea;
  --ejemplo:#1f7a4d; --ejemplo-soft:#e3f2e9; --ejemplo-line:#bfe0cd;
  --error:#b5451d; --error-soft:#fbe8e0; --error-line:#f0cbb9;
  --gold:#c9972a; --gold-soft:#f6edd6; --gold-line:#e6d3a3;
  --sky:#d9ecfb; --skin:#f2c9a0; --skin2:#e0ab82;
  --shadow:0 1px 3px rgba(20,30,45,.05),0 14px 40px rgba(20,30,45,.10);
  --radius:18px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:22px 16px 90px}
.lhead{background:linear-gradient(135deg,#22548c,#16375f);border-radius:var(--radius);padding:24px 26px;color:#fff;box-shadow:var(--shadow);border-bottom:5px solid var(--gold)}
.lhead .k{font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#bcd6f0;margin:0 0 6px}
.lhead h1{font-family:Fraunces,serif;font-weight:600;font-size:1.75rem;margin:0 0 5px;line-height:1.12}
.lhead p{margin:0;color:#d7e6f6;font-size:.94rem}
.player{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);margin-top:18px;overflow:hidden;border:1px solid var(--line)}
.stage{position:relative;background:radial-gradient(900px 340px at 50% 0%, #f0f8ff, #ffffff 72%);padding:0}
.canvas{position:relative;height:370px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid var(--line)}
@media(max-width:600px){.canvas{height:300px}}
.scene{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:14px}
.scene.on{display:flex;animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.scene svg{max-width:100%;max-height:100%;height:auto}
.textpane{padding:18px 26px 4px;min-height:84px}
.fx-tag{display:inline-block;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:4px 11px;border-radius:999px;margin-bottom:8px;color:#fff}
.fx-con{background:var(--concept)} .fx-err{background:var(--error)} .fx-gold{background:#9a7414} .fx-ej{background:var(--ejemplo)}
.textpane h2{font-family:Fraunces,serif;font-weight:600;font-size:1.3rem;margin:0 0 3px;color:var(--ink)}
.textpane .sub{color:var(--muted);font-size:.92rem;margin:0}
.caption{background:#141b24;color:#eef2f7;padding:14px 22px;font-size:1rem;line-height:1.5;min-height:58px;display:flex;align-items:center}
.caption b{color:#9ecbf5}
.controls{display:flex;align-items:center;gap:10px;padding:14px 18px;background:#f7f9fb;border-top:1px solid var(--line);flex-wrap:wrap}
.btn{border:none;border-radius:11px;padding:11px 18px;font-family:inherit;font-weight:600;font-size:.95rem;cursor:pointer;display:flex;align-items:center;gap:7px}
.btn.play{background:var(--concept);color:#fff}.btn.play:hover{background:#1a4273}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.ghost:hover{background:#eef2f6}
.progress{flex:1;min-width:110px;height:8px;background:#e2e8ef;border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--concept),var(--gold));transition:width .35s ease}
.scenelabel{font-size:.8rem;color:var(--muted);font-weight:600;white-space:nowrap}
.actrl{display:flex;align-items:center;gap:7px;width:100%;margin-top:4px;padding-top:12px;border-top:1px dashed var(--line)}
.actrl label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.actrl select{font-family:inherit;font-size:.82rem;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.actrl select.voice{flex:1;min-width:140px}
.dots{display:flex;gap:7px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:#cfd8e0;cursor:pointer;transition:.2s}
.dot.on{background:var(--concept);transform:scale(1.3)}
.note{font-size:.8rem;color:var(--muted);margin-top:14px;text-align:center}
/* anim */
.pop{opacity:0;transform:scale(.5);transform-origin:center;transition:opacity .3s ease,transform .34s cubic-bezier(.3,1.5,.5,1)}
.pop.show{opacity:1;transform:scale(1)}
.slideL{opacity:0;transform:translateX(-26px);transition:.36s ease}.slideL.show{opacity:1;transform:none}
.slideR{opacity:0;transform:translateX(26px);transition:.36s ease}.slideR.show{opacity:1;transform:none}
.slideU{opacity:0;transform:translateY(22px);transition:.36s ease}.slideU.show{opacity:1;transform:none}
.slideD{opacity:0;transform:translateY(-22px);transition:.36s ease}.slideD.show{opacity:1;transform:none}
.fadein{opacity:0;transition:opacity .45s ease}.fadein.show{opacity:1}
.draw{transition:stroke-dashoffset .8s ease}.draw.show{stroke-dashoffset:0!important}
.pulse.show{animation:pulse 1.1s ease infinite}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.float.show{animation:float 2.6s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.swing.show{animation:swing 2.4s ease-in-out infinite;transform-origin:top center}@keyframes swing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.shake.show{animation:shake .45s ease}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.spin.show{animation:spin .9s ease}@keyframes spin{from{transform:rotate(-14deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
.bob.show{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="lhead">
    <p class="k">Lección animada · Tema 4 · Importación</p>
    <h1>Art. 8 — Ajustes al precio</h1>
    <p>El corazón de la parte práctica. Dale play y seguilo.</p>
  </div>

  <div class="player">
    <div class="stage">
      <div class="canvas" id="canvas">

        <!-- ============ ESCENA 0: PUERTO con grúa, barco, aduana ============ -->
                <!-- ESCENA 0: el problema - Bruselas (precio teórico) vs valor real -->
                <!-- ESCENA 0: la lógica del art.8 -->
        <section class="scene on" data-scene="0">
          <svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg">
            <text class="s0 slideD" data-a="0" x="260" y="30" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="18" fill="var(--ink)">La lógica del artículo 8</text>
            <text class="s0 fadein" data-a="0" x="260" y="52" text-anchor="middle" font-family="Inter" font-size="12" fill="var(--muted)">el corazón de la parte práctica del final</text>
            <!-- precio base -->
            <g class="s0 pop" data-a="0"><rect x="150" y="76" width="220" height="50" rx="12" fill="var(--concept-soft)" stroke="var(--concept)" stroke-width="2.5"/><text x="260" y="100" text-anchor="middle" font-family="Inter" font-weight="700" font-size="13" fill="var(--concept)">Precio realmente pagado</text><text x="260" y="117" text-anchor="middle" font-family="Inter" font-size="11" fill="var(--muted)">el punto de partida</text></g>
            <!-- + lo que falta -->
            <g class="s0 slideL" data-a="1"><rect x="60" y="150" width="180" height="46" rx="10" fill="var(--ejemplo-soft)" stroke="var(--ejemplo)" stroke-width="2"/><text x="150" y="170" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="16" fill="var(--ejemplo)">+ sumar</text><text x="150" y="187" text-anchor="middle" font-family="Inter" font-size="10.5" fill="#14532d">lo que falte</text></g>
            <!-- - lo que no corresponde -->
            <g class="s0 slideR" data-a="1"><rect x="280" y="150" width="180" height="46" rx="10" fill="var(--error-soft)" stroke="var(--error)" stroke-width="2"/><text x="370" y="170" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="16" fill="var(--error)">− restar</text><text x="370" y="187" text-anchor="middle" font-family="Inter" font-size="10.5" fill="#8a2f11">lo que no corresponda</text></g>
            <!-- resultado -->
            <g class="s0 slideU" data-a="2"><rect x="120" y="222" width="280" height="50" rx="12" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2.5"/><text x="260" y="253" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="17" fill="#7a5a09">VALOR EN ADUANA</text></g>
            <text class="s0 fadein" data-a="2" x="260" y="296" text-anchor="middle" font-family="Inter" font-size="11" fill="var(--muted)">solo con datos objetivos y cuantificables, y si no están ya incluidos</text>
          </svg>
        </section>

        <!-- ESCENA 1: ajustes 1-3 -->
        <section class="scene" data-scene="1">
          <svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg">
            <text class="s1 slideD" data-a="0" x="260" y="28" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="17" fill="var(--ejemplo)">Ajustes a SUMAR (1 a 3)</text>
            <!-- 1 comisiones -->
            <g class="s1 slideL" data-a="0"><rect x="40" y="52" width="440" height="56" rx="10" fill="var(--ejemplo-soft)" stroke="var(--ejemplo-line)"/><circle cx="72" cy="80" r="16" fill="var(--ejemplo)"/><text x="72" y="85" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="15" fill="#fff">1</text><text x="100" y="76" font-family="Inter" font-weight="700" font-size="13" fill="#14532d">Comisiones y corretaje</text><text x="100" y="94" font-family="Inter" font-size="11" fill="#8a2f11">⚠ salvo las comisiones de COMPRA (no se suman)</text></g>
            <!-- 2 envases -->
            <g class="s1 slideL" data-a="1"><rect x="40" y="116" width="440" height="50" rx="10" fill="var(--ejemplo-soft)" stroke="var(--ejemplo-line)"/><circle cx="72" cy="141" r="16" fill="var(--ejemplo)"/><text x="72" y="146" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="15" fill="#fff">2</text><text x="100" y="138" font-family="Inter" font-weight="700" font-size="13" fill="#14532d">Envases y embalajes</text><text x="100" y="155" font-family="Inter" font-size="11" fill="var(--muted)">se tratan como un todo con la mercadería</text></g>
            <!-- 3 prestaciones -->
            <g class="s1 slideL" data-a="2"><rect x="40" y="174" width="440" height="66" rx="10" fill="var(--ejemplo-soft)" stroke="var(--ejemplo-line)"/><circle cx="72" cy="207" r="16" fill="var(--ejemplo)"/><text x="72" y="212" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="15" fill="#fff">3</text><text x="100" y="196" font-family="Inter" font-weight="700" font-size="13" fill="#14532d">Prestaciones del comprador</text><text x="100" y="213" font-family="Inter" font-size="11" fill="var(--muted)">bienes/servicios gratis o rebajados para producir:</text><text x="100" y="229" font-family="Inter" font-size="11" fill="var(--muted)">materiales, herramientas, matrices, ingeniería (fuera del país)</text></g>
          </svg>
        </section>

        <!-- ESCENA 2: ajustes 4-6 + descuentos admisibles -->
        <section class="scene" data-scene="2">
          <svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg">
            <text class="s2 slideD" data-a="0" x="260" y="24" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="17" fill="var(--ejemplo)">Ajustes a SUMAR (4 a 6)</text>
            <g class="s2 slideL" data-a="0"><rect x="30" y="40" width="460" height="38" rx="9" fill="var(--ejemplo-soft)" stroke="var(--ejemplo-line)"/><circle cx="56" cy="59" r="14" fill="var(--ejemplo)"/><text x="56" y="64" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="13" fill="#fff">4</text><text x="80" y="64" font-family="Inter" font-weight="600" font-size="12" fill="#14532d">Cánones y derechos de licencia (condición de venta)</text></g>
            <g class="s2 slideL" data-a="1"><rect x="30" y="84" width="460" height="38" rx="9" fill="var(--ejemplo-soft)" stroke="var(--ejemplo-line)"/><circle cx="56" cy="103" r="14" fill="var(--ejemplo)"/><text x="56" y="108" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="13" fill="#fff">5</text><text x="80" y="108" font-family="Inter" font-weight="600" font-size="12" fill="#14532d">Reversión: lo que vuelve al vendedor de una reventa</text></g>
            <g class="s2 slideL" data-a="2"><rect x="30" y="128" width="460" height="48" rx="9" fill="var(--ejemplo-soft)" stroke="var(--ejemplo-line)"/><circle cx="56" cy="152" r="14" fill="var(--ejemplo)"/><text x="56" y="157" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="13" fill="#fff">6</text><text x="80" y="148" font-family="Inter" font-weight="600" font-size="12" fill="#14532d">Transporte, carga, descarga y seguro</text><text x="80" y="165" font-family="Inter" font-size="10.5" fill="#7a5a09">hasta el puerto → Argentina valora sobre base CIF</text></g>
            <!-- descuentos admisibles -->
            <g class="s2 pop" data-a="3"><rect x="90" y="198" width="340" height="60" rx="12" fill="#e3f2e9" stroke="var(--ejemplo)" stroke-width="2.5"/><text x="260" y="222" text-anchor="middle" font-family="Inter" font-weight="800" font-size="13" fill="var(--ejemplo)">Descuentos ADMISIBLES</text><text x="260" y="242" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="15" fill="#14532d">se aceptan y se DEDUCEN (−)</text></g>
          </svg>
        </section>

        <!-- ESCENA 3: descuentos NO admisibles -->
        <section class="scene" data-scene="3">
          <svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg">
            <text class="s3 slideD" data-a="0" x="260" y="34" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="18" fill="var(--error)">Descuentos NO admisibles</text>
            <text class="s3 fadein" data-a="0" x="260" y="56" text-anchor="middle" font-family="Inter" font-size="12" fill="var(--muted)">la trampa: se SUMAN de nuevo al precio</text>
            <g class="s3 slideL" data-a="0"><rect x="60" y="78" width="400" height="40" rx="10" fill="var(--error-soft)" stroke="var(--error-line)"/><text x="80" y="103" font-family="Inter" font-weight="600" font-size="12.5" fill="#8a2f11">✗ Descuento por pago anticipado</text></g>
            <g class="s3 slideL" data-a="0"><rect x="60" y="126" width="400" height="40" rx="10" fill="var(--error-soft)" stroke="var(--error-line)"/><text x="80" y="151" font-family="Inter" font-weight="600" font-size="12.5" fill="#8a2f11">✗ Descuento hasta agotar stock</text></g>
            <g class="s3 slideL" data-a="0"><rect x="60" y="174" width="400" height="40" rx="10" fill="var(--error-soft)" stroke="var(--error-line)"/><text x="80" y="199" font-family="Inter" font-weight="600" font-size="12.5" fill="#8a2f11">✗ Descuento para compensar envíos anteriores</text></g>
            <g class="s3 pop shake" data-a="0"><rect x="110" y="232" width="300" height="52" rx="12" fill="var(--error)" /><text x="260" y="255" text-anchor="middle" font-family="Inter" font-weight="800" font-size="13" fill="#fff">Se AJUSTAN en positivo (+)</text><text x="260" y="274" text-anchor="middle" font-family="Inter" font-size="11" fill="#fbe8e0">se suman de nuevo para el valor en aduana</text></g>
          </svg>
        </section>

      </div>
      <div class="textpane" id="textpane"></div>
    </div>

    <div class="caption" id="caption">Tocá <b>Reproducir</b> para empezar la lección.</div>

    <div class="controls">
      <button class="btn play" id="playBtn">▶ Reproducir</button>
      <button class="btn ghost" id="prevBtn">◀</button>
      <button class="btn ghost" id="nextBtn">▶</button>
      <div class="progress"><i id="bar"></i></div>
      <span class="scenelabel" id="slabel">1 / 4</span>
      <div class="actrl">
        <label>Velocidad</label><select id="rateSel"><option value="0.9">Lenta</option><option value="1" selected>Normal</option><option value="1.25">Rápida</option><option value="1.5">Muy rápida</option></select>
      </div>
    </div>
  </div>

  <div class="dots" id="dots"></div>
  <p class="note">Lección completa con voz profesional (Marcus). Dale play y seguí la explicación.</p>
</div>

<script>
const AUDIOS={1:"../audio/t04-1.mp3",2:"../audio/t04-2.mp3",3:"../audio/t04-3.mp3",4:"../audio/t04-4.mp3"};
const META=[
  {tag:'La lógica',cls:'fx-con',h:'La lógica del art. 8',sub:'Precio + lo que falta − lo que no corresponde = valor en aduana.'},
  {tag:'Ajustes 1-3',cls:'fx-ej',h:'Qué se suma al precio',sub:'Comisiones, envases, prestaciones del comprador.'},
  {tag:'Ajustes 4-6',cls:'fx-ej',h:'Lo que falta sumar',sub:'Cánones, reversión, transporte y seguro (base CIF). Descuentos admisibles.'},
  {tag:'La trampa',cls:'fx-err',h:'Descuentos NO admisibles',sub:'Se suman de nuevo al precio en vez de restarse.'}
];
const SCENES=[
  {steps:[
    {a:0,say:"Artículo octavo: los ajustes. Este es el corazón de la parte práctica del final. La lógica es sencilla: el valor en aduana se construye partiendo del precio realmente pagado o por pagar."},
    {a:1,say:"Y sumando lo que falte, o restando lo que no corresponda."},
    {a:2,say:"El artículo octavo dice qué añadir, siempre que no esté ya incluido y que se base en datos objetivos y cuantificables."}
  ]},
  {steps:[
    {a:0,say:"Los ajustes a sumar. Primero, las comisiones y gastos de corretaje. Atención: salvo las comisiones de compra, que no se suman."},
    {a:1,say:"Segundo, los envases y embalajes, que a efectos aduaneros se tratan como un todo con la mercadería."},
    {a:2,say:"Tercero, las prestaciones: bienes o servicios que el comprador suministra gratis o a precio reducido para producir la mercadería, como materiales, herramientas, matrices o trabajos de ingeniería hechos fuera del país."}
  ]},
  {steps:[
    {a:0,say:"Cuarto, los cánones y derechos de licencia relacionados con la mercadería que el comprador deba pagar como condición de venta."},
    {a:1,say:"Quinto, el producto de una reventa posterior que revierta al vendedor."},
    {a:2,say:"Y sexto, los gastos de transporte, carga, descarga y manipulación, y el seguro, hasta el puerto de importación, porque Argentina valora sobre base CIF."},
    {a:3,say:"Ahora, atención a los descuentos. Los descuentos admisibles se aceptan y se deducen."}
  ]},
  {steps:[
    {a:0,say:"Pero los descuentos no admisibles, como el descuento por pago anticipado, el descuento hasta agotar stock o el descuento para compensar envíos anteriores, deben ajustarse en positivo: es decir, sumarse de nuevo al precio para llegar al valor en aduana."}
  ]}
];

let si=0,pi=-1,playing=false,voices=[],chosenURI=null,rate=1,keepAlive=null;
const canvas=document.getElementById('canvas'),caption=document.getElementById('caption'),playBtn=document.getElementById('playBtn'),bar=document.getElementById('bar'),slabel=document.getElementById('slabel'),dotsWrap=document.getElementById('dots'),textpane=document.getElementById('textpane');
SCENES.forEach((_,i)=>{const d=document.createElement('div');d.className='dot'+(i===0?' on':'');d.onclick=()=>gotoScene(i);dotsWrap.appendChild(d);});
function paintDots(){[...dotsWrap.children].forEach((d,i)=>d.classList.toggle('on',i===si));}
function paintText(n){const m=META[n];textpane.innerHTML='<span class="fx-tag '+m.cls+'">'+m.tag+'</span><h2>'+m.h+'</h2><p class="sub">'+m.sub+'</p>';}
function showScene(n){[...canvas.querySelectorAll('.scene')].forEach(s=>s.classList.toggle('on',+s.dataset.scene===n));slabel.textContent=(n+1)+' / '+SCENES.length;bar.style.width=(n/(SCENES.length-1)*100)+'%';paintDots();paintText(n);}
function sel(n){return canvas.querySelector('.scene[data-scene="'+n+'"]');}
function resetAnims(n){sel(n).querySelectorAll('.s'+n).forEach(e=>e.classList.remove('show'));}
function showAnimsUpTo(n,a){sel(n).querySelectorAll('.s'+n).forEach(e=>{if(+e.dataset.a<=a)e.classList.add('show');});}
function showAllAnims(n){sel(n).querySelectorAll('.s'+n).forEach(e=>e.classList.add('show'));}
function highlight(t){return t.replace(/artículo octavo|valor en aduana|comisiones de compra|CIF|datos objetivos|admisibles|no admisibles/gi,m=>'<b>'+m+'</b>');}

// Mapa escena -> lista de audios de Marcus (null = aún sin audio, usa voz navegador)
const SCENE_AUDIO = {0:[1], 1:[2], 2:[3], 3:[4]};
let curAudio=null;
function playAudioSeq(list, sceneIdx, done){
  // reproduce los audios de la escena en orden, revelando dibujos repartidos en cada audio
  let idx=0;
  const scene=SCENES[sceneIdx];
  const totalSteps=scene.steps.length;
  // repartir los pasos de animación entre los audios de la escena
  function playOne(){
    if(!playing){return;}
    if(idx>=list.length){ if(done)done(); return; }
    const src=AUDIOS[list[idx]];
    curAudio=new Audio(src);
    curAudio.playbackRate=rate;
    // revelar los dibujos de esta porción mientras suena
    curAudio.onloadedmetadata=function(){
      const dur=curAudio.duration||6;
      // qué pasos corresponden a este audio (reparto proporcional)
      const from=Math.floor(idx*totalSteps/list.length);
      const to=Math.floor((idx+1)*totalSteps/list.length);
      let k=from;
      showAnimsUpTo(sceneIdx, from);
      const gap=dur/Math.max(1,(to-from));
      const timer=setInterval(()=>{
        if(!playing){clearInterval(timer);return;}
        k++; if(k<=to) showAnimsUpTo(sceneIdx,k);
        if(k>=to) clearInterval(timer);
      }, gap*1000);
    };
    curAudio.onended=function(){ idx++; playOne(); };
    curAudio.onerror=function(){ idx++; playOne(); };
    curAudio.play().catch(()=>{ idx++; playOne(); });
  }
  playOne();
}

function playScene(){
  if(!playing)return;
  showScene(si); resetAnims(si);
  const list=SCENE_AUDIO[si]||[];
  caption.innerHTML=highlight(SCENES[si].steps.map(s=>s.say).join(' '));
  playAudioSeq(list, si, ()=>{
    if(!playing)return;
    if(si<SCENES.length-1){ si++; pi=-1; setTimeout(playScene,300); }
    else { stopPlay(); caption.innerHTML="Fin de la lección 👏"; }
  });
}
function startPlay(){playing=true;playBtn.innerHTML='❚❚ Pausar';playScene();}
function stopPlay(){playing=false;playBtn.innerHTML='▶ Reproducir';if(curAudio){curAudio.pause();curAudio=null;}if(keepAlive){clearInterval(keepAlive);keepAlive=null;}}
function togglePlay(){playing?stopPlay():startPlay();}
function gotoScene(n){stopPlay();si=n;pi=-1;showScene(n);resetAnims(n);showAllAnims(n);caption.innerHTML="Escena "+(n+1)+". Tocá reproducir para la narración desde acá.";}
playBtn.onclick=togglePlay;
document.getElementById('nextBtn').onclick=()=>{if(si<SCENES.length-1)gotoScene(si+1);};
document.getElementById('prevBtn').onclick=()=>{if(si>0)gotoScene(si-1);};
document.getElementById('rateSel').onchange=e=>{rate=parseFloat(e.target.value);if(curAudio)curAudio.playbackRate=rate;};
showScene(0);resetAnims(0);
</script>
</body>
