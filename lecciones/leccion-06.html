<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lección animada — Tema 6 Método deductivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f4; --paper:#ffffff; --ink:#1c2229; --muted:#5c6672; --line:#dde3ea;
  --brand:#8a1c1c;
  --concept:#22548c; --concept-soft:#e4edf6; --concept-line:#bcd2ea;
  --ejemplo:#1f7a4d; --ejemplo-soft:#e3f2e9; --ejemplo-line:#bfe0cd;
  --error:#b5451d; --error-soft:#fbe8e0; --error-line:#f0cbb9;
  --gold:#c9972a; --gold-soft:#f6edd6; --gold-line:#e6d3a3;
  --sky:#d9ecfb; --skin:#f2c9a0; --skin2:#e0ab82;
  --shadow:0 1px 3px rgba(20,30,45,.05),0 14px 40px rgba(20,30,45,.10);
  --radius:18px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:22px 16px 90px}
.lhead{background:linear-gradient(135deg,#22548c,#16375f);border-radius:var(--radius);padding:24px 26px;color:#fff;box-shadow:var(--shadow);border-bottom:5px solid var(--gold)}
.lhead .k{font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#bcd6f0;margin:0 0 6px}
.lhead h1{font-family:Fraunces,serif;font-weight:600;font-size:1.75rem;margin:0 0 5px;line-height:1.12}
.lhead p{margin:0;color:#d7e6f6;font-size:.94rem}
.player{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);margin-top:18px;overflow:hidden;border:1px solid var(--line)}
.stage{position:relative;background:radial-gradient(900px 340px at 50% 0%, #f0f8ff, #ffffff 72%);padding:0}
.canvas{position:relative;height:370px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid var(--line)}
@media(max-width:600px){.canvas{height:300px}}
.scene{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:14px}
.scene.on{display:flex;animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.scene svg{max-width:100%;max-height:100%;height:auto}
.textpane{padding:18px 26px 4px;min-height:84px}
.fx-tag{display:inline-block;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:4px 11px;border-radius:999px;margin-bottom:8px;color:#fff}
.fx-con{background:var(--concept)} .fx-err{background:var(--error)} .fx-gold{background:#9a7414} .fx-ej{background:var(--ejemplo)}
.textpane h2{font-family:Fraunces,serif;font-weight:600;font-size:1.3rem;margin:0 0 3px;color:var(--ink)}
.textpane .sub{color:var(--muted);font-size:.92rem;margin:0}
.caption{background:#141b24;color:#eef2f7;padding:14px 22px;font-size:1rem;line-height:1.5;min-height:58px;display:flex;align-items:center}
.caption b{color:#9ecbf5}
.controls{display:flex;align-items:center;gap:10px;padding:14px 18px;background:#f7f9fb;border-top:1px solid var(--line);flex-wrap:wrap}
.btn{border:none;border-radius:11px;padding:11px 18px;font-family:inherit;font-weight:600;font-size:.95rem;cursor:pointer;display:flex;align-items:center;gap:7px}
.btn.play{background:var(--concept);color:#fff}.btn.play:hover{background:#1a4273}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.ghost:hover{background:#eef2f6}
.progress{flex:1;min-width:110px;height:8px;background:#e2e8ef;border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--concept),var(--gold));transition:width .35s ease}
.scenelabel{font-size:.8rem;color:var(--muted);font-weight:600;white-space:nowrap}
.actrl{display:flex;align-items:center;gap:7px;width:100%;margin-top:4px;padding-top:12px;border-top:1px dashed var(--line)}
.actrl label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.actrl select{font-family:inherit;font-size:.82rem;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.actrl select.voice{flex:1;min-width:140px}
.dots{display:flex;gap:7px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:#cfd8e0;cursor:pointer;transition:.2s}
.dot.on{background:var(--concept);transform:scale(1.3)}
.note{font-size:.8rem;color:var(--muted);margin-top:14px;text-align:center}
/* anim */
.pop{opacity:0;transform:scale(.5);transform-origin:center;transition:opacity .3s ease,transform .34s cubic-bezier(.3,1.5,.5,1)}
.pop.show{opacity:1;transform:scale(1)}
.slideL{opacity:0;transform:translateX(-26px);transition:.36s ease}.slideL.show{opacity:1;transform:none}
.slideR{opacity:0;transform:translateX(26px);transition:.36s ease}.slideR.show{opacity:1;transform:none}
.slideU{opacity:0;transform:translateY(22px);transition:.36s ease}.slideU.show{opacity:1;transform:none}
.slideD{opacity:0;transform:translateY(-22px);transition:.36s ease}.slideD.show{opacity:1;transform:none}
.fadein{opacity:0;transition:opacity .45s ease}.fadein.show{opacity:1}
.draw{transition:stroke-dashoffset .8s ease}.draw.show{stroke-dashoffset:0!important}
.pulse.show{animation:pulse 1.1s ease infinite}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.float.show{animation:float 2.6s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.swing.show{animation:swing 2.4s ease-in-out infinite;transform-origin:top center}@keyframes swing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.shake.show{animation:shake .45s ease}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.spin.show{animation:spin .9s ease}@keyframes spin{from{transform:rotate(-14deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
.bob.show{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="lhead">
    <p class="k">Lección animada · Tema 6 · Importación</p>
    <h1>Art. 5 — Método deductivo</h1>
    <p>El 4º método, de lógica inversa. Dale play y seguilo.</p>
  </div>

  <div class="player">
    <div class="stage">
      <div class="canvas" id="canvas">

        <!-- ============ ESCENA 0: PUERTO con grúa, barco, aduana ============ -->
                <!-- ESCENA 0: el problema - Bruselas (precio teórico) vs valor real -->
                <!-- ESCENA 0: la lógica inversa -->
        <section class="scene on" data-scene="0">
          <svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg">
            <text class="s0 slideD" data-a="0" x="260" y="30" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="18" fill="var(--ink)">Método deductivo (art. 5)</text>
            <text class="s0 fadein" data-a="0" x="260" y="52" text-anchor="middle" font-family="Inter" font-size="12" fill="var(--muted)">el 4º método · lógica INVERSA</text>
            <!-- los otros métodos: exportación -> valor -->
            <g class="s0 pop" data-a="0"><rect x="40" y="80" width="200" height="60" rx="12" fill="#f3f3f3" stroke="var(--muted)" stroke-width="2"/><text x="140" y="104" text-anchor="middle" font-family="Inter" font-weight="700" font-size="12" fill="var(--muted)">Los otros métodos</text><text x="140" y="124" text-anchor="middle" font-family="Inter" font-size="10.5" fill="var(--muted)">parten del precio de EXPORTACIÓN</text></g>
            <!-- deductivo: reventa -> resta -->
            <g class="s0 pop" data-a="1"><rect x="280" y="80" width="200" height="60" rx="12" fill="var(--concept-soft)" stroke="var(--concept)" stroke-width="2.5"/><text x="380" y="104" text-anchor="middle" font-family="Inter" font-weight="800" font-size="12" fill="var(--concept)">Deductivo</text><text x="380" y="124" text-anchor="middle" font-family="Inter" font-size="10.5" fill="#173a63">parte del precio de REVENTA</text></g>
            <!-- flujo: reventa en el país - lo que no es la mercadería -->
            <g class="s0 slideU" data-a="1"><rect x="90" y="166" width="150" height="46" rx="10" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/><text x="165" y="186" text-anchor="middle" font-family="Inter" font-weight="700" font-size="12" fill="#7a5a09">Precio de reventa</text><text x="165" y="202" text-anchor="middle" font-family="Inter" font-size="10" fill="#7a5a09">en el país de importación</text></g>
            <text class="s0 pop" data-a="1" x="265" y="194" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="24" fill="var(--error)">−</text>
            <g class="s0 slideU" data-a="1"><rect x="290" y="166" width="170" height="46" rx="10" fill="var(--error-soft)" stroke="var(--error)" stroke-width="2"/><text x="375" y="186" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11.5" fill="#8a2f11">lo que NO es la mercadería</text><text x="375" y="202" text-anchor="middle" font-family="Inter" font-size="10" fill="#8a2f11">importada</text></g>
            <g class="s0 pop" data-a="1"><rect x="140" y="240" width="240" height="46" rx="12" fill="var(--ejemplo-soft)" stroke="var(--ejemplo)" stroke-width="2.5"/><text x="260" y="268" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="16" fill="var(--ejemplo)">= Valor en aduana</text></g>
          </svg>
        </section>

        <!-- ESCENA 1: la base -->
        <section class="scene" data-scene="1">
          <svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg">
            <text class="s1 slideD" data-a="0" x="260" y="30" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="17" fill="var(--ink)">¿De qué precio se parte?</text>
            <g class="s1 pop" data-a="0"><rect x="60" y="56" width="400" height="60" rx="12" fill="var(--concept-soft)" stroke="var(--concept)" stroke-width="2.5"/><text x="260" y="80" text-anchor="middle" font-family="Inter" font-weight="800" font-size="13" fill="var(--concept)">Precio de la MAYOR cantidad total vendida</text><text x="260" y="100" text-anchor="middle" font-family="Inter" font-size="11" fill="var(--muted)">de la mercadería importada (o idénticas/similares)</text></g>
            <text class="s1 fadein" data-a="0" x="260" y="140" text-anchor="middle" font-family="Inter" font-weight="700" font-size="12" fill="var(--muted)">con estas condiciones:</text>
            <g class="s1 slideL" data-a="1"><rect x="50" y="154" width="420" height="34" rx="8" fill="#f3f6fa" stroke="var(--concept-line)"/><text x="68" y="175" font-family="Inter" font-weight="600" font-size="11.5" fill="#173a63">en el mismo estado en que se importaron</text></g>
            <g class="s1 slideL" data-a="1"><rect x="50" y="194" width="420" height="34" rx="8" fill="#f3f6fa" stroke="var(--concept-line)"/><text x="68" y="215" font-family="Inter" font-weight="600" font-size="11.5" fill="#173a63">a personas NO vinculadas en el país de importación</text></g>
            <g class="s1 slideL" data-a="1"><rect x="50" y="234" width="420" height="34" rx="8" fill="#f3f6fa" stroke="var(--concept-line)"/><text x="68" y="255" font-family="Inter" font-weight="600" font-size="11.5" fill="#173a63">en el mismo momento o en uno aproximado</text></g>
            <text class="s1 fadein" data-a="1" x="260" y="294" text-anchor="middle" font-family="Inter" font-size="11" fill="var(--muted)">a ese precio se le practican deducciones →</text>
          </svg>
        </section>

        <!-- ESCENA 2: las deducciones -->
        <section class="scene" data-scene="2">
          <svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg">
            <text class="s2 slideD" data-a="0" x="260" y="30" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="17" fill="var(--error)">Deducciones (−): el mercado interno</text>
            <text class="s2 fadein" data-a="0" x="260" y="52" text-anchor="middle" font-family="Inter" font-size="11.5" fill="var(--muted)">todo lo que NADA tiene que ver con el precio de exportación</text>
            <g class="s2 slideL" data-a="0"><rect x="50" y="70" width="420" height="54" rx="10" fill="var(--error-soft)" stroke="var(--error-line)"/><text x="68" y="92" font-family="Inter" font-weight="700" font-size="12.5" fill="#8a2f11">− Comisiones, o beneficios y gastos generales</text><text x="68" y="110" font-family="Inter" font-size="10.5" fill="var(--muted)">pagados o convenidos en la reventa</text></g>
            <g class="s2 slideL" data-a="1"><rect x="50" y="134" width="420" height="48" rx="10" fill="var(--error-soft)" stroke="var(--error-line)"/><text x="68" y="156" font-family="Inter" font-weight="700" font-size="12.5" fill="#8a2f11">− Transporte y seguro DENTRO del país</text><text x="68" y="173" font-family="Inter" font-size="10.5" fill="var(--muted)">los internos, no los internacionales</text></g>
            <g class="s2 slideL" data-a="2"><rect x="50" y="192" width="420" height="54" rx="10" fill="var(--error-soft)" stroke="var(--error-line)"/><text x="68" y="214" font-family="Inter" font-weight="700" font-size="12.5" fill="#8a2f11">− Derechos, impuestos aduaneros y tributos</text><text x="68" y="232" font-family="Inter" font-size="10.5" fill="var(--muted)">pagados en el país de importación</text></g>
            <g class="s2 pop" data-a="2"><rect x="150" y="262" width="220" height="40" rx="10" fill="var(--ejemplo-soft)" stroke="var(--ejemplo)" stroke-width="2"/><text x="260" y="287" text-anchor="middle" font-family="Inter" font-weight="800" font-size="12" fill="var(--ejemplo)">lo que queda = valor en aduana</text></g>
          </svg>
        </section>

        <!-- ESCENA 3: orden + súper deductivo -->
        <section class="scene" data-scene="3">
          <svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg">
            <text class="s3 slideD" data-a="0" x="260" y="28" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="16" fill="var(--ink)">Orden de aplicación</text>
            <g class="s3 pop" data-a="0"><rect x="60" y="44" width="400" height="30" rx="8" fill="var(--concept-soft)" stroke="var(--concept-line)"/><text x="80" y="64" font-family="Inter" font-weight="600" font-size="11.5" fill="#173a63">1º precio de la mercadería que se importa</text></g>
            <g class="s3 pop" data-a="0"><rect x="60" y="80" width="400" height="30" rx="8" fill="var(--concept-soft)" stroke="var(--concept-line)"/><text x="80" y="100" font-family="Inter" font-weight="600" font-size="11.5" fill="#173a63">2º si no, de mercaderías idénticas</text></g>
            <g class="s3 pop" data-a="0"><rect x="60" y="116" width="400" height="30" rx="8" fill="var(--concept-soft)" stroke="var(--concept-line)"/><text x="80" y="136" font-family="Inter" font-weight="600" font-size="11.5" fill="#173a63">3º si no, de similares</text></g>
            <!-- súper deductivo -->
            <text class="s3 slideD" data-a="1" x="260" y="180" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="15" fill="var(--gold)">Súper deductivo</text>
            <g class="s3 pop" data-a="1"><rect x="50" y="192" width="420" height="96" rx="12" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/><text x="260" y="214" text-anchor="middle" font-family="Inter" font-weight="700" font-size="12" fill="#7a5a09">cuando la mercadería NO se vende igual,</text><text x="260" y="232" text-anchor="middle" font-family="Inter" font-size="11.5" fill="#7a5a09">sino transformada después de importada</text><text x="260" y="258" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11.5" fill="#7a5a09">se parte del precio del producto transformado</text><text x="260" y="276" text-anchor="middle" font-family="Inter" font-size="11" fill="#8a6a0f">y se deduce ADEMÁS el valor añadido por la transformación</text></g>
          </svg>
        </section>

        <!-- ESCENA 4: dato de examen 90 días -->
        <section class="scene" data-scene="4">
          <svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg">
            <g class="s4 pop" data-a="0"><circle cx="260" cy="130" r="64" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="4"/><text x="260" y="122" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="40" fill="#7a5a09">90</text><text x="260" y="152" text-anchor="middle" font-family="Inter" font-weight="700" font-size="16" fill="#7a5a09">días</text></g>
            <text class="s4 slideU" data-a="0" x="260" y="232" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="18" fill="var(--ink)">Dato de examen</text>
            <text class="s4 slideU" data-a="0" x="260" y="262" text-anchor="middle" font-family="Inter" font-weight="600" font-size="13" fill="var(--muted)">el método deductivo trabaja con un plazo de 90 días</text>
          </svg>
        </section>

      </div>
      <div class="textpane" id="textpane"></div>
    </div>

    <div class="caption" id="caption">Tocá <b>Reproducir</b> para empezar la lección.</div>

    <div class="controls">
      <button class="btn play" id="playBtn">▶ Reproducir</button>
      <button class="btn ghost" id="prevBtn">◀</button>
      <button class="btn ghost" id="nextBtn">▶</button>
      <div class="progress"><i id="bar"></i></div>
      <span class="scenelabel" id="slabel">1 / 5</span>
      <div class="actrl">
        <label>Velocidad</label><select id="rateSel"><option value="0.9">Lenta</option><option value="1" selected>Normal</option><option value="1.25">Rápida</option><option value="1.5">Muy rápida</option></select>
      </div>
    </div>
  </div>

  <div class="dots" id="dots"></div>
  <p class="note">Lección completa con voz profesional (Marcus). Dale play y seguí la explicación.</p>
</div>

<script>
const AUDIOS={1:"../audio/t06-1.mp3",2:"../audio/t06-2.mp3",3:"../audio/t06-3.mp3",4:"../audio/t06-4.mp3",5:"../audio/t06-5.mp3"};
const META=[
  {tag:'La lógica',cls:'fx-con',h:'Lógica inversa',sub:'Parte del precio de reventa y resta lo que no es la mercadería.'},
  {tag:'La base',cls:'fx-con',h:'De qué precio se parte',sub:'La mayor cantidad vendida a no vinculados, en el mismo estado.'},
  {tag:'Las deducciones',cls:'fx-err',h:'Qué se resta',sub:'Comisiones/beneficios, transporte interno, tributos.'},
  {tag:'El orden',cls:'fx-gold',h:'Orden y súper deductivo',sub:'Importada → idénticas → similares. Y la variante transformada.'},
  {tag:'Dato clave',cls:'fx-gold',h:'El plazo de 90 días',sub:'Lo que cae en el examen.'}
];
const SCENES=[
  {steps:[
    {a:0,say:"Artículo quinto: el método deductivo. Es el cuarto método en el orden. Su lógica es inversa a la de los anteriores: ellos parten del precio de exportación."},
    {a:1,say:"El deductivo, en cambio, parte del precio de reventa en el país de importación, y le resta todo lo que no tiene que ver con el valor de la mercadería importada, para llegar al valor en aduana."}
  ]},
  {steps:[
    {a:0,say:"El valor se basa en el precio unitario al que se venda la mayor cantidad total de las mercaderías importadas, o de idénticas o similares."},
    {a:1,say:"En el mismo estado en que se importaron, a personas no vinculadas en el país de importación, en el mismo momento o en uno aproximado. A ese precio se le practican deducciones."}
  ]},
  {steps:[
    {a:0,say:"Las deducciones son los elementos del mercado interno que nada tienen que ver con el precio de exportación: las comisiones pagadas o convenidas, o los beneficios y gastos generales;"},
    {a:1,say:"los gastos de transporte y seguro dentro del país de importación;"},
    {a:2,say:"y los derechos e impuestos aduaneros y demás tributos pagados en el país de importación. Lo que queda es el valor en aduana."}
  ]},
  {steps:[
    {a:0,say:"El orden de aplicación es: primero, a partir del precio de la primera venta de la mercadería que se importa; si no, de idénticas; si no, de similares."},
    {a:1,say:"Y existe una variante, el método súper deductivo, que se usa cuando la mercadería no se vende en el mismo estado, sino transformada después de importada. En ese caso se parte del precio del producto transformado y se deduce, además, el valor añadido por esa transformación."}
  ]},
  {steps:[
    {a:0,say:"Un dato de examen: el método deductivo trabaja con un plazo de noventa días."}
  ]}
];

let si=0,pi=-1,playing=false,voices=[],chosenURI=null,rate=1,keepAlive=null;
const canvas=document.getElementById('canvas'),caption=document.getElementById('caption'),playBtn=document.getElementById('playBtn'),bar=document.getElementById('bar'),slabel=document.getElementById('slabel'),dotsWrap=document.getElementById('dots'),textpane=document.getElementById('textpane');
SCENES.forEach((_,i)=>{const d=document.createElement('div');d.className='dot'+(i===0?' on':'');d.onclick=()=>gotoScene(i);dotsWrap.appendChild(d);});
function paintDots(){[...dotsWrap.children].forEach((d,i)=>d.classList.toggle('on',i===si));}
function paintText(n){const m=META[n];textpane.innerHTML='<span class="fx-tag '+m.cls+'">'+m.tag+'</span><h2>'+m.h+'</h2><p class="sub">'+m.sub+'</p>';}
function showScene(n){[...canvas.querySelectorAll('.scene')].forEach(s=>s.classList.toggle('on',+s.dataset.scene===n));slabel.textContent=(n+1)+' / '+SCENES.length;bar.style.width=(n/(SCENES.length-1)*100)+'%';paintDots();paintText(n);}
function sel(n){return canvas.querySelector('.scene[data-scene="'+n+'"]');}
function resetAnims(n){sel(n).querySelectorAll('.s'+n).forEach(e=>e.classList.remove('show'));}
function showAnimsUpTo(n,a){sel(n).querySelectorAll('.s'+n).forEach(e=>{if(+e.dataset.a<=a)e.classList.add('show');});}
function showAllAnims(n){sel(n).querySelectorAll('.s'+n).forEach(e=>e.classList.add('show'));}
function highlight(t){return t.replace(/deductivo|precio de reventa|mayor cantidad|no vinculadas|súper deductivo|noventa días|valor en aduana/gi,m=>'<b>'+m+'</b>');}

// Mapa escena -> lista de audios de Marcus (null = aún sin audio, usa voz navegador)
const SCENE_AUDIO = {0:[1], 1:[2], 2:[3], 3:[4], 4:[5]};
let curAudio=null;
function playAudioSeq(list, sceneIdx, done){
  // reproduce los audios de la escena en orden, revelando dibujos repartidos en cada audio
  let idx=0;
  const scene=SCENES[sceneIdx];
  const totalSteps=scene.steps.length;
  // repartir los pasos de animación entre los audios de la escena
  function playOne(){
    if(!playing){return;}
    if(idx>=list.length){ if(done)done(); return; }
    const src=AUDIOS[list[idx]];
    curAudio=new Audio(src);
    curAudio.playbackRate=rate;
    // revelar los dibujos de esta porción mientras suena
    curAudio.onloadedmetadata=function(){
      const dur=curAudio.duration||6;
      // qué pasos corresponden a este audio (reparto proporcional)
      const from=Math.floor(idx*totalSteps/list.length);
      const to=Math.floor((idx+1)*totalSteps/list.length);
      let k=from;
      showAnimsUpTo(sceneIdx, from);
      const gap=dur/Math.max(1,(to-from));
      const timer=setInterval(()=>{
        if(!playing){clearInterval(timer);return;}
        k++; if(k<=to) showAnimsUpTo(sceneIdx,k);
        if(k>=to) clearInterval(timer);
      }, gap*1000);
    };
    curAudio.onended=function(){ idx++; playOne(); };
    curAudio.onerror=function(){ idx++; playOne(); };
    curAudio.play().catch(()=>{ idx++; playOne(); });
  }
  playOne();
}

function playScene(){
  if(!playing)return;
  showScene(si); resetAnims(si);
  const list=SCENE_AUDIO[si]||[];
  caption.innerHTML=highlight(SCENES[si].steps.map(s=>s.say).join(' '));
  playAudioSeq(list, si, ()=>{
    if(!playing)return;
    if(si<SCENES.length-1){ si++; pi=-1; setTimeout(playScene,300); }
    else { stopPlay(); caption.innerHTML="Fin de la lección 👏"; }
  });
}
function startPlay(){playing=true;playBtn.innerHTML='❚❚ Pausar';playScene();}
function stopPlay(){playing=false;playBtn.innerHTML='▶ Reproducir';if(curAudio){curAudio.pause();curAudio=null;}if(keepAlive){clearInterval(keepAlive);keepAlive=null;}}
function togglePlay(){playing?stopPlay():startPlay();}
function gotoScene(n){stopPlay();si=n;pi=-1;showScene(n);resetAnims(n);showAllAnims(n);caption.innerHTML="Escena "+(n+1)+". Tocá reproducir para la narración desde acá.";}
playBtn.onclick=togglePlay;
document.getElementById('nextBtn').onclick=()=>{if(si<SCENES.length-1)gotoScene(si+1);};
document.getElementById('prevBtn').onclick=()=>{if(si>0)gotoScene(si-1);};
document.getElementById('rateSel').onchange=e=>{rate=parseFloat(e.target.value);if(curAudio)curAudio.playbackRate=rate;};
showScene(0);resetAnims(0);
</script>
